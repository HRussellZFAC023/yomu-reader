name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - academy/**
      - docs/**
      - dist/yomu.css
      - dist/yomu.user.js
      - package.json
      - package-lock.json
      - public/newtab/**
      - public/academy/**
      - public/yomu-icon.svg
      - src/**
      - scripts/annotate-greasyfork-requires.cjs
      - scripts/build-greasyfork-libraries.mjs
      - scripts/build-openapi.mjs
      - scripts/openapi/**
      - scripts/lib/greasyfork-libraries.cjs
      - scripts/sync-docs-userscript.cjs
      - scripts/sync-academy.cjs
      - scripts/lib/userscript-build-utils.cjs
      - vite.config.ts
      - config/vite/academy.config.ts
      - config/vite/greasyfork-library.config.ts
      - config/vite/newtab.config.ts
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # configure-pages performs a GitHub API preflight that can fail on a
      # transient 5xx before any build work starts. Retry it twice, but keep
      # the final attempt required so persistent configuration/auth failures
      # remain release-blocking rather than producing a false green.
      - name: Setup Pages metadata (attempt 1)
        id: configure_pages_1
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Back off before Pages metadata retry
        if: steps.configure_pages_1.outcome == 'failure'
        run: sleep 15
      - name: Setup Pages metadata (attempt 2)
        if: steps.configure_pages_1.outcome == 'failure'
        id: configure_pages_2
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Back off before final Pages metadata attempt
        if: steps.configure_pages_1.outcome == 'failure' && steps.configure_pages_2.outcome == 'failure'
        run: sleep 30
      - name: Setup Pages metadata (required final attempt)
        if: steps.configure_pages_1.outcome == 'failure' && steps.configure_pages_2.outcome == 'failure'
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run build:academy
      - run: npm run docs:build
        env:
          YOMU_GOOGLE_SITE_VERIFICATION: ${{ secrets.YOMU_GOOGLE_SITE_VERIFICATION }}
          YOMU_BING_SITE_VERIFICATION: ${{ secrets.YOMU_BING_SITE_VERIFICATION }}
          YOMU_YANDEX_SITE_VERIFICATION: ${{ secrets.YOMU_YANDEX_SITE_VERIFICATION }}
          YOMU_BAIDU_SITE_VERIFICATION: ${{ secrets.YOMU_BAIDU_SITE_VERIFICATION }}
          YOMU_PATREON_ENABLED: ${{ vars.YOMU_PATREON_ENABLED }}
          YOMU_PATREON_URL: ${{ vars.YOMU_PATREON_URL }}
          YOMU_KOFI_URL: ${{ vars.YOMU_KOFI_URL }}
      - run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
