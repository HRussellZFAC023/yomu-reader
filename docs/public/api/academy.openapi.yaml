            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/EmptyObject"
      "x-yomu-same-origin": true
  "/academy/api/auth/google/reader":
    "post":
      "operationId": "ensureReaderAccountSession"
      "tags":
        - "Authentication"
      "summary": "Prepare Reader account sign-in"
      "description": "Keeps an active or resumable paid, invite, Reader, or linked recovery session. Converts an unlinked recovery session to Reader, and creates a free Reader session only when the request carries no usable session family."
      "security": []
      "responses":
        "200":
          "description": "The existing session was kept or resumed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReaderAuthSession"
        "201":
          "description": "A free Reader auth session was created."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReaderAuthSession"
        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "A concurrent rotation consumed the presented token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "The request was not same-origin."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "The presented session family changed in another request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not prepare sign-in."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/EmptyObject"
      "x-yomu-same-origin": true
  "/academy/api/auth/google/start":
    "get":
      "operationId": "startGoogleOidc"
      "tags":
        - "Authentication"
      "summary": "Begin Google OIDC"
      "description": "Redirects the active session to Google. Browser navigation only."
      "security":
        -
          "sessionCookie": []
      "responses":
        "302":
          "description": "Redirect to Google."
          "headers":
            "Location":
              "schema":
                "type": "string"
                "format": "uri"
        "401":
          "description": "No active session."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "returnTo"
          "in": "query"
          "required": false
          "description": "Safe same-origin route after sign-in."
          "schema":
            "type": "string"
  "/academy/api/auth/google/callback":
    "get":
      "operationId": "completeGoogleOidc"
      "tags":
        - "Authentication"
      "summary": "Complete Google OIDC"
      "description": "Google callback endpoint. This is not called directly by application code."
      "security": []
      "responses":
        "302":
          "description": "Redirect back to Academy after success or a normalized failure."
          "headers":
            "Location":
              "schema":
                "type": "string"
                "format": "uri"
      "parameters":
        -
          "name": "code"
          "in": "query"
          "required": false
          "description": "Google authorization code."
          "schema":
            "type": "string"
        -
          "name": "state"
          "in": "query"
          "required": false
          "description": "OIDC state token."
          "schema":
            "type": "string"
  "/academy/api/account":
    "get":
      "operationId": "getAcademyAccount"
      "tags":
        - "Account"
      "summary": "Read the signed-in account"
      "description": "Returns public account preferences, class memberships, and Academy-access state."
      "security":
