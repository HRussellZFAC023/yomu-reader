name: Release Yomu Gaming

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-appimage
            runner: ubuntu-latest
            platform: linux
            arch: x64
            target: AppImage
          - name: windows-x64-portable
            runner: windows-latest
            platform: win32
            arch: x64
            target: portable
          - name: macos-x64-zip
            runner: macos-latest
            platform: darwin
            arch: x64
            target: zip
          - name: macos-arm64-zip
            runner: macos-latest
            platform: darwin
            arch: arm64
            target: zip

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare Electron runtime
        run: npm run prepare:electron

      - name: Build Yomu Gaming
        run: npm run build:gaming

      - name: Smoke Yomu Gaming
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node scripts/gaming-app-smoke.mjs
          else
            node scripts/gaming-app-smoke.mjs
          fi

      - name: Package Yomu Gaming
        run: node scripts/package-gaming-electron.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --target=${{ matrix.target }}

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist-gaming/release-assets
          find dist-gaming/packages -maxdepth 1 -type f -name 'yomu-gaming-*' -exec cp {} dist-gaming/release-assets/ \;
          test -n "$(find dist-gaming/release-assets -maxdepth 1 -type f -print -quit)"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v5
        with:
          name: yomu-gaming-${{ matrix.name }}
          path: dist-gaming/release-assets/*
          if-no-files-found: error

  checksums:
    name: Checksums and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v5
        with:
          name: yomu-gaming-release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          upload_release_assets() {
            local tag="$1"
            shift
            local asset attempt output
            for asset in "$@"; do
              for attempt in 1 2 3 4 5; do
                if output="$(gh release upload "$tag" "$asset" --clobber 2>&1)"; then
                  [ -z "$output" ] || printf '%s\n' "$output"
                  break
                fi
                printf '%s\n' "$output" >&2
                if ! grep -Eiq 'HTTP (408|429|5[0-9][0-9])|timed? out|timeout|connection (reset|refused|closed)|unexpected EOF|TLS handshake|temporar(il)?y unavailable|try again|server is currently unavailable' <<< "$output"; then
                  echo "Non-retryable release upload failure for ${asset}." >&2
                  return 1
                fi
                if [ "$attempt" -eq 5 ]; then
                  echo "Failed to upload ${asset} after ${attempt} attempts." >&2
                  return 1
                fi
                sleep "$((attempt * 15))"
              done
            done
          }

          cat > release-notes-gaming.md <<EOF
          Yomu Gaming desktop release artifacts for ${TAG}.

          Primary Linux x64 AppImage is included for Steam Deck and Desktop Linux. SHA-256 checksums are in SHA256SUMS.txt.
          EOF

          # Only upload once the release exists as NON-draft. While the main
          # Release workflow's create is in flight it may exist as a draft that
          # gh deletes on any upload failure — uploading into that draft is how
          # v1.6.25's release object got destroyed under both workflows.
          release_is_published() {
            [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]
          }
          if release_is_published; then
            upload_release_assets "$TAG" release-assets/*
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes-gaming.md --verify-tag
            upload_release_assets "$TAG" release-assets/*
          else
            for attempt in $(seq 1 30); do
              sleep 20
              if release_is_published; then
                upload_release_assets "$TAG" release-assets/*
                exit 0
              fi
            done
            echo "Timed out waiting for the main Release workflow to publish ${TAG}." >&2
            exit 1
          fi
