<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ことば Video Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #11151a;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(920px, calc(100vw - 24px));
      }
      .video-shell {
        position: relative;
        background: #20242b;
      }
      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: transparent;
        display: block;
      }
    </style>
    <script>
      const params = new URLSearchParams(location.search);
      const apiKey = params.get('apiKey');
      if (apiKey) {
        localStorage.setItem('jpdb-popup-reader-settings', JSON.stringify({
          apiKey,
          audioEnabled: false,
          audioSources: [],
          audioEnableDefaultSources: false,
          autoPlayAudio: false,
          audioViaBlob: true,
          audioTimeoutMs: 6000,
          audioSelectionMode: 'first',
          parseSelection: true,
          autoScanJapanese: false,
          showFloatingButton: true,
          showFurigana: true,
          showPitchAccent: true,
          hideKnownFurigana: true,
          localDictionariesEnabled: true,
          localDictionaryMaxResults: 12,
          localDictionaryShowKanji: true,
          dictionaryPreferences: [],
          subtitlePlayerEnabled: true,
          subtitleAutoDetect: true,
          subtitleOverlayVisible: true,
          subtitleSecondaryVisible: true,
          subtitleFontSize: 30,
          subtitleBottomOffset: 16,
          subtitleMiningPause: true,
          subtitleSeekPadding: 0.08,
          theme: 'dark',
          popupMode: 'auto',
          miningDeck: 'forq',
          neverForgetDeck: 'never-forget',
          blacklistDeck: 'blacklist',
          addToForq: false,
          enableReviews: true,
          twoButtonReviews: false,
          shortcuts: {
            scanPage: 'Alt+J',
            openSettings: 'Alt+Shift+J',
            playAudio: 'A',
            closePopup: 'Escape',
            previousSubtitle: 'Alt+ArrowLeft',
            nextSubtitle: 'Alt+ArrowRight',
            copySubtitle: 'Alt+C'
          }
        }));
      }
    </script>
  </head>
  <body>
    <main>
      <div class="video-shell">
      <video controls crossorigin="anonymous" preload="metadata">
        <track kind="subtitles" srclang="ja" label="日本語" src="/sample-ja.vtt">
        <track kind="subtitles" srclang="en" label="English" src="/sample-en.vtt">
      </video>
      </div>
    </main>
    <script type="module">
      window.setTimeout(() => void import('/src/reader/main.ts'), 0);
    </script>
  </body>
</html>
