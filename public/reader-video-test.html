<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>よむ Video Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #11151a;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(920px, calc(100vw - 24px));
      }
      .video-shell {
        position: relative;
        background: #20242b;
      }
      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: transparent;
        display: block;
      }
    </style>
    <script>
      const params = new URLSearchParams(location.search);
      const apiKey = params.get('apiKey');
      if (apiKey) {
        localStorage.setItem('jpdb-popup-reader-settings', JSON.stringify({
          apiKey,
          onboardingSeen: true,
          interfaceLanguage: 'auto',
          accentColor: '#5ea780',
          jpdbDefinitionsEnabled: true,
          jpdbDefinitionsPriority: 0,
          rtkEnabled: true,
          kanjivgEnabled: true,
          similarKanjiWords: true,
          similarKanjiWordLimit: 8,
          audioEnabled: false,
          audioSources: [],
          audioEnableDefaultSources: false,
          autoPlayAudio: false,
          audioViaBlob: true,
          audioTimeoutMs: 6000,
          audioSelectionMode: 'first',
          parseSelection: true,
          lookupOnClick: true,
          lookupOnHover: true,
          popupActivationMode: 'hover',
          scanModifierKey: 'shift',
          autoScanJapanese: false,
          scanVisiblePage: true,
          showFloatingButton: true,
          showFurigana: true,
          showPitchAccent: true,
          hideKnownFurigana: true,
          ocrEnabled: true,
          ocrAutoScanImages: true,
          ocrShowTextOverlay: false,
          ocrProvider: 'google-lens',
          ocrEndpointUrl: '',
          ocrEngine: 'MangaOCR',
          ocrLanguage: 'ja-JP',
          ocrMaxImagePixels: 1200000,
          ocrMinImageArea: 45000,
          ocrMaxImagesPerPage: 3,
          ocrPrefetchMargin: 700,
          ocrTextColor: '#ffffff',
          ocrOutlineColor: '#000000',
          ocrBackgroundColor: '#181b20',
          ocrBackgroundOpacity: 0.36,
          ocrFontScale: 1,
          localDictionariesEnabled: true,
          localDictionaryMaxResults: 12,
          localDictionaryShowKanji: true,
          dictionaryPreferences: [],
          subtitlePlayerEnabled: true,
          subtitleAutoDetect: true,
          subtitleOverlayVisible: true,
          subtitleSecondaryVisible: true,
          subtitleControlsMode: 'auto',
          subtitleFontSize: 32,
          subtitleBottomOffset: 16,
          subtitleTextColor: '#ffffff',
          subtitleOutlineColor: '#000000',
          subtitleBackgroundColor: '#181b20',
          subtitleBackgroundOpacity: 0.32,
          subtitleFontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
          subtitleFontWeight: 850,
          subtitleMiningPause: false,
          subtitleSeekPadding: 0.08,
          youtubeImmersionEnabled: false,
          youtubeShowFilterNotice: true,
          ankiEnabled: false,
          ankiConnectUrl: 'http://127.0.0.1:8765',
          ankiDeck: 'Yomu',
          ankiModel: 'Yomu Japanese',
          ankiTags: 'yomu',
          ankiMineWithJpdb: false,
          ankiCaptureScreenshot: true,
          theme: 'dark',
          popupMode: 'auto',
          miningDeck: 'forq',
          neverForgetDeck: 'never-forget',
          blacklistDeck: 'blacklist',
          addToForq: false,
          enableReviews: true,
          twoButtonReviews: false,
          shortcuts: {
            scanPage: 'Alt+J',
            openSettings: 'Alt+Shift+J',
            playAudio: 'A',
            closePopup: 'Escape',
            previousSubtitle: 'Alt+ArrowLeft',
            nextSubtitle: 'Alt+ArrowRight',
            copySubtitle: 'Alt+C',
            toggleOcr: 'Alt+O',
            scanImages: 'Alt+I',
            gradeNothing: '1',
            gradeSomething: '2',
            gradeHard: '3',
            gradeOkay: '4',
            gradeEasy: '5',
            gradeFail: '1',
            gradePass: '2'
          }
        }));
      }
    </script>
  </head>
  <body>
    <main>
      <div class="video-shell">
      <video controls crossorigin="anonymous" preload="metadata">
        <track kind="subtitles" srclang="ja" label="日本語" src="/sample-ja.vtt">
        <track kind="subtitles" srclang="en" label="English" src="/sample-en.vtt">
      </video>
      </div>
    </main>
    <script type="module">
      window.setTimeout(() => void import('/src/reader/main.ts'), 0);
    </script>
  </body>
</html>
