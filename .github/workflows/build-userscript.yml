name: Build Userscript

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - dist/yomu.user.js

permissions:
  contents: write

concurrency:
  group: build-userscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      # The Academy cache revision hashes the hosted Reader and companion
      # bytes. Build/sync it only after those dependencies have their final
      # names, or the generated commit carries a provably stale shell token.
      - run: npm run build:academy:prevalidated
      - run: npm run docs:build
      - run: npm run verify
      - name: Commit bundled userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged from scripts/lib/generated-artifacts.mjs, not a list kept by
          # hand here: the hand-kept one still named the old docs/public/newtab
          # route long after Study moved to docs/public/study, so the hosted
          # Study app and the published API specs stopped being committed and
          # went a whole release out of date.
          node scripts/lib/generated-artifacts.mjs | xargs git add -f --
          if git diff --cached --quiet; then
            echo "bundled userscript and docs assets are already current."
          else
            # GITHUB_TOKEN pushes do not recursively start push workflows, so a
            # skip directive is unnecessary here. More importantly, release
            # tooling may push this commit together with the release commit; if
            # this is the push HEAD, [skip ci] suppresses Deploy Docs as well.
            git commit -m "build userscript and docs assets"
            npm run check:repository
            npm run check:artifacts
            git push
          fi
