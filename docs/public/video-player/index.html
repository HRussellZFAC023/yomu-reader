<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yomu Video</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --shadow: rgba(0,0,0,.32);
      --radius: 8px;
    }

    :root.jpdb-reader-theme-light {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #171a1f;
      --muted: #596272;
      --panel: #f7f8fa;
      --line: rgba(20,30,45,.16);
      --soft-line: rgba(20,30,45,.08);
      --accent: #5ea780;
      --accent-ink: #ffffff;
      --shadow: rgba(20,30,45,.12);
    }

    :root.jpdb-reader-theme-dark {
      color-scheme: dark;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --shadow: rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .file-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 760;
    }

    button:hover,
    button:focus-visible,
    .file-button:hover,
    .file-button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 62%, transparent);
      outline-offset: 2px;
    }

    .file-button {
      display: inline-grid;
      place-items: center;
      padding: 0 14px;
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-ink);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle {
      display: grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      padding: 0;
      font-size: 15px;
      font-weight: 900;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .app {
      width: min(1240px, calc(100vw - 28px));
      min-height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 48px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #f7fbf8;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: min(760px, calc(100dvh - 92px));
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #050708;
      box-shadow: 0 18px 46px var(--shadow);
    }

    video {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: calc(100dvh - 110px);
      display: block;
      background: #050708;
      object-fit: contain;
    }

    .empty {
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      pointer-events: none;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      font-size: 20px;
      margin-bottom: 6px;
    }

    .stage.has-video .empty {
      display: none;
    }

    .status {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drop-active .stage {
      border-color: var(--accent);
    }

    @media (max-width: 640px) {
      .app {
        width: min(100vw - 18px, 620px);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .file-button {
        flex: 1 1 auto;
      }

      .stage {
        min-height: 58dvh;
      }

      video {
        max-height: 62dvh;
      }
    }
  </style>
</head>
<body>
  <main class="app" data-app>
    <header class="topbar">
      <a class="brand" href="../" aria-label="Open Yomu home">
        <img src="../yomu-icon.svg" alt="" width="36" height="36">
        <strong>Yomu Video</strong>
      </a>
      <div class="top-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme"><span data-theme-icon aria-hidden="true">☾</span></button>
        <label class="file-button">
          Open video
          <input type="file" accept="video/*,.mkv,.mp4,.m4v,.mov,.webm,.ogv" data-video-input>
        </label>
      </div>
    </header>

    <section class="stage" data-stage aria-label="Video">
      <video controls playsinline preload="metadata" data-video></video>
      <div class="empty">
        <div>
          <strong>Open or drop a video</strong>
          <span class="status" data-status>Use the Yomu subtitle controls for tracks, lines, and mining.</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const app = document.querySelector('[data-app]');
      const stage = document.querySelector('[data-stage]');
      const video = document.querySelector('[data-video]');
      const videoInput = document.querySelector('[data-video-input]');
      const status = document.querySelector('[data-status]');
      const themeToggle = document.querySelector('[data-theme-toggle]');
      const themeIcon = document.querySelector('[data-theme-icon]');
      const themeKey = 'yomu-page-theme';
      let objectUrl = '';

      function effectiveTheme() {
        const saved = localStorage.getItem(themeKey);
        if (saved === 'dark' || saved === 'light') return saved;
        return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }

      function applyTheme(theme) {
        document.documentElement.classList.toggle('jpdb-reader-theme-dark', theme === 'dark');
        document.documentElement.classList.toggle('jpdb-reader-theme-light', theme === 'light');
        if (themeIcon) themeIcon.textContent = theme === 'dark' ? '☀' : '☾';
        if (themeToggle) {
          const label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
          themeToggle.setAttribute('aria-label', label);
          themeToggle.title = label;
        }
      }

      applyTheme(effectiveTheme());

      function setStatus(message) {
        status.textContent = message;
      }

      function revokeObjectUrl() {
        if (!objectUrl) return;
        URL.revokeObjectURL(objectUrl);
        objectUrl = '';
      }

      function loadVideo(file) {
        if (!file) return;
        revokeObjectUrl();
        objectUrl = URL.createObjectURL(file);
        video.src = objectUrl;
        video.load();
        stage.classList.add('has-video');
        setStatus(file.name);
      }

      function handleFiles(files) {
        for (const file of files) {
          if (file.type.startsWith('video/') || /\.(mkv|mp4|m4v|mov|webm|ogv)$/i.test(file.name)) {
            loadVideo(file);
            return;
          }
        }
        setStatus('Choose a browser-supported video file.');
      }

      videoInput.addEventListener('change', () => handleFiles(videoInput.files || []));
      themeToggle?.addEventListener('click', () => {
        const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
        localStorage.setItem(themeKey, next);
        applyTheme(next);
      });

      for (const eventName of ['dragenter', 'dragover']) {
        document.addEventListener(eventName, event => {
          event.preventDefault();
          app.classList.add('drop-active');
        });
      }

      for (const eventName of ['dragleave', 'drop']) {
        document.addEventListener(eventName, event => {
          event.preventDefault();
          if (eventName === 'drop') handleFiles(event.dataTransfer?.files || []);
          app.classList.remove('drop-active');
        });
      }

      window.addEventListener('pagehide', revokeObjectUrl);
    })();
  </script>
  <script src="../yomu.user.js"></script>
</body>
</html>
