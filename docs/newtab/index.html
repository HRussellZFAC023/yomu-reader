<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yomu New Tab</title>
    <link rel="icon" type="image/svg+xml" href="../yomu-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="よむ">
    <meta name="color-scheme" content="light dark">
    <script>
      (() => {
        const settingsKey = 'jpdb-popup-reader-settings';
        const titles = { en: 'Yomu New Tab', ja: 'よむ 学習' };
        const readLanguage = () => {
          try {
            const stored = JSON.parse(localStorage.getItem(settingsKey) || '{}').interfaceLanguage;
            return stored === 'en' ? 'en' : 'ja';
          } catch {
            return 'ja';
          }
        };
        const language = readLanguage();
        document.documentElement.lang = language;
        document.title = titles[language];
        window.__yomuNewTabStaticLanguage = language;
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #5ea780;
        --ink: #142019;
        --surface: #fbfcf8;
        --surface-glass: rgba(251, 252, 248, .72);
        --surface-glass-soft: rgba(251, 252, 248, .58);
        --line: rgba(20, 32, 25, .18);
        --line-soft: rgba(20, 32, 25, .14);
        --line-control: rgba(20, 32, 25, .16);
        --active-ink: #2e6648;
        --muted: rgba(20, 32, 25, .72);
        --subtle: rgba(20, 32, 25, .78);
        --shadow: rgba(18, 28, 23, .2);
        --shadow-soft: rgba(18, 28, 23, .12);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      .jpdb-reader-newtab {
        min-height: 100dvh;
        background: var(--jpdb-newtab-bg, var(--bg));
        color: var(--jpdb-newtab-bg-text, var(--ink));
      }

      .jpdb-reader-newtab-shell {
        width: min(880px, calc(100vw - 28px));
        min-height: 100dvh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: clamp(16px, 3vh, 28px);
        padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
      }

      .jpdb-reader-newtab-topbar {
        min-height: 44px;
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 8px;
      }

      .jpdb-reader-language-toggle,
      .jpdb-reader-newtab-overflow {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--surface-glass);
        color: inherit;
        box-shadow: 0 10px 28px var(--shadow);
        text-decoration: none;
        font-size: 14px;
        line-height: 1;
        font-weight: 900;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .jpdb-reader-language-toggle {
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        padding: 0;
        font: inherit;
        font-size: 15px;
        font-weight: 620;
        cursor: pointer;
        transition: color .16s ease, filter .16s ease;
      }

      .jpdb-reader-language-toggle:hover,
      .jpdb-reader-language-toggle:focus-visible {
        color: var(--accent);
        filter: brightness(1.05);
        outline: 2px solid color-mix(in srgb, var(--accent) 38%, transparent);
        outline-offset: 3px;
      }

      .jpdb-reader-newtab-brand {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        text-decoration: none;
      }

      .jpdb-reader-newtab-overflow {
        padding-bottom: 6px;
        font-size: 20px;
      }

      .jpdb-reader-newtab-brand img {
        display: block;
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      .jpdb-reader-newtab-mode {
        justify-self: center;
        display: inline-grid;
        grid-template-columns: repeat(2, minmax(72px, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        background: var(--surface-glass-soft);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .jpdb-reader-newtab-mode button,
      .jpdb-reader-newtab-controls button {
        border: 0;
        border-radius: 999px;
        color: inherit;
        font: inherit;
        font-size: 11px;
        font-weight: 820;
      }

      .jpdb-reader-newtab-mode button {
        min-height: 32px;
        padding: 0 14px;
        background: transparent;
      }

      .jpdb-reader-newtab-mode button[data-active="true"] {
        background: var(--surface);
        color: var(--active-ink);
        box-shadow: 0 4px 14px var(--shadow-soft);
      }

      .jpdb-reader-newtab-study {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        align-items: center;
        justify-items: center;
        gap: clamp(10px, 2.2vh, 20px);
        cursor: pointer;
        user-select: none;
        transition: background .16s ease, filter .16s ease;
      }

      .jpdb-reader-newtab:not(.jpdb-reader-newtab-revealed) .jpdb-reader-newtab-study:hover {
        background: color-mix(in srgb, var(--accent) 5%, transparent);
      }

      .jpdb-reader-newtab-study:active {
        filter: brightness(.985);
      }

      .jpdb-reader-newtab-study.jpdb-reader-newtab-study-anki-card {
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        align-content: stretch;
      }

      .jpdb-reader-newtab-count,
      .jpdb-reader-newtab-status {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.2;
        font-weight: 760;
        text-align: center;
      }

      .jpdb-reader-newtab-prompt {
        max-width: 100%;
        font-size: clamp(62px, 15vw, 164px);
        font-weight: 900;
        line-height: .96;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .jpdb-reader-newtab-kanji-mode .jpdb-reader-newtab-prompt {
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-size: clamp(92px, 24vw, 260px);
        font-weight: 800;
      }

      .jpdb-reader-newtab-answer {
        min-height: clamp(72px, 12vh, 128px);
        display: grid;
        justify-items: center;
        gap: 8px;
        transition: opacity .16s ease, transform .16s ease, filter .16s ease;
      }

      .jpdb-reader-newtab:not(.jpdb-reader-newtab-revealed) .jpdb-reader-newtab-answer {
        min-height: 0;
        opacity: 0;
        filter: blur(8px);
        transform: translateY(4px);
      }

      .jpdb-reader-newtab-reading {
        font-size: clamp(24px, 5vw, 54px);
        font-weight: 780;
        line-height: 1.1;
        text-align: center;
      }

      .jpdb-reader-newtab-meaning {
        max-width: min(520px, 100%);
        color: var(--subtle);
        font-size: clamp(15px, 2.4vw, 22px);
        font-weight: 650;
        line-height: 1.42;
        text-align: center;
      }

      .jpdb-reader-newtab-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(88px, 1fr));
        gap: 8px;
      }

      .jpdb-reader-newtab-controls button {
        min-height: 44px;
        border: 1px solid var(--line-control);
        background: var(--surface-glass);
        box-shadow: 0 8px 22px var(--shadow-soft);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .jpdb-reader-newtab-controls button[data-newtab-action="reveal"] {
        background: var(--ink);
        border-color: transparent;
        color: var(--bg);
      }

      @media (max-width: 640px) {
        .jpdb-reader-newtab-shell {
          width: min(100vw - 18px, 560px);
        }

        .jpdb-reader-newtab-prompt {
          font-size: clamp(50px, 17vw, 102px);
        }

        .jpdb-reader-newtab-kanji-mode .jpdb-reader-newtab-prompt {
          font-size: clamp(88px, 34vw, 180px);
        }

        .jpdb-reader-newtab-controls {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .jpdb-reader-newtab-controls button {
          padding: 0 8px;
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <main class="jpdb-reader-newtab" data-jpdb-reader-root="true" data-standalone-newtab="true">
      <div class="jpdb-reader-newtab-shell">
        <header class="jpdb-reader-newtab-topbar">
          <a class="jpdb-reader-newtab-brand" href="../"
            aria-label="Open Yomu">
            <img src="../yomu-icon.svg" alt="" width="32" height="32">
          </a>
          <div class="jpdb-reader-newtab-mode" role="group" aria-label="Study mode">
            <button type="button" data-newtab-action="mode" data-mode="word" data-active="true">Word</button>
            <button type="button" data-newtab-action="mode" data-mode="kanji">Kanji</button>
          </div>
          <button class="jpdb-reader-language-toggle" type="button" data-newtab-action="language" aria-label="Switch Yomu HUD to Japanese" lang="ja">あ</button>
          <a class="jpdb-reader-newtab-overflow" href="../"
            aria-label="Open Yomu">...</a>
        </header>
        <section class="jpdb-reader-newtab-study" data-newtab-study>
          <div class="jpdb-reader-newtab-count" data-newtab-count>1 / 16</div>
          <div class="jpdb-reader-newtab-prompt" data-newtab-prompt lang="ja">読む</div>
          <div class="jpdb-reader-newtab-answer" data-newtab-answer>
            <div class="jpdb-reader-newtab-reading" data-newtab-reading lang="ja"></div>
            <div class="jpdb-reader-newtab-meaning" data-newtab-meaning></div>
          </div>
          <div class="jpdb-reader-newtab-status" data-newtab-status></div>
        </section>
        <nav class="jpdb-reader-newtab-controls" aria-label="Study navigation">
          <button type="button" data-newtab-action="previous">Previous</button>
          <button type="button" data-newtab-action="reveal">Reveal</button>
          <button type="button" data-newtab-action="next">Next</button>
        </nav>
      </div>
    </main>
    <script>
      (() => {
        const words = [
          ['読む', 'よむ', 'to read', '読むこと'], ['見る', 'みる', 'to see', '見ること'], ['聞く', 'きく', 'to listen', '聞くこと'],
          ['話す', 'はなす', 'to speak', '話すこと'], ['書く', 'かく', 'to write', '書くこと'], ['使う', 'つかう', 'to use', '使うこと'],
          ['思う', 'おもう', 'to think', '思うこと'], ['知る', 'しる', 'to know', '知ること'], ['食べる', 'たべる', 'to eat', '食べること'],
          ['飲む', 'のむ', 'to drink', '飲むこと'], ['行く', 'いく', 'to go', '行くこと'], ['来る', 'くる', 'to come', '来ること'],
          ['今日', 'きょう', 'today', 'きょう'], ['明日', 'あした', 'tomorrow', 'あした'], ['時間', 'じかん', 'time', '時間'], ['日本語', 'にほんご', 'Japanese', '日本語']
        ];
        const root = document.querySelector('[data-jpdb-reader-root]');
        const prompt = root.querySelector('[data-newtab-prompt]');
        const reading = root.querySelector('[data-newtab-reading]');
        const meaning = root.querySelector('[data-newtab-meaning]');
        const count = root.querySelector('[data-newtab-count]');
        const reveal = root.querySelector('[data-newtab-action="reveal"]');
        const languageToggle = root.querySelector('[data-newtab-action="language"]');
        const modeButtons = {
          word: root.querySelector('[data-mode="word"]'),
          kanji: root.querySelector('[data-mode="kanji"]')
        };
        const controlButtons = {
          previous: root.querySelector('[data-newtab-action="previous"]'),
          next: root.querySelector('[data-newtab-action="next"]')
        };
        const settingsKey = 'jpdb-popup-reader-settings';
        const copy = {
          en: {
            title: 'Yomu New Tab',
            modeLabel: 'Study mode',
            word: 'Word',
            kanji: 'Kanji',
            previous: 'Previous',
            next: 'Next',
            reveal: 'Reveal',
            hide: 'Hide',
            switchToJapanese: 'Switch Yomu HUD to Japanese',
            switchToEnglish: 'Switch Yomu HUD to English',
            openYomu: 'Open Yomu'
          },
          ja: {
            title: 'よむ 学習',
            modeLabel: '学習モード',
            word: '単語',
            kanji: '漢字',
            previous: '前へ',
            next: '次へ',
            reveal: '表示',
            hide: '隠す',
            switchToJapanese: 'Yomu HUDを日本語に切り替え',
            switchToEnglish: 'Yomu HUDを英語に切り替え',
            openYomu: 'Yomuを開く'
          }
        };
        let index = Number(sessionStorage.getItem('yomu-demo-word') || Math.floor(Math.random() * words.length));
        let mode = 'word';
        let shown = false;
        const readLanguage = () => {
          if (window.__yomuNewTabStaticLanguage === 'en' || window.__yomuNewTabStaticLanguage === 'ja') return window.__yomuNewTabStaticLanguage;
          try {
            const stored = JSON.parse(localStorage.getItem(settingsKey) || '{}').interfaceLanguage;
            return stored === 'en' ? 'en' : 'ja';
          } catch {
            return 'ja';
          }
        };
        let language = readLanguage();
        const saveLanguage = value => {
          const settings = JSON.parse(localStorage.getItem(settingsKey) || '{}');
          if (!Object.prototype.hasOwnProperty.call(settings, 'learningTargetChosen') && Object.keys(settings).length === 0) {
            settings.learningTargetChosen = false;
          }
          settings.interfaceLanguage = value;
          localStorage.setItem(settingsKey, JSON.stringify(settings));
          window.dispatchEvent(new CustomEvent('yomu-interface-language-change', { detail: { language: value } }));
        };
        const applyCopy = () => {
          const text = copy[language];
          const next = language === 'ja' ? 'en' : 'ja';
          root.querySelector('.jpdb-reader-newtab-mode').setAttribute('aria-label', text.modeLabel);
          root.querySelectorAll('[aria-label="Open Yomu"], [aria-label="Yomuを開く"]').forEach(element => element.setAttribute('aria-label', text.openYomu));
          modeButtons.word.textContent = text.word;
          modeButtons.kanji.textContent = text.kanji;
          controlButtons.previous.textContent = text.previous;
          controlButtons.next.textContent = text.next;
          languageToggle.textContent = next === 'ja' ? 'あ' : 'A';
          languageToggle.lang = next === 'ja' ? 'ja' : 'en';
          languageToggle.setAttribute('aria-label', next === 'ja' ? text.switchToJapanese : text.switchToEnglish);
          reveal.textContent = shown ? text.hide : text.reveal;
          document.documentElement.lang = language;
          document.title = text.title;
        };
        const kanji = value => Array.from(new Set(Array.from(value).filter(char => /[\u3400-\u9fff々〆]/u.test(char))));
        const draw = () => {
          const text = copy[language];
          const item = words[index % words.length];
          const k = kanji(item[0])[0] || item[0][0];
          root.classList.toggle('jpdb-reader-newtab-revealed', shown);
          root.classList.toggle('jpdb-reader-newtab-kanji-mode', mode === 'kanji');
          prompt.textContent = mode === 'kanji' ? k : item[0];
          reading.textContent = shown ? (mode === 'kanji' ? item[0] : item[1]) : '';
          const gloss = language === 'ja' ? item[3] : item[2];
          meaning.textContent = shown ? (mode === 'kanji' ? `${item[1]} · ${gloss}` : gloss) : '';
          count.textContent = `${(index % words.length) + 1} / ${words.length}`;
          reveal.textContent = shown ? text.hide : text.reveal;
          sessionStorage.setItem('yomu-demo-word', String(index));
        };
        root.addEventListener('click', event => {
          if (event.target.closest('[data-newtab-action="language"]')) { language = language === 'ja' ? 'en' : 'ja'; saveLanguage(language); applyCopy(); draw(); return; }
          if (event.target.closest('[data-newtab-action="next"]')) { index = (index + 1) % words.length; shown = false; draw(); return; }
          if (event.target.closest('[data-newtab-action="previous"]')) { index = (index - 1 + words.length) % words.length; shown = false; draw(); return; }
          if (event.target.closest('[data-newtab-action="reveal"]')) { shown = !shown; draw(); return; }
          const modeButton = event.target.closest('[data-mode]');
          if (modeButton) {
            mode = modeButton.dataset.mode === 'kanji' ? 'kanji' : 'word';
            root.querySelectorAll('[data-mode]').forEach(button => button.dataset.active = String(button === modeButton));
            shown = false;
            draw();
            return;
          }
          if (event.target.closest('[data-newtab-study]')) { shown = true; draw(); }
        });
        window.addEventListener('yomu-interface-language-change', event => {
          const next = event.detail && event.detail.language === 'ja' ? 'ja' : 'en';
          if (next === language) return;
          language = next;
          applyCopy();
          draw();
        });
        applyCopy();
        draw();
      })();
    </script>
    <script src="../yomu.user.js"></script>
  </body>

</html>
