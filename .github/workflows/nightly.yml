name: Nightly smokes

# NB-50: headless-capable regression-guard smokes that are not on the fast
# per-push CI gate. They reproduce historical bugs against the built userscript
# in fixture-served headless browsers. Run once nightly (and on demand) so the
# per-push gate stays fast while these guards still catch regressions.

on:
  schedule:
    # 03:17 UTC daily — off the hour to avoid the top-of-hour scheduler surge.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      smokes:
        description: 'Optional smoke script names, separated by spaces. Empty runs the complete suite.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  nightly-smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOMU_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install smoke browsers
        uses: ./.github/actions/playwright-browsers
      - name: Build userscript + sync docs
        run: |
          npm run build
          node scripts/sync-docs-userscript.cjs
      - name: Run nightly smokes
        env:
          NIGHTLY_SMOKE_NAMES: ${{ inputs.smokes || '' }}
        run: |
          read -r -a requested_smokes <<< "$NIGHTLY_SMOKE_NAMES"
          npm run smoke:nightly -- "${requested_smokes[@]}"
      - name: Upload typography failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-typography-diagnostics
          path: qa-artifacts/yomu-reader/annotation-typography/report.json
          if-no-files-found: ignore
          retention-days: 7
