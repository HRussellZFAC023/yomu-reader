name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  YOMU_CI_TEST_TIMEOUT_MS: 540000

jobs:
  committed-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check:repository
      - run: npm run check:artifacts
      - run: node scripts/prune-content-addressed-assets.mjs --check

  fallow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm ci silently skips optional platform binaries when the fresh cache
      # download fails (620 vs 619 packages on the runs that broke this job).
      - name: Ensure fallow platform binary
        run: node -e "require.resolve('@fallow-cli/linux-x64-gnu/package.json')" || npm install --no-save @fallow-cli/linux-x64-gnu@"$(node -p "require('fallow/package.json').version")"
      # Existing dead-code findings are recorded in
      # config/quality/dead-code-baseline.json; only new findings fail. The raw
      # `fallow:dead-code` failed on every commit for months, including docs-only
      # ones, so the job stopped carrying information (U63).
      - run: npm run quality:dead-code
      - run: npm run quality:reader-coverage
      - run: npm run fallow:audit
        env:
          FALLOW_COVERAGE: artifacts/fallow-coverage/coverage-final.json

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test-workflow-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:test-workflows
      - run: node scripts/check-smoke-workflow-coverage.mjs
      - run: node --test tests/tooling/*.test.mjs
      - run: node scripts/check-css-has-invalidation.mjs
      - run: node scripts/check-recorded-pages.mjs
      - run: node scripts/complexity-audit.mjs
      - run: node scripts/file-size-audit.mjs

  test-academy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:academy:prevalidated
      - run: npm run test:academy:ci

  test-workers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:workers

  video-typecheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs --kind regular --shard=${{ matrix.shard }} --total=8
        env:
          # One Vitest host on each matrix VM, not four local shard hosts.
          YOMU_CI_REGULAR_CONCURRENCY: 1

  test-jpdb:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs --kind jpdb --shard=${{ matrix.shard }} --total=8

  gaming-smoke:
    runs-on: ubuntu-24.04
    needs: [typecheck]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run smoke:gaming
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome

  layout-smoke:
    runs-on: ubuntu-24.04
    needs: [typecheck]
    # npm ci plus the three browsers and their system packages can take six
    # minutes from a cold cache, and the bounded install retries once; the
    # smokes themselves need about three.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install layout smoke browsers
        uses: ./.github/actions/playwright-browsers
      # smoke:ignored-words serves the built Study app from dist/newtab.
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run smoke:layout-regressions
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome

  build:
    runs-on: ubuntu-24.04
    needs: [committed-state, typecheck, test-workflow-coverage, test, test-jpdb, test-academy, test-workers, video-typecheck, gaming-smoke, layout-smoke]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Warm vitepress cache
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: vitepress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            vitepress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            vitepress-${{ runner.os }}-
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run docs:build
      - run: npm run verify
      - run: npm run smoke:study-flow-stability
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
