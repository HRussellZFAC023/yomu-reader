<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yomu New Tab</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #5ea780;
      --ink: #142019;
      --surface: #fbfcf8;
      --muted: #eef5ef;
      --border: rgba(255,255,255,.62);
      --soft-border: rgba(20,32,25,.16);
      --accent: #2e6648;
      --shadow: rgba(18,28,23,.2);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    .jpdb-reader-newtab-shell {
      width: min(1180px, calc(100vw - 32px));
      min-height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      padding: max(16px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .topbar,
    .controls,
    .panel-head,
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
    }

    .mark,
    .puck {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      color: var(--accent);
      box-shadow: 0 10px 26px var(--shadow);
      font-size: 17px;
    }

    .brand small,
    .status {
      display: block;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.2;
      opacity: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 370px);
      gap: 18px;
      align-items: stretch;
    }

    .stage {
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      gap: 12px;
    }

    .card,
    .panel,
    .note {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 18px 48px var(--shadow);
    }

    .card {
      min-height: clamp(430px, calc(100dvh - 190px), 660px);
      align-self: center;
      display: grid;
      grid-template-rows: auto .42fr auto auto auto;
      align-content: center;
      justify-items: center;
      gap: clamp(12px, 2vh, 22px);
      padding: clamp(22px, 4vw, 54px);
      overflow: hidden;
      cursor: pointer;
    }

    .card-head,
    .meta {
      width: 100%;
      color: color-mix(in srgb, var(--ink) 62%, transparent);
      font-size: 12px;
      font-weight: 820;
      text-transform: uppercase;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .visual {
      width: min(160px, 22vw);
      height: min(160px, 22vw);
      display: grid;
      place-items: center;
      border: 1px solid var(--soft-border);
      border-radius: 16px;
      background: var(--muted);
      color: rgba(46,102,72,.28);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: clamp(54px, 8vw, 112px);
      font-weight: 900;
      line-height: 1;
    }

    .word {
      max-width: 100%;
      color: var(--accent);
      font-size: clamp(54px, 9vw, 132px);
      font-weight: 900;
      line-height: 1.02;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .answer {
      display: grid;
      gap: 8px;
      justify-items: center;
      transition: opacity .16s ease, filter .16s ease, transform .16s ease;
    }

    .newtab-hidden .answer {
      opacity: 0;
      filter: blur(7px);
      transform: translateY(4px);
    }

    .card:not(.newtab-hidden) .concealed {
      display: none;
    }

    .reading {
      color: var(--accent);
      font-size: clamp(24px, 4vw, 52px);
      font-weight: 720;
      text-align: center;
    }

    .meaning {
      max-width: min(620px, 100%);
      color: color-mix(in srgb, var(--ink) 86%, var(--accent));
      font-size: clamp(17px, 2.3vw, 28px);
      font-weight: 800;
      line-height: 1.28;
      text-align: center;
    }

    .concealed {
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
    }

    .meta {
      justify-content: center;
      flex-wrap: wrap;
      text-transform: none;
    }

    .meta span {
      border: 1px solid var(--soft-border);
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--muted);
    }

    button,
    select,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    button,
    select,
    input {
      min-height: 38px;
      border: 1px solid var(--soft-border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 760;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    button.primary,
    button.active {
      border-color: transparent;
      background: var(--accent);
      color: var(--surface);
    }

    .controls {
      min-height: 48px;
    }

    .controls .status {
      margin-left: auto;
      font-weight: 760;
      text-align: right;
    }

    .side {
      display: grid;
      grid-template-rows: auto auto minmax(160px, 1fr) auto;
      gap: 12px;
      min-width: 0;
    }

    .panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      background: color-mix(in srgb, var(--surface) 84%, transparent);
    }

    .panel-head {
      font-size: 12px;
      font-weight: 860;
      text-transform: uppercase;
    }

    .segmented,
    .filters,
    .form-grid {
      display: grid;
      gap: 8px;
    }

    .segmented,
    .form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .filters {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 5px;
      color: color-mix(in srgb, var(--ink) 70%, transparent);
      font-size: 12px;
      font-weight: 760;
    }

    select,
    input {
      width: 100%;
      padding: 7px 9px;
      font-size: 14px;
    }

    .list {
      display: grid;
      align-content: start;
      gap: 7px;
      overflow: auto;
    }

    .list button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      text-align: left;
    }

    .list span,
    .list small {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list span {
      font-size: 18px;
      font-weight: 850;
    }

    .list small {
      font-size: 11px;
      color: color-mix(in srgb, var(--ink) 78%, var(--accent));
      opacity: 1;
    }

    .list button.active small {
      color: var(--surface);
    }

    .note {
      padding: 11px 13px;
      background: color-mix(in srgb, var(--surface) 84%, transparent);
      color: color-mix(in srgb, var(--ink) 72%, transparent);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 680;
    }

    .puck {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 10;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .card { min-height: clamp(400px, 58dvh, 560px); }
      .side { grid-template-rows: auto; }
    }

    @media (max-width: 640px) {
      .jpdb-reader-newtab-shell { width: min(100vw - 22px, 620px); }
      .topbar > .status { display: none; }
      .card { min-height: min(520px, calc(100dvh - 164px)); padding: 18px; }
      .visual { width: 94px; height: 94px; }
      .word { font-size: clamp(44px, 15vw, 88px); }
      .controls { display: grid; grid-template-columns: 1fr 1fr; }
      .controls .status { grid-column: 1 / -1; margin-left: 0; text-align: left; }
      .form-grid, .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="jpdb-reader-newtab" data-jpdb-reader-root="true">
    <div class="jpdb-reader-newtab-shell">
      <h1 class="sr-only">Yomu New Tab</h1>
      <header class="topbar">
        <a class="brand" href="https://hrussellzfac023.github.io/kotoba-reader/">
          <span class="mark">よむ</span>
          <span><strong>よむ</strong><small>new tab</small></span>
        </a>
        <span class="status">Loading study sources...</span>
        <a class="brand" href="https://raw.githubusercontent.com/HRussellZFAC023/kotoba-reader/main/dist/yomu.user.js"><small>Install userscript</small></a>
      </header>
      <section class="stage">
        <div class="card">
          <div class="card-head"><span>Preparing</span><span>0 / 0</span></div>
          <div class="visual">読</div>
          <div class="word" lang="ja">よむ</div>
          <div class="answer"><div class="reading" lang="ja">loading</div><div class="meaning">Preparing your study cards.</div></div>
          <div class="concealed">Recall first, then reveal.</div>
          <div class="meta"><span>Dictionary fallback</span><span>JPDB optional</span><span>Anki optional</span></div>
        </div>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const cards = [
        { word: '昔', reading: 'むかし', meaning: 'long ago; once upon a time', state: 'Dictionary', rank: 'Top 700' },
        { word: '約束', reading: 'やくそく', meaning: 'promise; arrangement', state: 'Learning', rank: 'Top 1200' },
        { word: '隠れる', reading: 'かくれる', meaning: 'to hide; to be hidden', state: 'Due', rank: 'Top 1800' },
        { word: '懐かしい', reading: 'なつかしい', meaning: 'nostalgic; dear; missed', state: 'Known', rank: 'Top 3100' },
        { word: '確かめる', reading: 'たしかめる', meaning: 'to check; to make sure', state: 'New', rank: 'Top 2400' }
      ];
      const sessionKey = 'jpdb-reader-standalone-newtab-card';
      const randomIndex = () => Math.floor(Math.random() * cards.length);
      const storedIndex = Number(sessionStorage.getItem(sessionKey));
      let index = Number.isInteger(storedIndex) && storedIndex >= 0 && storedIndex < cards.length ? storedIndex : randomIndex();
      let revealed = false;

      window.setTimeout(() => {
        const root = document.querySelector('.jpdb-reader-newtab[data-jpdb-reader-root]');
        if (!root || root.querySelector('[data-newtab-card]')) return;
        root.dataset.standaloneNewtab = 'true';
        root.innerHTML = `
          <div class="jpdb-reader-newtab-shell">
            <h1 class="sr-only">Yomu New Tab</h1>
            <header class="topbar">
              <a class="brand" href="https://hrussellzfac023.github.io/kotoba-reader/"><span class="mark">よむ</span><span><strong>よむ</strong><small>standalone demo</small></span></a>
              <span class="status">Demo dictionary words</span>
              <a class="brand" href="https://raw.githubusercontent.com/HRussellZFAC023/kotoba-reader/main/dist/yomu.user.js"><small>Install userscript</small></a>
            </header>
            <div class="workspace">
              <section class="stage">
                <div class="card newtab-hidden" data-newtab-card tabindex="0">
                  <div class="card-head"><span data-kicker>Word recall</span><span data-count></span></div>
                  <div class="visual" data-visual></div>
                  <div class="word" data-word lang="ja"></div>
                  <div class="answer"><div class="reading" data-reading lang="ja"></div><div class="meaning" data-meaning></div></div>
                  <div class="concealed">Reading and meaning are hidden until reveal.</div>
                  <div class="meta" data-meta></div>
                </div>
                <div class="controls">
                  <button type="button" data-reveal>Reveal</button>
                  <button class="primary" type="button" data-next>Next</button>
                  <span class="status">Refresh keeps this word. A fresh tab rolls a new one.</span>
                </div>
              </section>
              <aside class="side">
                <section class="panel">
                  <div class="panel-head"><span>Mode</span><span>Demo</span></div>
                  <div class="segmented"><button class="active" type="button">Word</button><button type="button" data-kanji>Kanji</button></div>
                  <div class="form-grid"><label>Source<select><option>Dictionary demo</option></select></label><label>Sort<select><option>Random</option></select></label></div>
                  <label>Search<input type="search" aria-label="Search demo words" placeholder="Install よむ for your own words"></label>
                </section>
                <section class="panel">
                  <div class="panel-head"><span>Show only</span><span>${cards.length} words</span></div>
                  <div class="filters"><button class="active">Study</button><button>All</button><button>New</button><button>Due</button><button>Known</button><button>Dictionary</button></div>
                </section>
                <section class="panel">
                  <div class="panel-head"><span>2D review tray</span><span>Pick any word</span></div>
                  <div class="list" data-list></div>
                </section>
                <section class="note">Without the userscript, this page runs as a small standalone demo. With よむ installed, it uses JPDB, Anki, or your local dictionaries and can download the starter dictionary when needed.</section>
              </aside>
            </div>
          </div>
          <a class="puck" href="https://hrussellzfac023.github.io/kotoba-reader/" aria-label="Open Yomu">よむ</a>
        `;
        const render = () => {
          const card = cards[index];
          sessionStorage.setItem(sessionKey, String(index));
          root.querySelector('.card')?.classList.toggle('newtab-hidden', !revealed);
          root.querySelector('[data-count]').textContent = `${index + 1} / ${cards.length}`;
          root.querySelector('[data-visual]').textContent = Array.from(card.word).find(ch => /[\u3400-\u9fff々〆]/u.test(ch)) || card.word[0];
          root.querySelector('[data-word]').textContent = card.word;
          root.querySelector('[data-reading]').textContent = card.reading;
          root.querySelector('[data-meaning]').textContent = card.meaning;
          root.querySelector('[data-meta]').innerHTML = `<span>${card.state}</span><span>Demo dictionary</span><span>${card.rank}</span>`;
          root.querySelector('[data-reveal]').textContent = revealed ? 'Hide answer' : 'Reveal';
          root.querySelector('[data-list]').innerHTML = cards.map((item, itemIndex) => `<button class="${itemIndex === index ? 'active' : ''}" type="button" data-index="${itemIndex}"><span lang="ja">${item.word}</span><small>${item.state}</small></button>`).join('');
        };
        root.addEventListener('click', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          if (target.closest('[data-reveal]')) revealed = !revealed;
          else if (target.closest('[data-next]')) { index = (index + 1) % cards.length; revealed = false; }
          else if (target.closest('[data-newtab-card]')) { if (!revealed) revealed = true; else index = (index + 1) % cards.length; }
          const tray = target.closest('[data-index]');
          if (tray) { index = Number(tray.dataset.index); revealed = false; }
          render();
        });
        render();
      }, 0);
    })();
  </script>
</body>
</html>
