    "patch":
      "operationId": "patchAcademyAccount"
      "tags":
        - "Account"
      "summary": "Update account preferences"
      "description": "Updates the learner name, approved avatar, and class-board sharing preferences."
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Account"
        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/json":
