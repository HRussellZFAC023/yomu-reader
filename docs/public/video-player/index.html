<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yomu Video</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --shadow: rgba(0,0,0,.32);
      --radius: 8px;
    }

    :root.yomu-page-theme-light {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #171a1f;
      --muted: #596272;
      --panel: #f7f8fa;
      --line: rgba(20,30,45,.16);
      --soft-line: rgba(20,30,45,.08);
      --accent: #5ea780;
      --accent-ink: #ffffff;
      --shadow: rgba(20,30,45,.12);
      --jpdb-reader-bg: #ffffff;
      --jpdb-reader-surface: #f7f8fa;
      --jpdb-reader-surface-2: #eef1f4;
      --jpdb-reader-text: #171a1f;
      --jpdb-reader-muted: #596272;
      --jpdb-reader-faint: #7b8493;
      --jpdb-reader-border: rgba(20,30,45,.16);
      --jpdb-reader-hover: rgba(20,30,45,.07);
    }

    :root.yomu-page-theme-dark {
      color-scheme: dark;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --shadow: rgba(0,0,0,.32);
      --jpdb-reader-bg: #181b20;
      --jpdb-reader-surface: #20242b;
      --jpdb-reader-surface-2: #282e37;
      --jpdb-reader-text: #f2f4f8;
      --jpdb-reader-muted: #aab2c0;
      --jpdb-reader-faint: #6f7a89;
      --jpdb-reader-border: rgba(255,255,255,.12);
      --jpdb-reader-hover: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .file-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 760;
    }

    button:hover,
    button:focus-visible,
    .file-button:hover,
    .file-button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 62%, transparent);
      outline-offset: 2px;
    }

    .file-button {
      display: inline-grid;
      place-items: center;
      padding: 0 14px;
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-ink);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .VPNavBarAppearance.appearance {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      min-width: 48px;
      height: 38px;
    }

    .VPSwitch.VPSwitchAppearance {
      position: relative;
      display: block;
      width: 40px;
      min-width: 40px;
      height: 22px;
      min-height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .VPSwitch .check {
      position: absolute;
      top: 1px;
      left: 1px;
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--bg);
      box-shadow: 0 1px 3px rgba(0,0,0,.28);
      transition: transform .18s ease, background .18s ease;
    }

    .VPSwitch[aria-checked="true"] .check {
      transform: translateX(18px);
    }

    .VPSwitch .icon {
      position: relative;
      display: block;
      width: 14px;
      height: 14px;
      color: var(--muted);
    }

    .VPSwitch .sun,
    .VPSwitch .moon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      transition: opacity .18s ease;
    }

    .VPSwitch .sun::before { content: "☀"; }
    .VPSwitch .moon::before { content: "☾"; }
    .VPSwitch[aria-checked="false"] .sun,
    .VPSwitch[aria-checked="true"] .moon { opacity: 0; }
    .VPSwitch[aria-checked="true"] .sun,
    .VPSwitch[aria-checked="false"] .moon { opacity: 1; }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .app {
      width: min(1240px, calc(100vw - 28px));
      min-height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 48px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #f7fbf8;
    }

    .stage {
      position: relative;
      justify-self: center;
      width: min(100%, calc((100dvh - 92px) * 16 / 9));
      aspect-ratio: 16 / 9;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #050708;
      box-shadow: 0 18px 46px var(--shadow);
    }

    video {
      width: 100%;
      max-width: 100%;
      height: 100%;
      display: block;
      background: #050708;
      object-fit: contain;
    }

    .stage:not(.has-video) video {
      visibility: hidden;
    }

    .empty {
      width: auto;
      min-height: 0;
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: transparent;
      color: rgba(245,247,246,.72);
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,.72);
      cursor: pointer;
      padding: 18px;
    }

    .empty > div {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: min(100%, 480px);
    }

    .empty strong {
      display: block;
      color: #f5f7f6;
      font-size: clamp(18px, 4.8vw, 24px);
      line-height: 1.15;
    }

    .stage.has-video .empty {
      display: none;
    }

    .status {
      display: block;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .drop-active .stage {
      border-color: var(--accent);
    }

    @media (max-width: 640px) {
      .app {
        width: min(100vw - 24px, 620px);
        gap: 12px;
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px 10px;
      }

      .top-actions {
        display: contents;
      }

      .VPNavBarAppearance.appearance {
        grid-column: 2;
        grid-row: 1;
        width: 42px;
        min-width: 42px;
        justify-self: end;
      }

      .file-button {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        min-height: 48px;
      }

      .empty {
        inset: 14px;
        padding: 16px;
      }

      .status {
        max-width: 30ch;
      }
    }
  </style>
</head>
<body>
  <main class="app" data-app>
    <header class="topbar">
      <a class="brand" href="../" aria-label="Open Yomu home">
        <img src="../yomu-icon.svg" alt="" width="36" height="36">
        <strong>Yomu Video</strong>
      </a>
      <div class="top-actions">
        <div class="VPNavBarAppearance appearance">
          <button class="VPSwitch VPSwitchAppearance" type="button" role="switch" data-theme-toggle aria-label="Switch to light theme" aria-checked="false" title="Switch to light theme">
            <span class="check">
              <span class="icon">
                <span class="vpi-sun sun" aria-hidden="true"></span>
                <span class="vpi-moon moon" aria-hidden="true"></span>
              </span>
            </span>
          </button>
        </div>
        <label class="file-button">
          Open video
          <input type="file" accept="video/*,.mkv,.mp4,.m4v,.mov,.webm,.ogv" data-video-input>
        </label>
      </div>
    </header>

    <section class="stage" data-stage data-yomu-video-frame aria-label="Video">
      <video controls playsinline preload="metadata" data-video></video>
      <button class="empty" type="button" data-empty-open>
        <div>
          <strong>Open or drop a video</strong>
          <span class="status" data-status>Use subtitle controls for tracks, lines, and mining after opening a video.</span>
        </div>
      </button>
    </section>
  </main>

  <script>
    (() => {
      const app = document.querySelector('[data-app]');
      const stage = document.querySelector('[data-stage]');
      const video = document.querySelector('[data-video]');
      const videoInput = document.querySelector('[data-video-input]');
      const emptyOpen = document.querySelector('[data-empty-open]');
      const status = document.querySelector('[data-status]');
      const themeToggle = document.querySelector('[data-theme-toggle]');
      const themeKey = 'yomu-page-theme';
      let objectUrl = '';

      function effectiveTheme() {
        const saved = localStorage.getItem(themeKey);
        if (saved === 'dark' || saved === 'light') return saved;
        return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }

      function applyTheme(theme) {
        document.documentElement.classList.toggle('yomu-page-theme-dark', theme === 'dark');
        document.documentElement.classList.toggle('yomu-page-theme-light', theme === 'light');
        if (themeToggle) {
          const label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
          themeToggle.setAttribute('aria-label', label);
          themeToggle.setAttribute('aria-checked', String(theme === 'light'));
          themeToggle.title = label;
        }
      }

      applyTheme(effectiveTheme());

      function setStatus(message) {
        status.textContent = message;
      }

      function revokeObjectUrl() {
        if (!objectUrl) return;
        URL.revokeObjectURL(objectUrl);
        objectUrl = '';
      }

      function loadVideo(file) {
        if (!file) return;
        revokeObjectUrl();
        objectUrl = URL.createObjectURL(file);
        video.src = objectUrl;
        video.load();
        stage.classList.add('has-video');
        setStatus(file.name);
      }

      function handleFiles(files) {
        for (const file of files) {
          if (file.type.startsWith('video/') || /\.(mkv|mp4|m4v|mov|webm|ogv)$/i.test(file.name)) {
            loadVideo(file);
            return;
          }
        }
        setStatus('Choose a browser-supported video file.');
      }

      videoInput.addEventListener('change', () => handleFiles(videoInput.files || []));
      emptyOpen?.addEventListener('click', () => videoInput.click());
      themeToggle?.addEventListener('click', () => {
        const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
        localStorage.setItem(themeKey, next);
        applyTheme(next);
      });

      for (const eventName of ['dragenter', 'dragover']) {
        document.addEventListener(eventName, event => {
          event.preventDefault();
          app.classList.add('drop-active');
        });
      }

      for (const eventName of ['dragleave', 'drop']) {
        document.addEventListener(eventName, event => {
          event.preventDefault();
          if (eventName === 'drop') handleFiles(event.dataTransfer?.files || []);
          app.classList.remove('drop-active');
        });
      }

      window.addEventListener('pagehide', revokeObjectUrl);
    })();
  </script>
  <script src="../yomu.user.js"></script>
</body>
</html>
