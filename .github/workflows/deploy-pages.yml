name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - docs/**
      - dist/yomu.css
      - dist/yomu.user.js
      - package.json
      - package-lock.json
      - public/newtab/**
      - public/yomu-icon.svg
      - src/**
      - scripts/annotate-greasyfork-requires.cjs
      - scripts/build-greasyfork-libraries.mjs
      - scripts/lib/greasyfork-libraries.cjs
      - scripts/sync-docs-userscript.cjs
      - scripts/lib/userscript-build-utils.cjs
      - vite.config.ts
      - config/vite/greasyfork-library.config.ts
      - config/vite/newtab.config.ts
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run docs:build
        env:
          YOMU_GOOGLE_SITE_VERIFICATION: ${{ secrets.YOMU_GOOGLE_SITE_VERIFICATION }}
          YOMU_BING_SITE_VERIFICATION: ${{ secrets.YOMU_BING_SITE_VERIFICATION }}
          YOMU_YANDEX_SITE_VERIFICATION: ${{ secrets.YOMU_YANDEX_SITE_VERIFICATION }}
          YOMU_BAIDU_SITE_VERIFICATION: ${{ secrets.YOMU_BAIDU_SITE_VERIFICATION }}
      - run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
