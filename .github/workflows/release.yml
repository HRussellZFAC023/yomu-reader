name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.3.0
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yomu
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout UserScript Compiler
        uses: actions/checkout@v6
        with:
          repository: HRussellZFAC023/UserScript-Compiler
          path: UserScript-Compiler

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            UserScript-Compiler/package-lock.json
      - name: Install compiler dependencies
        working-directory: UserScript-Compiler
        run: npm ci
      - name: Install Yomu dependencies
        run: npm ci
      - name: Ensure Electron runtime
        run: npm run prepare:electron
      - run: npm run check
      - run: npm run smoke:p0
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: xvfb-run -a npm run smoke:gaming
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - name: Build split userscript release artifact
        run: |
          npm run build:userscript
          # Preserve the split userscript: build:extension below empties dist/
          # (vite emptyOutDir), so stash it and restore after the extension build.
          cp dist/yomu.user.js "${RUNNER_TEMP:-/tmp}/yomu.user.js"
      - name: Build extension release packages
        env:
          USERSCRIPT_COMPILER_CLI: UserScript-Compiler/src/cli.mjs
        run: npm run build:extension
      - name: Package Safari Web Extension
        run: |
          cd dist/extension/release/safari
          zip -qr yomureader.com-safari-web-extension.zip yomureader.com-safari-web-extension
      - name: Build Yomu Gaming release packages
        # Best-effort: the gaming desktop build is also produced (for all
        # platforms) by the Release Yomu Gaming workflow, which uploads to the
        # same release. A flake here (e.g. Electron runtime install) must not
        # block the core userscript/extension publish below.
        continue-on-error: true
        run: |
          npm run release:gaming:linux
          cd dist-gaming/packages
          find . -maxdepth 1 -type f -name 'yomu-gaming-*' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Restore split userscript release artifact
        run: cp "${RUNNER_TEMP:-/tmp}/yomu.user.js" dist/yomu.user.js
      - name: Prepare release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const match = changelog.match(new RegExp(`## \\[${version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\][\\s\\S]*?(?=\\n## \\[|$)`));
          const notes = (match?.[0] ?? `## ${version}\n\nSee CHANGELOG.md for details.`)
            + '\n\nInstall/update userscript: https://raw.githubusercontent.com/HRussellZFAC023/yomu-reader/main/dist/yomu.user.js\n'
            + '\nYomu Gaming desktop apps (Linux x64 AppImage, Windows portable, macOS zips) are attached by the Release Yomu Gaming workflow and may appear shortly after this release is published.\n'
            + '\nRelease assets include the compiled userscript, Chrome extension ZIP, Firefox XPI, Safari Web Extension ZIP, the full compiler project bundle, a submission guide with review/audit notes, and (from the desktop build workflow) the Yomu Gaming desktop packages plus checksums.\n';
          fs.writeFileSync('release-notes.md', notes);
          NODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Core artifacts always ship so the release publishes (and Greasy Fork
          # syncs from the raw userscript URL) even if the gaming build flaked.
          assets=(
            dist/yomu.user.js \
            dist/extension/release/chrome/yomureader.com-chrome.zip \
            dist/extension/release/firefox/yomureader.com-firefox.xpi \
            dist/extension/release/safari/yomureader.com-safari-web-extension.zip \
            dist/extension/yomureader.com-extension-project.zip \
            dist/extension/review/submission-guide.md
          )
          # The Linux AppImage (and its checksums) are best-effort: the matrix
          # Release Yomu Gaming workflow builds and uploads the full desktop set
          # independently. Match electron-builder's actual name
          # (yomu-gaming-<version>-linux-x86_64.AppImage) and skip rather than
          # fail the whole release if this job did not produce it.
          linux_assets=(dist-gaming/packages/yomu-gaming-*-linux-*.AppImage*)
          if [ "${#linux_assets[@]}" -gt 0 ]; then
            assets+=("${linux_assets[@]}")
            if [ -f dist-gaming/packages/SHA256SUMS.txt ]; then
              assets+=(dist-gaming/packages/SHA256SUMS.txt)
            fi
          else
            echo "::warning::No Linux AppImage in dist-gaming/packages; publishing core assets only. Release Yomu Gaming attaches the desktop builds." >&2
            find dist-gaming/packages -maxdepth 1 -type f -print >&2 || true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --latest
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes-file release-notes.md --latest --verify-tag
          fi
