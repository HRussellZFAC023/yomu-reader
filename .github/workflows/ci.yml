name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - dist/yomu.user.js

permissions:
  contents: read

env:
  YOMU_CI_TEST_TIMEOUT_MS: 540000

jobs:
  committed-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check:repository
      - run: npm run check:artifacts

  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm ci silently skips optional platform binaries when the fresh cache
      # download fails (620 vs 619 packages on the runs that broke this job).
      - name: Ensure fallow platform binary
        run: node -e "require.resolve('@fallow-cli/linux-x64-gnu/package.json')" || npm install --no-save @fallow-cli/linux-x64-gnu@"$(node -p "require('fallow/package.json').version")"
      - run: npm run fallow:dead-code
      - run: npm run fallow:audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test-workflow-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:test-workflows

  test-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:academy:prevalidated
      - run: npm run test:academy:ci

  test-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:workers

  video-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs --kind regular --shard=${{ matrix.shard }} --total=8

  test-jpdb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs --kind jpdb --shard=${{ matrix.shard }} --total=8

  gaming-smoke:
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run smoke:gaming
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome

  layout-smoke:
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install layout smoke browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run smoke:layout-regressions
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome

  build:
    runs-on: ubuntu-latest
    needs: [committed-state, typecheck, test-workflow-coverage, test, test-jpdb, test-academy, test-workers, video-typecheck, gaming-smoke, layout-smoke]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Warm vitepress cache
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: vitepress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            vitepress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            vitepress-${{ runner.os }}-
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run docs:build
      - run: npm run verify
      - run: npm run smoke:offline-study
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:p0
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:furigana-local-default
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:youtube-controls-wake
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:youtube-title-recycler
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:study-flow-stability
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:youtube-ruby-proof
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
