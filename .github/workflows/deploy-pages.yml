name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - academy/**
      - docs/**
      - dist/yomu.css
      - dist/yomu.user.js
      - package.json
      - package-lock.json
      - public/newtab/**
      - public/academy/**
      - public/yomu-icon.svg
      - src/**
      - scripts/annotate-greasyfork-requires.cjs
      - scripts/build-greasyfork-libraries.mjs
      - scripts/build-openapi.mjs
      - scripts/docs-localization-browser-smoke.mjs
      - scripts/openapi/**
      - scripts/lib/greasyfork-libraries.cjs
      - scripts/lib/academy-revision.cjs
      - scripts/lib/hosted-runtime-graph.cjs
      - scripts/sync-docs-userscript.cjs
      - scripts/sync-academy.cjs
      - scripts/lib/userscript-build-utils.cjs
      - vite.config.ts
      - config/vite/academy.config.ts
      - config/vite/greasyfork-library.config.ts
      - config/vite/newtab.config.ts
      - .github/workflows/deploy-pages.yml

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # GitHub's Ubuntu image already carries Chrome. Keep browser acquisition out
  # of the deployment path and let Playwright launch that installed channel.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  YOMU_PLAYWRIGHT_CHANNEL: chrome

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      # Production follows CI: a push deploys only once CI has passed on the same
      # commit. 2.0.8 reached yomureader.com while CI was failing on it. A manual
      # dispatch skips the wait; it is the recovery path after a CI rerun passes.
      # CI ignores dist/yomu.user.js-only pushes, so no run within five minutes
      # means none is coming.
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 100); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "CI passed for $GITHUB_SHA."; exit 0 ;;
              completed*) echo "::error::CI ${run#completed } for $GITHUB_SHA; not deploying. Rerun CI, then run Deploy Docs by hand."; exit 1 ;;
              "") if [ "$attempt" -ge 10 ]; then echo "::warning::No CI run for $GITHUB_SHA; deploying without it."; exit 0; fi ;;
            esac
            sleep 30
          done
          echo "::error::CI did not finish for $GITHUB_SHA within 50 minutes; not deploying."
          exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global npm@11.9.0
      # configure-pages performs a GitHub API preflight that can fail on a
      # transient 5xx before any build work starts. Retry it twice, but keep
      # the final attempt required so persistent configuration/auth failures
      # remain release-blocking rather than producing a false green.
      - name: Setup Pages metadata (attempt 1)
        id: configure_pages_1
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Back off before Pages metadata retry
        if: steps.configure_pages_1.outcome == 'failure'
        run: sleep 15
      - name: Setup Pages metadata (attempt 2)
        if: steps.configure_pages_1.outcome == 'failure'
        id: configure_pages_2
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Back off before final Pages metadata attempt
        if: steps.configure_pages_1.outcome == 'failure' && steps.configure_pages_2.outcome == 'failure'
        run: sleep 30
      - name: Setup Pages metadata (required final attempt)
        if: steps.configure_pages_1.outcome == 'failure' && steps.configure_pages_2.outcome == 'failure'
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run build:academy
      - run: npm run docs:build
        env:
          YOMU_GOOGLE_SITE_VERIFICATION: ${{ secrets.YOMU_GOOGLE_SITE_VERIFICATION }}
          YOMU_BING_SITE_VERIFICATION: ${{ secrets.YOMU_BING_SITE_VERIFICATION }}
          YOMU_YANDEX_SITE_VERIFICATION: ${{ secrets.YOMU_YANDEX_SITE_VERIFICATION }}
          YOMU_BAIDU_SITE_VERIFICATION: ${{ secrets.YOMU_BAIDU_SITE_VERIFICATION }}
          YOMU_PATREON_ENABLED: ${{ vars.YOMU_PATREON_ENABLED }}
          YOMU_PATREON_URL: ${{ vars.YOMU_PATREON_URL }}
          YOMU_KOFI_URL: ${{ vars.YOMU_KOFI_URL }}
      - name: Verify rendered docs localization in browser
        timeout-minutes: 3
        env:
          YOMU_DOCS_PREVIEW_URL: http://127.0.0.1:4199
        run: |
          preview_log="${RUNNER_TEMP}/yomu-docs-preview.log"
          npx --no-install vitepress preview docs --host 127.0.0.1 --port 4199 >"$preview_log" 2>&1 &
          preview_pid=$!
          cleanup_preview() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup_preview EXIT

          preview_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent "${YOMU_DOCS_PREVIEW_URL}/ja/" >/dev/null; then
              preview_ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$preview_log"
              echo "Docs preview exited before it became ready." >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$preview_ready" -ne 1 ]; then
            cat "$preview_log"
            echo "Docs preview did not become ready within 30 seconds." >&2
            exit 1
          fi

          npm run docs:locales:browser
      - name: Verify published artifacts
        run: npm run verify
      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's artifact finalization retry can create multiple immutable
      # records after one large upload, even though this workflow has one
      # upload step. deploy-pages refuses an ambiguous artifact name. Keep the
      # exact artifact ID returned by upload-pages-artifact and delete only
      # same-run duplicates before deployment.
      - name: Reconcile duplicate Pages upload retries
        uses: actions/github-script@v8
        env:
          KEEP_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        with:
          script: |
            const keepArtifactId = Number(process.env.KEEP_ARTIFACT_ID);
            if (!Number.isSafeInteger(keepArtifactId)) {
              core.setFailed(`Invalid Pages artifact ID: ${process.env.KEEP_ARTIFACT_ID}`);
              return;
            }
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: 'github-pages',
              per_page: 100,
            });
            const pagesArtifacts = response.data.artifacts.filter(
              artifact => artifact.name === 'github-pages',
            );
            if (!pagesArtifacts.some(artifact => artifact.id === keepArtifactId)) {
              core.setFailed(`Uploaded Pages artifact ${keepArtifactId} was not found in this run.`);
              return;
            }
            for (const artifact of pagesArtifacts) {
              if (artifact.id === keepArtifactId) continue;
              core.info(`Deleting duplicate Pages artifact ${artifact.id}; keeping ${keepArtifactId}.`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
