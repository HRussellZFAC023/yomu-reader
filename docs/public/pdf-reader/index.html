  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --accent-soft: rgba(108,201,142,.2);
      --shadow: rgba(0,0,0,.32);
      --switch-shadow: rgba(0,0,0,.28);
      --brand-icon-bg: #f7fbf8;
      --stage-bg: #050708;
      --page-bg: #ffffff;
      --stage-empty-text: rgba(245,247,246,.72);
      --stage-empty-shadow: rgba(0,0,0,.72);
      --stage-empty-strong: #f5f7f6;
      --radius: 8px;
    }

    :root.yomu-page-theme-light {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #171a1f;
      --muted: #596272;
      --panel: #f7f8fa;
      --line: rgba(20,30,45,.16);
      --soft-line: rgba(20,30,45,.08);
      --accent: #3f805e;
      --accent-ink: #ffffff;
      --accent-soft: rgba(94,167,128,.16);
      --shadow: rgba(20,30,45,.12);
      --stage-bg: #e7eaee;
      --stage-empty-text: rgba(23,26,31,.72);
      --stage-empty-shadow: rgba(255,255,255,.6);
      --stage-empty-strong: #171a1f;
    }

    :root.yomu-page-theme-dark {
      color-scheme: dark;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --accent-soft: rgba(108,201,142,.2);
      --shadow: rgba(0,0,0,.32);
      --stage-bg: #050708;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--stage-bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .file-button,
    .toolbar-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 760;
    }

    button:hover,
    button:focus-visible,
    .file-button:hover,
    .file-button:focus-visible,
    .file-button:has(input[type="file"]:focus-visible) {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button[disabled] {
      opacity: .45;
      cursor: default;
    }

    .file-button {
      display: inline-grid;
      place-items: center;
      justify-items: center;
      padding: 0 14px;
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-ink);
      text-align: center;
    }

    .file-button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      line-height: 1.1;
    }

    .toolbar-button {
      display: inline-grid;
      place-items: center;
      padding: 0 12px;
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .overflow-menu { position: relative; }
    .overflow-menu > summary { list-style: none; }
    .overflow-menu > summary::-webkit-details-marker { display: none; }

    .overflow-summary {
      display: grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      height: 38px;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .more-icon {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: currentColor;
    }

    .more-icon::before {
      content: "...";
      padding-bottom: 4px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .overflow-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 40;
      display: grid;
      gap: 2px;
      min-width: 190px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 14px 36px var(--shadow);
    }

    .overflow-menu:not([open]) .overflow-panel { display: none; }

    .overflow-divider {
      width: 100%;
      margin: 4px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .overflow-panel a,
    .overflow-panel button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.2;
      text-align: left;
      text-decoration: none;
    }

    .overflow-panel a:hover,
    .overflow-panel a:focus-visible,
    .overflow-panel button:hover,
    .overflow-panel button:focus-visible,
    .overflow-summary:hover,
    .overflow-summary:focus-visible {
      background: var(--accent-soft);
      color: var(--ink);
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .VPNavBarAppearance.appearance {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      min-width: 48px;
      height: 38px;
    }

    .language-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 680;
      line-height: 1;
      cursor: pointer;
    }

    .language-button:hover,
    .language-button:focus-visible {
      background: var(--panel);
      border-color: var(--line);
      color: var(--ink);
    }

    .VPSwitch.VPSwitchAppearance {
      position: relative;
      display: block;
      width: 40px;
      min-width: 40px;
      height: 24px;
      min-height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .VPSwitch .check {
      position: absolute;
      top: 1px;
      left: 1px;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--bg);
      box-shadow: 0 1px 3px var(--switch-shadow);
      transition: transform .18s ease, background .18s ease;
    }

    .VPSwitch[aria-checked="true"] .check { transform: translateX(18px); }

    .VPSwitch .icon {
      position: relative;
      display: block;
      width: 14px;
      height: 14px;
      color: var(--muted);
    }

    .VPSwitch .sun,
    .VPSwitch .moon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      transition: opacity .18s ease;
    }

    /* Invisible enlarged tap area; the switch itself must stay a slim pill on
       every pointer type (a 44px visual blob breaks the shared nav look). */
    .VPSwitch.VPSwitchAppearance::after {
      content: "";
      position: absolute;
      inset: -11px -5px;
    }

    .VPSwitch .sun::before { content: "☀"; }
    .VPSwitch .moon::before { content: "☾"; }
    .VPSwitch[aria-checked="false"] .sun,
    .VPSwitch[aria-checked="true"] .moon { opacity: 0; }
    .VPSwitch[aria-checked="true"] .sun,
    .VPSwitch[aria-checked="false"] .moon { opacity: 1; }

    @media (pointer: coarse) {
      .brand,
      button,
      .file-button,
      .toolbar-button,
      .overflow-summary,
      .overflow-panel a,
      .overflow-panel button,
      .language-button,
      .VPNavBarAppearance.appearance,
      .page-input {
        min-height: 44px;
      }

      .overflow-summary,
      .language-button {
        width: 44px;
        min-width: 44px;
        height: 44px;
      }

      .toolbar-button.icon-button {
        width: 44px;
        min-width: 44px;
        height: 44px;
        min-height: 44px;
      }

      /* The generic 44px button floor above must not fatten the theme switch;
         its ::after overlay already provides the 44px touch target. */
      .VPSwitch.VPSwitchAppearance {
        width: 40px;
        min-width: 40px;
        height: 24px;
        min-height: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Sticky chrome: the brand bar and document toolbar stay pinned while the
       page itself scrolls natively (mouse wheel / trackpad / keyboard just work,
       no inner scroll container to fight). */
    .chrome {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 48px;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        12px
        max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--soft-line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--brand-icon-bg);
    }

    /* Document toolbar: page navigation + zoom. Hidden until a PDF is open. */
    .docbar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--soft-line);
    }

    .app:not(.has-pdf) .docbar { display: none; }

    .docbar-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      padding: 0;
    }

    .page-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-weight: 720;
      font-size: 14px;
    }

    .page-input {
      width: 3.4em;
      min-height: 34px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      text-align: center;
      font-weight: 720;
    }

    .page-total { color: var(--muted); }

    .zoom-level {
      min-width: 4ch;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    /* Scroll container for the rendered pages. */
    .viewer {
      position: relative;
      min-width: 0;
      background: var(--stage-bg);
      padding: 18px 12px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pdf-page {
      position: relative;
      flex: 0 0 auto;
      width: 0;
      height: 0;
      max-width: 100%;
      background: var(--page-bg);
      border-radius: 2px;
      box-shadow: 0 10px 30px var(--shadow);
    }

    .pdf-page canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 2px;
    }

    .pdf-page.scanned::after {
      content: attr(data-scanned-label);
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 5;
      padding: 3px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }

    .empty {
      width: min(720px, calc(100% - 24px));
      align-self: center;
      flex: 1 1 auto;
      position: relative;
      margin: clamp(12px, 2vw, 18px);
      min-height: min(520px, calc(100dvh - 100px));
      display: grid;
      place-items: center;
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: var(--stage-bg);
      color: var(--stage-empty-text);
      text-align: center;
      text-shadow: 0 1px 2px var(--stage-empty-shadow);
      cursor: pointer;
      padding: 28px;
    }

    .app.has-pdf .empty { display: none; }
    .app.has-pdf .viewer { display: flex; }
    .app:not(.has-pdf) .viewer { display: none; }

    .empty > div {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: min(100%, 480px);
    }

    .empty strong {
      display: block;
      color: var(--stage-empty-strong);
      font-size: clamp(18px, 4.8vw, 24px);
      line-height: 1.15;
    }

    .status {
      display: block;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .drop-active .viewer,
    .drop-active .empty { border-color: var(--accent); }
    .drop-active .empty { outline: 2px solid var(--accent); outline-offset: -8px; }

    /* PDF.js text layer — sits over the canvas, transparent and selectable, so
       the よむ runtime can scan, look up, mine and add furigana to real text.
       Copied from pdfjs-dist web/pdf_viewer.css (Apache-2.0) and flattened. */
    .textLayer {
      position: absolute;
      text-align: initial;
      inset: 0;
      overflow: clip;
      opacity: 1;
      line-height: 1;
      letter-spacing: normal;
      word-spacing: normal;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      caret-color: CanvasText;
      z-index: 2;
      --total-scale-factor: 1;
      --scale-factor: 1;
      --min-font-size: 1;
      --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size));
    }

    .textLayer span,
    .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      user-select: text;
    }

    .textLayer > :not(.markedContent),
    .textLayer .markedContent span:not(.markedContent) {
      z-index: 1;
      --font-height: 0;
      font-size: calc(var(--text-scale-factor) * var(--font-height));
      --scale-x: 1;
      --rotate: 0deg;

        const check = () => {
          if (hasYomuRuntime()) return resolve(true);
          if (performance.now() - started >= timeoutMs) return resolve(false);
          window.setTimeout(check, 50);
        };
        check();
      });
    }
    function loadYomuCss() {
      if (document.querySelector(`link[href$="/yomu.css"], link[href*="/yomu.css?"], link[${runtimeCssAttribute}]`)) {
        return Promise.resolve(true);
      }
      return loadLinkCandidates(runtimeAssetCandidates('yomu.css'));
    }
    function loadLinkCandidates(candidates, index = 0) {
      if (index >= candidates.length) return Promise.resolve(false);
      return new Promise(resolve => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = candidates[index];
        link.setAttribute(runtimeCssAttribute, 'true');
        link.addEventListener('load', () => resolve(true), { once: true });
        link.addEventListener('error', () => { link.remove(); void loadLinkCandidates(candidates, index + 1).then(resolve); }, { once: true });
        document.head.append(link);
      });
    }
    function loadYomuScript() {
      if (hasYomuRuntime()) return Promise.resolve(true);
      if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
      const existing = document.getElementById(runtimeScriptId) || document.querySelector(`script[${runtimeScriptAttribute}]`);
      if (existing) return waitForYomuRuntime();
      return loadScriptCandidates(runtimeAssetCandidates('yomu.user.js'), 0, { id: runtimeScriptId, attribute: runtimeScriptAttribute });
    }
    async function loadYomuCompanions() {
      for (const fileName of runtimeCompanionFiles) {
        if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
        if (document.querySelector(`script[${runtimeCompanionAttribute}="${fileName}"]`)) continue;
        const loaded = await loadScriptCandidates(runtimeAssetCandidates(fileName), 0, {
          attribute: runtimeCompanionAttribute,
          attributeValue: fileName,
        });
        if (!loaded) return false;
      }
      return true;
    }
    function loadScriptCandidates(candidates, index = 0, options = {}) {
      if (index >= candidates.length) return Promise.resolve(false);
      return new Promise(resolve => {
        const script = document.createElement('script');
        if (options.id) script.id = options.id;
        script.async = false;
        script.src = candidates[index];
        script.setAttribute(options.attribute || runtimeScriptAttribute, options.attributeValue || 'true');
        script.addEventListener('load', () => {
          if (!options.id) return resolve(true);
          void waitForYomuRuntime().then(ready => {
            if (ready) return resolve(true);
            script.remove();
            void loadScriptCandidates(candidates, index + 1, options).then(resolve);
          });
        }, { once: true });
        script.addEventListener('error', () => { script.remove(); void loadScriptCandidates(candidates, index + 1, options).then(resolve); }, { once: true });
        document.head.append(script);
      });
    }
    async function ensureYomuRuntime(options = {}) {
      if (hasYomuRuntime()) return true;
      if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
      if (!options.silent) setStatus(options.message || text().loadingRuntime);
      runtimeLoadPromise ||= (async () => {
        await loadYomuCss();
        if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
        const companionsLoaded = await loadYomuCompanions();
        if (!companionsLoaded) return false;
        return loadYomuScript();
      })();
      const loaded = await runtimeLoadPromise.catch(() => false);
      const ready = loaded && await waitForYomuRuntime();
      if (!ready) runtimeLoadPromise = null;
      if (!ready && !options.silent) setStatus(text().runtimeMissing);
      return ready;
    }
    function settingsVisible() { return Boolean(document.querySelector('.jpdb-reader-settings')); }
    function dispatchSettingsOpen() {
      if (settingsVisible()) return true;
      window.dispatchEvent(new CustomEvent(openSettingsEvent, { detail: { panel: 'basics' } }));
      return settingsVisible();
    }
    async function openSettings() {
      overflowMenu?.removeAttribute('open');
      if (dispatchSettingsOpen()) return;
      await ensureYomuRuntime({ message: text().loadingSettings });
      if (dispatchSettingsOpen()) return;
      [120, 360, 900].forEach(delay => window.setTimeout(dispatchSettingsOpen, delay));
      window.setTimeout(() => { if (!dispatchSettingsOpen()) setStatus(text().runtimeMissing); }, 1350);
    }

    /* ---- PDF rendering ---- */
    function fileKeyFor(file) { return `${positionKeyPrefix}${file.name}:${file.size}`; }

    function resetViewer() {
      pages.clear();
      viewer.replaceChildren();
      scannedNoticeShown = false;
      currentPage = 1;
    }

    async function openPdf(file) {
      if (!file) return;
      if (pdfDoc) { try { await pdfDoc.destroy(); } catch {} pdfDoc = null; }
      resetViewer();
      app.classList.add('has-pdf');
      currentFileKey = fileKeyFor(file);
      setStatus(text().opening(file.name));
      void ensureYomuRuntime({ silent: true });
      let buffer;
      try {
        buffer = await file.arrayBuffer();
        const task = pdfjsLib.getDocument({
          data: new Uint8Array(buffer),
          cMapUrl: new URL('cmaps/', VENDOR).href,
          cMapPacked: true,
          standardFontDataUrl: new URL('standard_fonts/', VENDOR).href,
          wasmUrl: new URL('wasm/', VENDOR).href,
        });
        pdfDoc = await task.promise;
      } catch (error) {
        console.error('[yomu-pdf] failed to open', error);
        app.classList.remove('has-pdf');
        setStatus(text().loadFailed);
        return;
      }
      pageTotal.textContent = `/ ${pdfDoc.numPages}`;
      buildPlaceholders();
      setStatus(text().ready(file.name, pdfDoc.numPages));
      const savedPage = clampPage(Number(localStorage.getItem(currentFileKey)) || 1);
      currentPage = savedPage;
      requestRender(savedPage); // render just the first page now; the observer pulls in the rest
      if (savedPage > 1) goToPage(savedPage, 'auto');
      else updateCurrentPageFromScroll();
      updateNavButtons();
      updateZoomLabel();
    }

    function buildPlaceholders() {
      const fragment = document.createDocumentFragment();
      for (let number = 1; number <= pdfDoc.numPages; number += 1) {
        const container = document.createElement('div');
        container.className = 'pdf-page';
        container.dataset.pageNumber = String(number);
        container.dataset.scannedLabel = text().scannedBadge;
        container.dataset.pdfText = 'pending';
        container.dataset.yomuCanvasOcr = 'off';
        const canvas = document.createElement('canvas');
        canvas.dataset.pdfText = 'pending';
        canvas.dataset.yomuCanvasOcr = 'off';
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        // Classification can inspect PDF.js text asynchronously after the layer
        // has been populated. Keep that pending layer out of the reader scan
        // surface until we know it belongs to a real text PDF; otherwise a
        // transparent OCR layer over a scanned image can be annotated during
        // the classification gap.
        textLayerDiv.hidden = true;
        textLayerDiv.setAttribute('aria-hidden', 'true');
        container.append(canvas, textLayerDiv);
        // Estimated size keeps the scrollbar stable before render; corrected on render.
        container.style.width = '640px';
        container.style.height = '880px';
        pages.set(number, { container, canvas, textLayerDiv, status: 'idle' });
        fragment.append(container);
        pageObserver.observe(container);
        visibilityObserver.observe(container);
      }
      viewer.append(fragment);
    }

    function clampPage(number) {
      if (!pdfDoc) return 1;
      return Math.min(Math.max(1, Math.round(number) || 1), pdfDoc.numPages);
    }

    function fitWidthScale(baseViewport) {
      // Fit the page to a comfortable reading column, not the full window — on a
      // wide monitor true fit-width blows a small page up to 300%+. Cap the target
      // width so the default lands at a readable size and the page centres.
      const available = Math.min(viewer.clientWidth - 28, MAX_FIT_WIDTH_PX);
      if (available <= 0) return 1;
      return Math.max(MIN_SCALE, Math.min(MAX_SCALE, available / baseViewport.width));
    }

    function effectiveScaleLabel() {
      if (currentScale) return `${Math.round(currentScale * 100)}%`;
      const first = pages.get(currentPage) || pages.get(1);
      const shown = first?.shownScale;
      return shown ? `${Math.round(shown * 100)}%` : 'Fit';
    }

    // Clamp the backing-store scale so the canvas never exceeds the engine's
    // size limit (which causes the corner/black-page artifact) and stays within
    // a sane pixel budget. The page still displays at full CSS size; only the
    // raster resolution is reduced when a page would otherwise be enormous.
    function cappedRenderScale(cssScale, baseViewport) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let scale = cssScale * dpr;
      const cap = (limit, dim) => { if (dim * scale > limit) scale = limit / dim; };
      cap(MAX_CANVAS_DIM, baseViewport.width);
      cap(MAX_CANVAS_DIM, baseViewport.height);
      const area = baseViewport.width * baseViewport.height;
      if (area * scale * scale > MAX_CANVAS_PIXELS) scale = Math.sqrt(MAX_CANVAS_PIXELS / area);
      return Math.max(0.1, scale);
    }

    // Concurrency-limited render queue. Heavy scanned books would otherwise fire
    // dozens of concurrent renders as the observer/scroll fan out and crash the tab.
    function requestRender(number) {
      if (!pdfDoc || number < 1 || number > pdfDoc.numPages) return;
      const entry = pages.get(number);
      if (!entry || entry.status === 'rendering' || entry.status === 'done') return;
      if (renderQueue.includes(number)) return;
      renderQueue.push(number);
      drainRenderQueue();
    }

    function drainRenderQueue() {
      while (activeRenders < MAX_CONCURRENT_RENDERS && renderQueue.length) {
        // Prioritise pages closest to the one being read.
        renderQueue.sort((a, b) => Math.abs(a - currentPage) - Math.abs(b - currentPage));
        const number = renderQueue.shift();
        activeRenders += 1;
        void renderPage(number).finally(() => { activeRenders -= 1; drainRenderQueue(); });
      }
    }

    function cancelRender(entry) {
      if (entry.renderTask) { try { entry.renderTask.cancel(); } catch {} entry.renderTask = null; }
    }

    async function renderPage(number) {
      const entry = pages.get(number);
      if (!entry || entry.status === 'rendering' || entry.status === 'done') return;
      entry.status = 'rendering';
      const epoch = renderEpoch;
      try {
        const page = await pdfDoc.getPage(number);
        if (epoch !== renderEpoch) { entry.status = 'idle'; return; }
        const baseViewport = page.getViewport({ scale: 1 });
        const cssScale = currentScale || fitWidthScale(baseViewport);
        entry.shownScale = cssScale;
        entry.baseW = baseViewport.width;
        entry.baseH = baseViewport.height;
        const cssWidth = Math.floor(baseViewport.width * cssScale);
        const cssHeight = Math.floor(baseViewport.height * cssScale);
        entry.container.style.width = `${cssWidth}px`;
        entry.container.style.height = `${cssHeight}px`;

        // Render the bitmap at a capped device-pixel resolution (no transform
        // matrix — the viewport scale carries everything; the CSS box downsamples).
        // Paint into a DETACHED canvas and swap it in only once it is ready, so the
        // visible page keeps its old bitmap (no black flash) while zooming.
        const renderScale = cappedRenderScale(cssScale, baseViewport);
        const renderViewport = page.getViewport({ scale: renderScale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(renderViewport.width);
        canvas.height = Math.floor(renderViewport.height);
        canvas.dataset.pdfText = 'pending';
        canvas.dataset.yomuCanvasOcr = 'off';
        const context = canvas.getContext('2d', { alpha: false });
        const task = page.render({ canvasContext: context, viewport: renderViewport });
        entry.renderTask = task;
        await task.promise;
        entry.renderTask = null;
        if (epoch !== renderEpoch) { entry.status = 'idle'; return; }
        entry.canvas.replaceWith(canvas);
        entry.canvas = canvas;

        // Text layer overlays the CSS box, so it uses the (un-capped) CSS scale.
        const textViewport = page.getViewport({ scale: cssScale });
        const textLayerDiv = entry.textLayerDiv;
        textLayerDiv.replaceChildren();
        textLayerDiv.style.setProperty('--scale-factor', String(cssScale));
        textLayerDiv.style.setProperty('--total-scale-factor', String(cssScale));
        const textLayer = new pdfjsLib.TextLayer({
          textContentSource: page.streamTextContent(),
          container: textLayerDiv,
          viewport: textViewport,
        });
        await textLayer.render();
        entry.status = 'done';

        const textLength = compactTextLength(textLayerDiv.textContent);
        const pageStructure = await analyzePdfPageStructure(page, baseViewport);
        const classification = classifyPdfPageTextMode(textLayerDiv, textLength, pageStructure);
        if (epoch !== renderEpoch) { entry.status = 'idle'; return; }
        markPdfPageTextMode(entry, classification.isScanned, textLength, classification.reason);
        if (classification.isScanned) maybeShowScannedNotice();
        updateZoomLabel();
        evictDistantPages(); // free bitmaps left behind by fast scrolling
      } catch (error) {
        entry.renderTask = null;
        entry.status = 'idle';
        if (error?.name === 'RenderingCancelledException') return;
        console.warn(`[yomu-pdf] failed to render page ${number}`, error);
      }
    }

    function classifyPdfPageTextMode(textLayerDiv, textLength, pageStructure) {
      if (textLength < SCANNED_TEXT_THRESHOLD) return { isScanned: true, reason: 'empty-text-layer' };
      if (looksLikeImageBackedOcrPage(pageStructure, textLayerDiv, textLength)) {
        return { isScanned: true, reason: pageStructure.invisibleText ? 'image-backed-invisible-text' : 'image-backed-ocr-text' };
      }
      if (looksLikeEmbeddedOcrTextLayer(textLayerDiv, textLength)) {
        return { isScanned: true, reason: 'image-backed-ocr-text' };
      }
      return { isScanned: false, reason: 'text-layer' };
    }

    function compactTextLength(value) {
      return (value || '').replace(/\s+/g, '').length;
    }

    async function analyzePdfPageStructure(page, baseViewport) {
      const structure = { dominantRasterImage: false, invisibleText: false, maxRasterImageAreaRatio: 0 };
      try {
        const operatorList = await page.getOperatorList();
        const ops = pdfjsLib.OPS || {};
        const imageOps = new Set([
          ops.paintImageMaskXObject,
          ops.paintImageMaskXObjectGroup,
          ops.paintImageXObject,
          ops.paintInlineImageXObject,
          ops.paintInlineImageXObjectGroup,
          ops.paintImageXObjectRepeat,
          ops.paintImageMaskXObjectRepeat,
        ].filter(value => typeof value === 'number'));
        const saveOp = ops.save;
        const restoreOp = ops.restore;
        const transformOp = ops.transform;
        const textRenderingModeOp = ops.setTextRenderingMode;
        const stack = [];
        let ctm = [1, 0, 0, 1, 0, 0];
        const pageArea = Math.max(1, baseViewport.width * baseViewport.height);

        for (let index = 0; index < operatorList.fnArray.length; index += 1) {
          const fn = operatorList.fnArray[index];
          const args = operatorList.argsArray[index] || [];
          if (fn === saveOp) {
            stack.push(ctm);
          } else if (fn === restoreOp) {
            ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
          } else if (fn === transformOp) {
            const matrix = pdfOperatorMatrix(args);
            if (matrix) ctm = multiplyPdfMatrix(ctm, matrix);
          } else if (fn === textRenderingModeOp && Number(args[0]) === 3) {
            structure.invisibleText = true;
          } else if (imageOps.has(fn)) {
            const ratio = rasterImageAreaRatio(ctm, pageArea);
            structure.maxRasterImageAreaRatio = Math.max(structure.maxRasterImageAreaRatio, ratio);
          }
        }
        structure.dominantRasterImage = structure.maxRasterImageAreaRatio >= DOMINANT_RASTER_IMAGE_AREA_RATIO;
      } catch (error) {
        console.warn('[yomu-pdf] failed to inspect page operators', error);
      }
      return structure;
    }

    function looksLikeImageBackedOcrPage(pageStructure, textLayerDiv, textLength) {
      if (!pageStructure?.dominantRasterImage) return false;
      return pageStructure.invisibleText || looksLikeEmbeddedOcrTextLayer(textLayerDiv, textLength);
    }

    function pdfOperatorMatrix(args) {
      if (Array.isArray(args) && args.length >= 6 && args.every(value => typeof value === 'number')) return args.slice(0, 6);
      const first = args?.[0];
      if (Array.isArray(first) && first.length >= 6 && first.every(value => typeof value === 'number')) return first.slice(0, 6);
      return null;
    }

    function multiplyPdfMatrix(left, right) {
      return [
        left[0] * right[0] + left[2] * right[1],
        left[1] * right[0] + left[3] * right[1],
        left[0] * right[2] + left[2] * right[3],
        left[1] * right[2] + left[3] * right[3],
        left[0] * right[4] + left[2] * right[5] + left[4],
        left[1] * right[4] + left[3] * right[5] + left[5],
      ];
    }

    function rasterImageAreaRatio(matrix, pageArea) {
      const points = [
        applyPdfMatrix(matrix, 0, 0),
        applyPdfMatrix(matrix, 1, 0),
        applyPdfMatrix(matrix, 0, 1),
        applyPdfMatrix(matrix, 1, 1),
      ];
      const xs = points.map(point => point[0]);
      const ys = points.map(point => point[1]);
      const width = Math.max(...xs) - Math.min(...xs);
      const height = Math.max(...ys) - Math.min(...ys);
      return Math.max(0, width * height) / pageArea;
    }

    function applyPdfMatrix(matrix, x, y) {
      return [
        matrix[0] * x + matrix[2] * y + matrix[4],
        matrix[1] * x + matrix[3] * y + matrix[5],
      ];
    }

    function looksLikeEmbeddedOcrTextLayer(textLayerDiv, textLength) {
      if (textLength < OCR_TEXT_LAYER_MIN_CHARS) return false;
      if (looksLikeFragmentedOcrText(textLayerDiv.textContent || '', textLength)) return true;
      const spans = [...textLayerDiv.querySelectorAll('span')]
        .map(span => {
          const chars = compactTextLength(span.textContent);
          const rect = span.getBoundingClientRect();
          return { chars, rect };
        })
        .filter(item => item.chars > 0 && item.rect.width > 0 && item.rect.height > 0);
      if (spans.length < OCR_TEXT_LAYER_MIN_SPANS) return false;

      let narrow = 0;
      let tiny = 0;
      let tall = 0;
      let overlap = 0;
      const occupied = new Map();
      for (const { chars, rect } of spans) {
        if (chars >= 2 && rect.width / chars < OCR_TEXT_LAYER_MAX_WIDTH_PER_CHAR) narrow += 1;
        if (chars >= 2 && rect.width <= OCR_TEXT_LAYER_TINY_WIDTH_PX) tiny += 1;
        if (chars >= 2 && rect.height / Math.max(1, rect.width) > OCR_TEXT_LAYER_TALL_ASPECT) tall += 1;
        const slot = `${Math.round(rect.left / 4)}:${Math.round(rect.top / 4)}`;
        const count = occupied.get(slot) || 0;
        if (count) overlap += 1;
        occupied.set(slot, count + 1);
      }

      const spanDensity = spans.length / Math.max(1, textLength);
      const ratio = count => count / spans.length;
      const brokenGeometry = ratio(narrow) >= OCR_TEXT_LAYER_NARROW_RATIO
        || ratio(tiny) >= OCR_TEXT_LAYER_TINY_RATIO
        || ratio(tall) >= OCR_TEXT_LAYER_TALL_RATIO
        || ratio(overlap) >= OCR_TEXT_LAYER_OVERLAP_RATIO;
      return brokenGeometry && (
        spanDensity >= OCR_TEXT_LAYER_MIN_SPANS_PER_CHAR
        || ratio(narrow) >= OCR_TEXT_LAYER_NARROW_RATIO
        || ratio(tall) >= OCR_TEXT_LAYER_TALL_RATIO
      );
    }

    function looksLikeFragmentedOcrText(rawText, textLength) {
      const japaneseGaps = (rawText.match(/[ぁ-んァ-ヶ一-龯]\s+[ぁ-んァ-ヶ一-龯]/g) || []).length;
      if (japaneseGaps >= OCR_TEXT_LAYER_MIN_JP_GAPS
        && japaneseGaps / Math.max(1, textLength) >= OCR_TEXT_LAYER_JP_GAP_RATIO) {
        return true;
      }
      const hardBreaks = (rawText.match(/[\n\r]/g) || []).length;
      return hardBreaks >= OCR_TEXT_LAYER_MIN_BREAKS
        && hardBreaks / Math.max(1, textLength) >= OCR_TEXT_LAYER_BREAK_RATIO;
    }

    function markPdfPageTextMode(entry, isScanned, textLength, reason) {
      entry.container.classList.toggle('scanned', isScanned);
      entry.container.classList.toggle('text-pdf', !isScanned);
      entry.container.dataset.pdfText = isScanned ? 'scanned' : 'text';
      entry.container.dataset.pdfTextLength = String(textLength);
      entry.container.dataset.pdfTextReason = reason;
      entry.container.dataset.yomuCanvasOcr = isScanned ? 'on' : 'off';
      entry.canvas.dataset.pdfText = isScanned ? 'scanned' : 'text';
      entry.canvas.dataset.pdfTextReason = reason;
      entry.canvas.dataset.yomuCanvasOcr = isScanned ? 'on' : 'off';
      entry.textLayerDiv.hidden = isScanned;
      entry.textLayerDiv.setAttribute('aria-hidden', String(isScanned));
    }

    function resetPdfPageTextMode(entry) {
      entry.container.classList.remove('scanned', 'text-pdf');
      entry.container.dataset.pdfText = 'pending';
      entry.container.dataset.pdfTextLength = '0';
      entry.container.dataset.pdfTextReason = 'pending';
      entry.container.dataset.yomuCanvasOcr = 'off';
      entry.canvas.dataset.pdfText = 'pending';
      entry.canvas.dataset.pdfTextReason = 'pending';
      entry.canvas.dataset.yomuCanvasOcr = 'off';
      entry.textLayerDiv.hidden = true;
      entry.textLayerDiv.setAttribute('aria-hidden', 'true');
    }

    function maybeShowScannedNotice() {
      if (scannedNoticeShown) return;
      scannedNoticeShown = true;
      setStatus(text().scannedNotice);
      void ensureYomuRuntime({ silent: true });
    }

    // Free the bitmap + text layer of pages far from the reader so memory stays
    // bounded on 200+ page scanned books (the prime cause of the tab crash).
    function evictDistantPages() {
      for (const [number, entry] of pages) {
        if (Math.abs(number - currentPage) <= KEEP_WINDOW) continue;
        if (entry.status === 'idle' && !entry.canvas.width) continue;
        cancelRender(entry);
        entry.canvas.width = 0;
        entry.canvas.height = 0;
        entry.textLayerDiv.replaceChildren();
        resetPdfPageTextMode(entry);
        entry.status = 'idle';
      }
      const i = renderQueue.length;
      renderQueue.splice(0, i, ...renderQueue.filter(n => Math.abs(n - currentPage) <= KEEP_WINDOW + 1));
    }

    // Zoom / fit changed: invalidate in-flight renders, drop cached bitmaps, and
    // re-render what is on screen at the new scale.
    function rescaleAll() {
      renderEpoch += 1;
      renderQueue.length = 0;
      for (const entry of pages.values()) {
        cancelRender(entry);
        entry.status = 'idle';
        entry.textLayerDiv.replaceChildren();
        resetPdfPageTextMode(entry);
        // Resize the box to the new scale up front (for pages we've measured) so
        // the scroll height stays consistent; keep the old bitmap visible (CSS-
        // scaled) until the fresh render swaps in — no black flash.
        if (entry.baseW) {
          const s = currentScale || fitWidthScale({ width: entry.baseW, height: entry.baseH });
          entry.container.style.width = `${Math.floor(entry.baseW * s)}px`;
          entry.container.style.height = `${Math.floor(entry.baseH * s)}px`;
        }
      }
      const visible = [...visibilityRatios].filter(([, ratio]) => ratio > 0).map(([number]) => number);
      for (const number of new Set([currentPage, ...visible, currentPage - 1, currentPage + 1])) requestRender(number);
    }

    /* IntersectionObserver renders pages as they approach the viewport and keeps
       the page indicator + saved reading position in sync with the scroll. */
    const pageObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        requestRender(Number(entry.target.dataset.pageNumber));
      }
    }, { root: null, rootMargin: '300px 0px' });

    const visibilityRatios = new Map();
    const visibilityObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const number = Number(entry.target.dataset.pageNumber);
        visibilityRatios.set(number, entry.isIntersecting ? entry.intersectionRatio : 0);
      }
      updateCurrentPageFromScroll();
    }, { root: null, threshold: [0, 0.25, 0.5, 0.75, 1] });

    function updateCurrentPageFromScroll() {
      let best = currentPage;
      let bestRatio = -1;
      for (const [number, ratio] of visibilityRatios) {
        if (ratio > bestRatio) { bestRatio = ratio; best = number; }
      }
      if (best !== currentPage) {
        currentPage = best;
        if (document.activeElement !== pageInput) pageInput.value = String(currentPage);
        updateNavButtons();
        updateZoomLabel();
        // Prefetch immediate neighbours.
        requestRender(currentPage - 1);
        requestRender(currentPage + 1);
      }
      // Always run — fast scrolling paints pages between currentPage changes,
      // and their off-heap canvas memory must be reclaimed to avoid an OOM crash.
      evictDistantPages();
      schedulePositionSave();
    }

    function schedulePositionSave() {
      if (positionSaveTimer) window.clearTimeout(positionSaveTimer);
      positionSaveTimer = window.setTimeout(() => {
        if (currentFileKey) localStorage.setItem(currentFileKey, String(currentPage));
      }, 400);
    }

    function updateNavButtons() {
      prevPageBtn.disabled = !pdfDoc || currentPage <= 1;
      nextPageBtn.disabled = !pdfDoc || currentPage >= pdfDoc.numPages;
    }
    function updateZoomLabel() { zoomLevel.textContent = effectiveScaleLabel(); }

    function goToPage(number, behavior = 'smooth') {
      const target = clampPage(number);
      const entry = pages.get(target);
      if (!entry) return;
      const scrollBehavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : behavior;
      currentPage = target;
      pageInput.value = String(target);
      requestRender(target);
      requestRender(target + 1);
      entry.container.scrollIntoView({ behavior: scrollBehavior, block: 'start' });
      updateNavButtons();
    }

    function setScale(nextScale) {
      const reference = pages.get(currentPage);
      const base = reference?.shownScale || 1;
      currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, nextScale ?? base));
      rescaleAll();
      updateZoomLabel();
    }

    function handleFiles(files) {
      for (const file of files) {
        if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
          void openPdf(file);
          return;
        }
      }
      setStatus(text().choosePdf);
    }

    /* ---- events ---- */
    pdfInput.addEventListener('change', () => {
      const files = Array.from(pdfInput.files || []);
      pdfInput.value = '';
      window.requestAnimationFrame(() => handleFiles(files));
    });
    emptyOpen?.addEventListener('click', () => pdfInput.click());
    themeToggle?.addEventListener('click', () => saveThemePreference(effectiveTheme() === 'dark' ? 'light' : 'dark'));
    languageToggle?.addEventListener('click', () => saveInterfaceLanguage(nextInterfaceLanguage()));
    settingsTrigger?.addEventListener('click', openSettings);
    prevPageBtn?.addEventListener('click', () => goToPage(currentPage - 1));
    nextPageBtn?.addEventListener('click', () => goToPage(currentPage + 1));
    pageInput?.addEventListener('change', () => goToPage(Number(pageInput.value)));
    pageInput?.addEventListener('keydown', (event) => { if (event.key === 'Enter') goToPage(Number(pageInput.value)); });
    zoomInBtn?.addEventListener('click', () => setScale((pages.get(currentPage)?.shownScale || 1) * 1.2));
    zoomOutBtn?.addEventListener('click', () => setScale((pages.get(currentPage)?.shownScale || 1) / 1.2));
    fitWidthBtn?.addEventListener('click', () => { currentScale = 0; rescaleAll(); updateZoomLabel(); });

    window.addEventListener(settingsChangeEvent, syncFromSettingsEvent);
    window.addEventListener('storage', (event) => {
      if (event.key === settingsKey || event.key === themeKey || event.key === null) { applyTheme(); applyAccent(); }
    });
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (themePreference() === 'auto') { applyTheme(); applyAccent(); }
    });
    brandIcon?.addEventListener('error', () => {
      brandIcon.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(fallbackIconSvg)}`;
    }, { once: true });

    for (const eventName of ['dragenter', 'dragover']) {
      document.addEventListener(eventName, (event) => { event.preventDefault(); app.classList.add('drop-active'); });
    }
    for (const eventName of ['dragleave', 'drop']) {
      document.addEventListener(eventName, (event) => {
        event.preventDefault();
        if (eventName === 'drop') handleFiles(event.dataTransfer?.files || []);
        app.classList.remove('drop-active');
      });
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      if (!pdfDoc || currentScale) return; // only fit-width tracks the viewport
      if (resizeTimer) window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => rescaleAll(), 200);
    });

    window.addEventListener('pagehide', () => {
      if (currentFileKey) localStorage.setItem(currentFileKey, String(currentPage));
    });

    applyTheme();
    applyInterfaceLanguage(effectiveInterfaceLanguage());
    updateNavButtons();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => undefined);
    }
    void ensureYomuRuntime({ silent: true });
  </script>
</body>
</html>
