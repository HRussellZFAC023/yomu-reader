  "/academy/api/auth/google/recovery":
    "post":
      "operationId": "createGoogleRecoverySession"
      "tags":
        - "Authentication"
      "summary": "Start account recovery"
      "description": "Creates an auth-only session for recovering an existing Google-linked account."
      "security": []
      "responses":
        "201":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
