      "additionalProperties": false
    "Session":
      "type": "object"
      "required":
        - "sessionId"
        - "expiresAt"
        - "offlineResumeUntil"
        - "accountRequired"
      "properties":
        "sessionId":
          "type": "string"
          "format": "uuid"
        "expiresAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
        "offlineResumeUntil":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
        "accountRequired":
          "type": "boolean"
          "const": true
      "additionalProperties": false
    "SessionStatus":
      "type": "object"
      "required":
        - "state"
      "properties":
        "state":
          "type": "string"
          "enum":
            - "signed-out"
            - "active-unlinked"
            - "resumable"
            - "linked"
      "additionalProperties": false
    "ReaderAuthSession":
      "type": "object"
      "required":
        - "sessionId"
        - "expiresAt"
        - "offlineResumeUntil"
        - "accountRequired"
        - "state"
      "properties":
        "sessionId":
          "type": "string"
          "format": "uuid"
        "expiresAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
        "offlineResumeUntil":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
        "accountRequired":
          "type": "boolean"
          "const": true
        "state":
          "type": "string"
          "enum":
            - "active-unlinked"
            - "linked"
      "additionalProperties": false
    "AccountPatch":
      "type": "object"
      "minProperties": 1
      "properties":
        "displayName":
          "type": "string"
          "minLength": 1
          "maxLength": 32
        "avatarKey":
          "type":
            - "string"
            - "null"
          "enum":
            - "quality-2"
            - "quality-3"
            - "quality-4"
            - "quality-5"
            - null
        "boardVisible":
          "type": "boolean"
        "shareAvatar":
          "type": "boolean"
      "additionalProperties": false
    "ClassMembership":
      "type": "object"
      "required":
        - "classId"
        - "name"
        - "role"
        - "boardHidden"
      "properties":
        "classId":
          "type": "string"
        "name":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "learner"
            - "sensei"
        "boardHidden":
          "type": "boolean"
      "additionalProperties": false
    "Account":
      "type": "object"
      "required":
        - "accountId"
        - "displayName"
        - "displayTag"
        - "nameChosen"
        - "avatarKey"
        - "boardVisible"
        - "shareAvatar"
        - "academyAccess"
        - "classes"
      "properties":
        "accountId":
          "type": "string"
          "format": "uuid"
        "displayName":
          "type": "string"
        "displayTag":
          "type": "string"
        "nameChosen":
          "type": "boolean"
        "avatarKey":
          "type":
            - "string"
            - "null"
        "boardVisible":
          "type": "boolean"
        "shareAvatar":
          "type": "boolean"
        "academyAccess":
          "type": "boolean"
        "classes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ClassMembership"
      "additionalProperties": false
    "Profile":
      "type": "object"
      "required":
        - "profileId"
        - "deviceId"
        - "accountId"
        - "keyVersion"
        - "createdAt"
      "properties":
        "profileId":
          "type": "string"
          "format": "uuid"
        "deviceId":
          "type": "string"
          "format": "uuid"
        "accountId":
          "type":
            - "string"
            - "null"
          "format": "uuid"
        "keyVersion":
          "type": "integer"
          "minimum": 1
        "createdAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
      "additionalProperties": false
    "KeyCommitmentRequest":
      "type": "object"
      "required":
        - "keyCommitment"
      "properties":
        "keyCommitment":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
          "minLength": 43
          "maxLength": 43
      "additionalProperties": false
    "KeyInitialized":
      "type": "object"
      "required":
        - "initialized"
      "properties":
        "initialized":
          "type": "boolean"
          "const": true
      "additionalProperties": false
    "Entitlement":
      "oneOf":
        -
          "type": "object"
          "required":
            - "entitlement"
          "properties":
            "entitlement":
              "type": "string"
              "const": "none"
          "additionalProperties": false
        -
          "type": "object"
          "required":
            - "entitlement"
            - "source"
            - "state"
          "properties":
            "entitlement":
              "type": "string"
              "const": "academy"
            "source":
              "type": "string"
            "state":
              "type": "string"
            "expiresAt":
              "type":
                - "integer"
                - "null"
              "format": "int64"
          "additionalProperties": true
    "EntitlementRedeemRequest":
      "type": "object"
      "required":
        - "code"
      "properties":
        "code":
          "type": "string"
      "additionalProperties": false
    "PairingTicket":
      "type": "object"
      "required":
        - "pairingId"
        - "code"
        - "expiresAt"
      "properties":
        "pairingId":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
        "expiresAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
      "additionalProperties": false
    "KeyEnvelope":
      "type": "object"
      "required":
        - "keyVersion"
        - "salt"
        - "nonce"
        - "ciphertext"
      "properties":
        "keyVersion":
          "type": "integer"
          "minimum": 1
        "salt":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
        "nonce":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
        "ciphertext":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
      "additionalProperties": false
    "PairingReady":
      "type": "object"
      "required":
        - "pairingId"
        - "ready"
      "properties":
        "pairingId":
          "type": "string"
          "format": "uuid"
        "ready":
          "type": "boolean"
          "const": true
      "additionalProperties": false
    "PairingClaimRequest":
      "type": "object"
      "required":
        - "code"
      "properties":
        "code":
          "type": "string"
      "additionalProperties": false
    "DevicePairingClaimRequest":
      "type": "object"
      "required":
        - "code"
        - "claimId"
        - "deviceSecret"
      "properties":
        "code":
          "type": "string"
        "claimId":
          "type": "string"
          "format": "uuid"
        "deviceSecret":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
          "minLength": 43
          "maxLength": 43
      "additionalProperties": false
    "PairingClaim":
      "type": "object"
      "required":
        - "pairingId"
        - "profileId"
        - "deviceId"
        - "keyEnvelope"
      "properties":
        "connected":
          "type": "boolean"
        "pairingId":
          "type": "string"
          "format": "uuid"
        "profileId":
          "type": "string"
          "format": "uuid"
        "deviceId":
          "type": "string"
          "format": "uuid"
        "credential":
          "type": "string"
          "description": "Returned only for Reader device pairing claims."
        "keyEnvelope":
          "$ref": "#/components/schemas/KeyEnvelope"
      "additionalProperties": false
    "DeviceStatus":
      "type": "object"
      "required":
        - "connected"
        - "profileId"
        - "deviceId"
        - "keyVersion"
      "properties":
        "connected":
          "type": "boolean"
          "const": true
        "profileId":
          "type": "string"
          "format": "uuid"
        "deviceId":
          "type": "string"
          "format": "uuid"
        "keyVersion":
          "type": "integer"
          "minimum": 1
      "additionalProperties": true
    "DeviceList":
      "type": "object"
      "required":
        - "devices"
      "properties":
        "devices":
          "type": "array"
          "items":
            "type": "object"
            "required":
              - "deviceId"
              - "createdAt"
              - "lastSeenAt"
            "properties":
              "deviceId":
                "type": "string"
                "format": "uuid"
              "createdAt":
                "type": "integer"
                "format": "int64"
                "description": "Unix time in milliseconds."
              "lastSeenAt":
                "type": "integer"
                "format": "int64"
                "description": "Unix time in milliseconds."
            "additionalProperties": false
      "additionalProperties": false
    "RevokedDevice":
      "type": "object"
      "required":
        - "revoked"
      "properties":
        "revoked":
          "type": "boolean"
          "const": true
        "deviceId":
          "type": "string"
          "format": "uuid"
      "additionalProperties": false
    "EncryptedEvent":
      "type": "object"
      "required":
        - "id"
        - "occurredAt"
        - "keyVersion"
        - "nonce"
        - "ciphertext"
      "properties":
        "cursor":
          "type": "integer"
          "minimum": 0
        "id":
          "type": "string"
        "occurredAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
        "keyVersion":
          "type": "integer"
          "minimum": 1
        "nonce":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
        "ciphertext":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
        "sourceDeviceId":
          "type":
            - "string"
            - "null"
        "receivedAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
      "additionalProperties": false
    "EncryptedEventPush":
      "type": "object"
      "required":
        - "events"
      "properties":
        "events":
          "type": "array"
          "minItems": 1
          "maxItems": 50
          "items":
            "$ref": "#/components/schemas/EncryptedEvent"
      "additionalProperties": false
    "EncryptedReaderEventPush":
      "type": "object"
      "required":
        - "events"
      "properties":
        "events":
          "type": "array"
          "minItems": 1
          "maxItems": 20
          "items":
            "$ref": "#/components/schemas/EncryptedEvent"
      "additionalProperties": false
    "SyncPushResult":
      "type": "object"
      "required":
        - "accepted"
        - "inserted"
        - "duplicates"
        - "conflicts"
      "properties":
        "accepted":
          "type": "integer"
          "minimum": 0
        "inserted":
          "type": "integer"
          "minimum": 0
        "duplicates":
          "type": "integer"
          "minimum": 0
        "conflicts":
          "type": "array"
          "items":
            "type": "string"
      "additionalProperties": false
    "SyncPage":
      "type": "object"
      "required":
        - "events"
        - "nextCursor"
        - "hasMore"
      "properties":
        "events":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/EncryptedEvent"
        "nextCursor":
          "type": "integer"
          "minimum": 0
        "hasMore":
          "type": "boolean"
      "additionalProperties": false
    "ProgressSnapshot":
      "type": "object"
      "required":
        - "knownWordCount"
        - "reviewsCompleted"
        - "reviewsDue"
        - "lessonsCompleted"
        - "lessonsTotal"
      "properties":
        "knownWordCount":
          "type": "integer"
          "minimum": 0
        "reviewsCompleted":
          "type": "integer"
          "minimum": 0
        "reviewsDue":
          "type": "integer"
          "minimum": 0
        "lessonsCompleted":
          "type": "integer"
          "minimum": 0
        "lessonsTotal":
          "type": "integer"
          "minimum": 0
      "additionalProperties": false
    "ProgressSyncRequest":
      "type": "object"
      "required":
        - "mutationId"
        - "progress"
        - "studyDays"
      "properties":
        "mutationId":
          "type": "string"
          "minLength": 8
          "maxLength": 80
        "progress":
          "$ref": "#/components/schemas/ProgressSnapshot"
        "studyDays":
          "type": "array"
          "maxItems": 366
          "items":
            "type": "string"
            "format": "date"
      "additionalProperties": false
    "ProgressSyncResult":
      "type": "object"
      "required":
        - "merged"
      "properties":
        "merged":
          "type": "boolean"
      "additionalProperties": false
    "AnswerCheckRequest":
      "type": "object"
      "required":
        - "contractVersion"
        - "taskContext"
        - "learnerResponse"
        - "allowedRubric"
        - "allowedEvidence"
      "properties":
        "contractVersion":
          "type": "string"
          "const": "answer-check.v1"
        "taskContext":
          "type": "object"
          "required":
            - "taskId"
            - "skill"
            - "learningGoal"
            - "instruction"
          "properties":
            "taskId":
              "type": "string"
              "maxLength": 128
            "skill":
              "type": "string"
              "enum":
                - "recognition"
                - "reading"
                - "listening"
                - "speaking"
                - "writing"
                - "grammar"
                - "vocabulary"
                - "kanji"
            "learningGoal":
              "type": "string"
              "maxLength": 240
            "instruction":
              "type": "string"
              "maxLength": 1000
          "additionalProperties": false
        "learnerResponse":
          "type": "object"
          "required":
            - "kind"
            - "value"
          "properties":
            "kind":
              "type": "string"
              "enum":
                - "text"
                - "choice"
                - "boolean"
                - "number"
                - "tokens"
            "value":
              "oneOf":
                -
                  "type": "string"
                -
                  "type": "number"
                -
                  "type": "boolean"
                -
                  "type": "array"
                  "items":
                    "type": "string"
          "additionalProperties": false
        "allowedRubric":
          "type": "object"
          "required":
            - "criteria"
          "properties":
            "criteria":
              "type": "array"
              "minItems": 1
              "maxItems": 8
              "items":
                "type": "object"
                "required":
                  - "id"
                  - "label"
                "properties":
                  "id":
                    "type": "string"
                    "maxLength": 64
                  "label":
                    "type": "string"
                    "maxLength": 240
                "additionalProperties": false
          "additionalProperties": false
        "allowedEvidence":
          "type": "array"
          "maxItems": 16
          "items":
            "type": "object"
            "required":
              - "id"
              - "kind"
              - "description"
            "properties":
              "id":
                "type": "string"
                "maxLength": 64
              "kind":
                "type": "string"
                "enum":
                  - "observation"
                  - "interaction"
                  - "source_context"
              "description":
                "type": "string"
                "maxLength": 240
            "additionalProperties": false
      "additionalProperties": false
    "AnswerCheckResponse":
      "type": "object"
      "required":
        - "contractVersion"
        - "status"
        - "verdict"
        - "uncertainty"
        - "suggestedRepair"
      "properties":
        "contractVersion":
          "type": "string"
          "const": "answer-check.v1"
        "status":
          "type": "string"
          "const": "complete"
        "verdict":
          "type": "object"
          "required":
            - "outcome"
            - "criteria"
          "properties":
            "outcome":
              "type": "string"
              "enum":
                - "correct"
                - "partially_correct"
                - "incorrect"
                - "uncertain"
            "criteria":
              "type": "array"
              "items":
                "type": "object"
                "required":
                  - "criterionId"
                  - "outcome"
                "properties":
                  "criterionId":
                    "type": "string"
                  "outcome":
                    "type": "string"
                    "enum":
                      - "met"
                      - "partially_met"
                      - "not_met"
                      - "uncertain"
                "additionalProperties": false
          "additionalProperties": false
        "uncertainty":
          "type": "object"
          "required":
            - "level"
            - "reason"
          "properties":
            "level":
              "type": "string"
              "enum":
                - "low"
                - "medium"
                - "high"
            "reason":
              "type": "string"
              "enum":
                - "none"
                - "ambiguous_response"
                - "insufficient_evidence"
                - "provider_limits"
          "additionalProperties": false
        "suggestedRepair":
          "oneOf":
            -
              "type": "null"
            -
              "type": "object"
              "required":
                - "kind"
                - "criterionId"
              "properties":
                "kind":
                  "type": "string"
                  "enum":
                    - "retry"
                    - "review_criterion"
