name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.3.0
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yomu
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout UserScript Compiler
        uses: actions/checkout@v6
        with:
          repository: HRussellZFAC023/UserScript-Compiler
          path: UserScript-Compiler

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            UserScript-Compiler/package-lock.json
      - name: Install compiler dependencies
        working-directory: UserScript-Compiler
        run: npm ci
      - name: Install Yomu dependencies
        run: npm ci
      - run: npm run check
      - name: Build extension release packages
        env:
          USERSCRIPT_COMPILER_CLI: UserScript-Compiler/src/cli.mjs
        run: npm run build:extension
      - name: Package Safari Web Extension
        run: |
          cd dist/extension/release/safari
          zip -qr yomu-reader-safari-web-extension.zip yomu-reader-safari-web-extension
      - name: Restore split userscript release artifact
        run: npm run build:userscript
      - name: Prepare release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const match = changelog.match(new RegExp(`## \\[${version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\][\\s\\S]*?(?=\\n## \\[|$)`));
          const notes = (match?.[0] ?? `## ${version}\n\nSee CHANGELOG.md for details.`)
            + '\n\nInstall/update userscript: https://raw.githubusercontent.com/HRussellZFAC023/yomu-reader/main/dist/yomu.user.js\n'
            + '\nRelease assets include the compiled userscript, Chrome extension ZIP, Firefox XPI, Safari Web Extension ZIP, the full compiler project bundle, and one submission guide with review/audit notes.\n';
          fs.writeFileSync('release-notes.md', notes);
          NODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            dist/yomu.user.js \
            dist/extension/release/chrome/yomu-reader-chrome.zip \
            dist/extension/release/firefox/yomu-reader-firefox.xpi \
            dist/extension/release/safari/yomu-reader-safari-web-extension.zip \
            dist/extension/yomu-reader-extension-project.zip \
            dist/extension/review/submission-guide.md \
            --title "$TAG" --notes-file release-notes.md --latest --verify-tag
