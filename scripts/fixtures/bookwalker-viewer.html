<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookWalker viewer (synthetic fixture)</title>
<style>
  html,body { margin:0; background:#111; height:100%; }
  #bookContainer { display:flex; justify-content:center; padding:8px; }
  #wideScreen0 { position:relative; }
  canvas.default { display:block; width:min(94vw, 760px); height:auto; background:#fff; }
  #toolbar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px; justify-content:center;
    padding:8px; color:#fff; background:rgba(0,0,0,.5); font-family:sans-serif; }
</style></head>
<body>
<!-- Mirrors the real BookWalker browser viewer contract: a #pageSliderCounter and
     <canvas class="default"> page surfaces inside #wideScreenN containers. -->
<div id="bookContainer">
  <div id="wideScreen0"><canvas class="default" width="800" height="1130"></canvas></div>
</div>
<div id="toolbar">
  <button id="prev">◀ prev</button>
  <span>Page <span id="pageSliderCounter">1 / 3</span></span>
  <button id="next">next ▶</button>
</div>
<script>
  // Each "page" is Japanese text painted onto the canvas — no DOM text at all,
  // exactly like BookWalker. Page 1 deliberately contains 事 (Canna's example).
  const PAGES = [
    ['第一話　執事の仕事', '今日の出来事を report します。', '「かしこまりました、お嬢様」'],
    ['第二話　黒い紅茶', 'これは大変な事になりました。', 'シエルは静かに頷いた。'],
    ['第三話　約束', 'すべては契約のため。', '物語はまだ続く。'],
  ];
  const counter = document.getElementById('pageSliderCounter');
  const canvas = document.querySelector('canvas.default');
  let page = 0;
  // Paint the page the way the real NFBR engine does: build the page bitmap in an
  // offscreen canvas, then composite it onto the visible surface with drawImage in
  // TILES. The previous fixture used ctx.fillText and made ZERO drawImage calls, so
  // a recorder that hooks drawImage recorded nothing from it — which is exactly why
  // this fixture could never fail while the real viewer was broken.
  const TILE = 64;
  function renderPageBitmap(index) {
    const src = document.createElement('canvas');
    src.width = canvas.width;
    src.height = canvas.height;
    const sctx = src.getContext('2d');
    sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, src.width, src.height);
    sctx.fillStyle = '#111';
    sctx.font = '44px "Hiragino Sans", "Noto Sans JP", sans-serif';
    sctx.textBaseline = 'top';
    PAGES[index].forEach((line, i) => sctx.fillText(line, 60, 120 + i * 90));
    return src;
  }
  function draw() {
    const ctx = canvas.getContext('2d');
    const src = renderPageBitmap(page);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Tile the composite so the recorder sees many drawImage ops per page turn,
    // like the real engine (which issues thousands).
    for (let y = 0; y < canvas.height; y += TILE) {
      for (let x = 0; x < canvas.width; x += TILE) {
        const w = Math.min(TILE, canvas.width - x);
        const h = Math.min(TILE, canvas.height - y);
        ctx.drawImage(src, x, y, w, h, x, y, w, h);
      }
    }
    counter.textContent = `${page + 1} / ${PAGES.length}`;
  }
  draw();
</script>
</body></html>
