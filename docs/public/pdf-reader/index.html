<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yomu PDF</title>
  <link rel="canonical" href="https://yomureader.com/pdf-reader/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="よむ">
  <meta property="og:title" content="Yomu PDF Reader">
  <meta property="og:description" content="Read any PDF with よむ popup lookup, mining and OCR.">
  <meta property="og:url" content="https://yomureader.com/pdf-reader/">
  <meta property="og:image" content="https://yomureader.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://yomureader.com/og-image.png">
  <link rel="icon" type="image/svg+xml" href="../yomu-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="よむ">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Read any PDF with よむ popup lookup, mining and OCR.">
  <script>
    /* Prime the page theme before paint so dark readers do not flash white. */
    (() => {
      try {
        const settings = JSON.parse(localStorage.getItem('jpdb-popup-reader-settings') || '{}');
        const stored = (settings && settings.theme) || localStorage.getItem('yomu-page-theme');
        const pref = stored === 'dark' || stored === 'light' || stored === 'auto' ? stored : 'auto';
        const theme = pref === 'auto'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        document.documentElement.classList.toggle('yomu-page-theme-dark', theme === 'dark');
        document.documentElement.classList.toggle('yomu-page-theme-light', theme === 'light');
      } catch {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --accent-soft: rgba(108,201,142,.2);
      --shadow: rgba(0,0,0,.32);
      --switch-shadow: rgba(0,0,0,.28);
      --brand-icon-bg: #f7fbf8;
      --stage-bg: #050708;
      --page-bg: #ffffff;
      --stage-empty-text: rgba(245,247,246,.72);
      --stage-empty-shadow: rgba(0,0,0,.72);
      --stage-empty-strong: #f5f7f6;
      --radius: 8px;
    }

    :root.yomu-page-theme-light {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #171a1f;
      --muted: #596272;
      --panel: #f7f8fa;
      --line: rgba(20,30,45,.16);
      --soft-line: rgba(20,30,45,.08);
      --accent: #3f805e;
      --accent-ink: #ffffff;
      --accent-soft: rgba(94,167,128,.16);
      --shadow: rgba(20,30,45,.12);
      --stage-bg: #e7eaee;
      --stage-empty-text: rgba(23,26,31,.72);
      --stage-empty-shadow: rgba(255,255,255,.6);
      --stage-empty-strong: #171a1f;
    }

    :root.yomu-page-theme-dark {
      color-scheme: dark;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --accent-soft: rgba(108,201,142,.2);
      --shadow: rgba(0,0,0,.32);
      --stage-bg: #050708;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--stage-bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .file-button,
    .toolbar-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 760;
    }

    button:hover,
    button:focus-visible,
    .file-button:hover,
    .file-button:focus-visible,
    .file-button:has(input[type="file"]:focus-visible) {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button[disabled] {
      opacity: .45;
      cursor: default;
    }

    .file-button {
      display: inline-grid;
      place-items: center;
      justify-items: center;
      padding: 0 14px;
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-ink);
      text-align: center;
    }

    .file-button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      line-height: 1.1;
    }

    .toolbar-button {
      display: inline-grid;
      place-items: center;
      padding: 0 12px;
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .overflow-menu { position: relative; }
    .overflow-menu > summary { list-style: none; }
    .overflow-menu > summary::-webkit-details-marker { display: none; }

    .overflow-summary {
      display: grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      height: 38px;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .hamburger-icon {
      width: 18px;
      height: 14px;
      background:
        linear-gradient(currentColor, currentColor) 0 0 / 18px 2px no-repeat,
        linear-gradient(currentColor, currentColor) 0 6px / 18px 2px no-repeat,
        linear-gradient(currentColor, currentColor) 0 12px / 18px 2px no-repeat;
    }

    .overflow-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 40;
      display: grid;
      gap: 2px;
      min-width: 172px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 14px 36px var(--shadow);
    }

    .overflow-menu:not([open]) .overflow-panel { display: none; }

    .overflow-panel a,
    .overflow-panel button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 720;
      line-height: 1.2;
      text-align: left;
      text-decoration: none;
    }

    .overflow-panel a:hover,
    .overflow-panel a:focus-visible,
    .overflow-panel button:hover,
    .overflow-panel button:focus-visible,
    .overflow-summary:hover,
    .overflow-summary:focus-visible {
      background: var(--accent-soft);
      color: var(--ink);
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .VPNavBarAppearance.appearance {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      min-width: 48px;
      height: 38px;
    }

    .language-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 680;
      line-height: 1;
      cursor: pointer;
    }

    .language-button:hover,
    .language-button:focus-visible {
      background: var(--panel);
      border-color: var(--line);
      color: var(--ink);
    }

    .VPSwitch.VPSwitchAppearance {
      position: relative;
      display: block;
      width: 40px;
      min-width: 40px;
      height: 24px;
      min-height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .VPSwitch .check {
      position: absolute;
      top: 1px;
      left: 1px;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--bg);
      box-shadow: 0 1px 3px var(--switch-shadow);
      transition: transform .18s ease, background .18s ease;
    }

    .VPSwitch[aria-checked="true"] .check { transform: translateX(18px); }

    .VPSwitch .icon {
      position: relative;
      display: block;
      width: 14px;
      height: 14px;
      color: var(--muted);
    }

    .VPSwitch .sun,
    .VPSwitch .moon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      transition: opacity .18s ease;
    }

    .VPSwitch .sun::before { content: "☀"; }
    .VPSwitch .moon::before { content: "☾"; }
    .VPSwitch[aria-checked="false"] .sun,
    .VPSwitch[aria-checked="true"] .moon { opacity: 0; }
    .VPSwitch[aria-checked="true"] .sun,
    .VPSwitch[aria-checked="false"] .moon { opacity: 1; }

    @media (pointer: coarse) {
      .brand,
      button,
      .file-button,
      .toolbar-button,
      .overflow-summary,
      .overflow-panel a,
      .overflow-panel button,
      .language-button,
      .VPNavBarAppearance.appearance,
      .page-input {
        min-height: 44px;
      }

      .overflow-summary,
      .language-button {
        width: 44px;
        min-width: 44px;
        height: 44px;
      }

      .VPSwitch.VPSwitchAppearance,
      .toolbar-button.icon-button {
        width: 44px;
        min-width: 44px;
        height: 44px;
        min-height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Sticky chrome: the brand bar and document toolbar stay pinned while the
       page itself scrolls natively (mouse wheel / trackpad / keyboard just work,
       no inner scroll container to fight). */
    .chrome {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 48px;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        12px
        max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--soft-line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--brand-icon-bg);
    }

    /* Document toolbar: page navigation + zoom. Hidden until a PDF is open. */
    .docbar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--soft-line);
    }

    .app:not(.has-pdf) .docbar { display: none; }

    .docbar-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      padding: 0;
    }

    .page-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-weight: 720;
      font-size: 14px;
    }

    .page-input {
      width: 3.4em;
      min-height: 34px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      text-align: center;
      font-weight: 720;
    }

    .page-total { color: var(--muted); }

    .zoom-level {
      min-width: 4ch;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    /* Scroll container for the rendered pages. */
    .viewer {
      position: relative;
      min-width: 0;
      background: var(--stage-bg);
      padding: 18px 12px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pdf-page {
      position: relative;
      flex: 0 0 auto;
      width: 0;
      height: 0;
      max-width: 100%;
      background: var(--page-bg);
      border-radius: 2px;
      box-shadow: 0 10px 30px var(--shadow);
    }

    .pdf-page canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 2px;
    }

    .pdf-page.scanned::after {
      content: attr(data-scanned-label);
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 5;
      padding: 3px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }

    .empty {
      width: auto;
      position: relative;
      margin: 18px;
      min-height: calc(100dvh - 100px);
      display: grid;
      place-items: center;
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: var(--stage-bg);
      color: var(--stage-empty-text);
      text-align: center;
      text-shadow: 0 1px 2px var(--stage-empty-shadow);
      cursor: pointer;
      padding: 28px;
    }

    .app.has-pdf .empty { display: none; }
    .app.has-pdf .viewer { display: flex; }
    .app:not(.has-pdf) .viewer { display: none; }

    .empty > div {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: min(100%, 480px);
    }

    .empty strong {
      display: block;
      color: var(--stage-empty-strong);
      font-size: clamp(18px, 4.8vw, 24px);
      line-height: 1.15;
    }

    .status {
      display: block;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .drop-active .viewer,
    .drop-active .empty { border-color: var(--accent); }
    .drop-active .empty { outline: 2px solid var(--accent); outline-offset: -8px; }

    /* PDF.js text layer — sits over the canvas, transparent and selectable, so
       the よむ runtime can scan, look up, mine and add furigana to real text.
       Copied from pdfjs-dist web/pdf_viewer.css (Apache-2.0) and flattened. */
    .textLayer {
      position: absolute;
      text-align: initial;
      inset: 0;
      overflow: clip;
      opacity: 1;
      line-height: 1;
      letter-spacing: normal;
      word-spacing: normal;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      caret-color: CanvasText;
      z-index: 2;
      --total-scale-factor: 1;
      --scale-factor: 1;
      --min-font-size: 1;
      --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size));
    }

    .textLayer span,
    .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      user-select: text;
    }

    .textLayer > :not(.markedContent),
    .textLayer .markedContent span:not(.markedContent) {
      z-index: 1;
      --font-height: 0;
      font-size: calc(var(--text-scale-factor) * var(--font-height));
      --scale-x: 1;
      --rotate: 0deg;
      transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
    }

    .textLayer .markedContent { display: contents; }

    .textLayer span[role="img"] {
      user-select: none;
      cursor: default;
    }

    .textLayer ::selection { background: rgba(108,201,142,.32); }
    .textLayer .endOfContent {
      display: block;
      position: absolute;
      inset: 100% 0 0;
      z-index: 0;
      cursor: default;
      user-select: none;
    }
    .textLayer.selecting .endOfContent { top: 0; }

    /* The runtime adds furigana ruby inside the transparent text layer. Keep the
       reading line (base) invisible so the canvas glyph shows through, but let
       the furigana itself render in the accent ink just above the kanji. */
    .textLayer ruby > rt.jpdb-reader-furi {
      color: var(--accent);
      text-shadow: 0 1px 2px var(--stage-empty-shadow);
    }

    @media (max-width: 640px) {
      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto;
        align-items: center;
        gap: 12px 10px;
      }
      .top-actions { display: contents; }
      .VPNavBarAppearance.appearance { grid-column: 2; grid-row: 1; width: 42px; min-width: 42px; justify-self: end; }
      .language-button { grid-column: 3; grid-row: 1; min-width: 54px; justify-self: end; }
      .overflow-menu { grid-column: 4; grid-row: 1; justify-self: end; }
      .file-button { grid-column: 1 / -1; grid-row: 2; width: 100%; min-height: 48px; }
      .viewer { padding: 12px 6px 40px; }
    }
  </style>
</head>
<body>
  <main class="app" data-app>
    <h1 class="sr-only" data-page-title>Yomu PDF</h1>
    <div class="chrome">
    <header class="topbar">
      <a class="brand" href="../" aria-label="Open Yomu home">
        <img src="../yomu-icon.svg" alt="" width="36" height="36" data-yomu-brand-icon>
        <strong>Yomu PDF</strong>
      </a>
      <div class="top-actions">
        <div class="VPNavBarAppearance appearance">
          <button class="VPSwitch VPSwitchAppearance" type="button" role="switch" data-theme-toggle aria-label="Switch to light theme" aria-checked="false" title="Switch to light theme">
            <span class="check">
              <span class="icon">
                <span class="vpi-sun sun" aria-hidden="true"></span>
                <span class="vpi-moon moon" aria-hidden="true"></span>
              </span>
            </span>
          </button>
        </div>
        <button class="language-button" type="button" data-language-toggle aria-label="Switch Yomu HUD to Japanese" lang="ja">あ</button>
        <details class="overflow-menu" data-overflow-menu>
          <summary class="overflow-summary" aria-label="Menu" data-overflow-summary>
            <span class="hamburger-icon" aria-hidden="true"></span>
          </summary>
          <div class="overflow-panel">
            <button type="button" data-settings-trigger>Settings</button>
            <a href="../newtab/index.html" data-menu-study>Study</a>
            <a href="../video-player/index.html" data-menu-video>Video Player</a>
            <a href="../local-audio" data-menu-local-audio>Local Audio</a>
            <a href="../support" data-menu-support>Support</a>
          </div>
        </details>
        <label class="file-button">
          <span class="file-button-label" data-open-pdf-label>Open PDF</span>
          <input type="file" accept="application/pdf,.pdf" data-pdf-input>
        </label>
      </div>
    </header>

    <nav class="docbar" aria-label="Document controls" data-docbar>
      <div class="docbar-group">
        <button class="toolbar-button icon-button" type="button" data-prev-page aria-label="Previous page" title="Previous page">‹</button>
        <span class="page-indicator">
          <input class="page-input" type="text" inputmode="numeric" value="1" data-page-input aria-label="Page number">
          <span class="page-total" data-page-total>/ 1</span>
        </span>
        <button class="toolbar-button icon-button" type="button" data-next-page aria-label="Next page" title="Next page">›</button>
      </div>
      <div class="docbar-group">
        <button class="toolbar-button icon-button" type="button" data-zoom-out aria-label="Zoom out" title="Zoom out">−</button>
        <span class="zoom-level" data-zoom-level>100%</span>
        <button class="toolbar-button icon-button" type="button" data-zoom-in aria-label="Zoom in" title="Zoom in">+</button>
        <button class="toolbar-button" type="button" data-fit-width data-fit-label>Fit width</button>
      </div>
    </nav>
    </div>

    <section class="viewer" data-viewer aria-label="PDF document"></section>

    <button class="empty" type="button" data-empty-open>
      <div>
        <strong>Open or drop a PDF</strong>
        <span class="status" data-status>Pick a PDF and read it with よむ.</span>
      </div>
    </button>
  </main>

  <script type="module">
    import * as pdfjsLib from './vendor/pdf.min.mjs';

    const VENDOR = new URL('./vendor/', import.meta.url);
    pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('pdf.worker.min.mjs', VENDOR).href;

    const app = document.querySelector('[data-app]');
    const viewer = document.querySelector('[data-viewer]');
    const pdfInput = document.querySelector('[data-pdf-input]');
    const emptyOpen = document.querySelector('[data-empty-open]');
    const status = document.querySelector('[data-status]');
    const themeToggle = document.querySelector('[data-theme-toggle]');
    const languageToggle = document.querySelector('[data-language-toggle]');
    const openPdfLabel = document.querySelector('[data-open-pdf-label]');
    const overflowMenu = document.querySelector('[data-overflow-menu]');
    const overflowSummary = document.querySelector('[data-overflow-summary]');
    const settingsTrigger = document.querySelector('[data-settings-trigger]');

        new URL(`/${fileName}`, window.location.origin),

    function buildPlaceholders() {
      const fragment = document.createDocumentFragment();

    function clampPage(number) {

    function fitWidthScale(baseViewport) {

      const available = Math.min(viewer.clientWidth - 28, MAX_FIT_WIDTH_PX);
      if (available <= 0) return 1;

    // Clamp the backing-store scale so the canvas never exceeds the engine's

    // a sane pixel budget. The page still displays at full CSS size; only the
    // raster resolution is reduced when a page would otherwise be enormous.
    function cappedRenderScale(cssScale, baseViewport) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let scale = cssScale * dpr;
      const cap = (limit, dim) => { if (dim * scale > limit) scale = limit / dim; };
      cap(MAX_CANVAS_DIM, baseViewport.width);
      cap(MAX_CANVAS_DIM, baseViewport.height);
      const area = baseViewport.width * baseViewport.height;
      if (area * scale * scale > MAX_CANVAS_PIXELS) scale = Math.sqrt(MAX_CANVAS_PIXELS / area);

      if (renderQueue.includes(number)) return;
      renderQueue.push(number);
      drainRenderQueue();

    function drainRenderQueue() {
      while (activeRenders < MAX_CONCURRENT_RENDERS && renderQueue.length) {
        // Prioritise pages closest to the one being read.
        renderQueue.sort((a, b) => Math.abs(a - currentPage) - Math.abs(b - currentPage));
        const number = renderQueue.shift();
        activeRenders += 1;
        void renderPage(number).finally(() => { activeRenders -= 1; drainRenderQueue(); });

    }

    async function renderPage(number) {

        entry.shownScale = cssScale;
        entry.baseW = baseViewport.width;
        entry.baseH = baseViewport.height;

        const cssHeight = Math.floor(baseViewport.height * cssScale);

        entry.container.style.height = `${cssHeight}px`;

        // Paint into a DETACHED canvas and swap it in only once it is ready, so the

        const renderScale = cappedRenderScale(cssScale, baseViewport);
        const renderViewport = page.getViewport({ scale: renderScale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(renderViewport.width);
        canvas.height = Math.floor(renderViewport.height);
        const context = canvas.getContext('2d', { alpha: false });
        const task = page.render({ canvasContext: context, viewport: renderViewport });
        entry.renderTask = task;
        await task.promise;
        entry.renderTask = null;
        if (epoch !== renderEpoch) { entry.status = 'idle'; return; }
        entry.canvas.replaceWith(canvas);
        entry.canvas = canvas;

        // Text layer overlays the CSS box, so it uses the (un-capped) CSS scale.
        const textViewport = page.getViewport({ scale: cssScale });
        const textLayerDiv = entry.textLayerDiv;
        textLayerDiv.replaceChildren();
        textLayerDiv.style.setProperty('--scale-factor', String(cssScale));
        textLayerDiv.style.setProperty('--total-scale-factor', String(cssScale));
        const textLayer = new pdfjsLib.TextLayer({
          textContentSource: page.streamTextContent(),
          container: textLayerDiv,
          viewport: textViewport,
        });
        await textLayer.render();
        entry.status = 'done';

        const textLength = textLayerDiv.textContent.replace(/\s+/g, '').length;
        entry.container.classList.toggle('scanned', textLength < SCANNED_TEXT_THRESHOLD);
        if (textLength < SCANNED_TEXT_THRESHOLD) maybeShowScannedNotice();
        updateZoomLabel();
        evictDistantPages(); // free bitmaps left behind by fast scrolling
      } catch (error) {
        entry.renderTask = null;
        entry.status = 'idle';
        if (error?.name === 'RenderingCancelledException') return;
        console.warn(`[yomu-pdf] failed to render page ${number}`, error);
      }
    }

    function maybeShowScannedNotice() {
      if (scannedNoticeShown) return;
      scannedNoticeShown = true;
      setStatus(text().scannedNotice);
      void ensureYomuRuntime({ silent: true });
    }

    // Free the bitmap + text layer of pages far from the reader so memory stays
    // bounded on 200+ page scanned books (the prime cause of the tab crash).
    function evictDistantPages() {
      for (const [number, entry] of pages) {
        if (Math.abs(number - currentPage) <= KEEP_WINDOW) continue;
        if (entry.status === 'idle' && !entry.canvas.width) continue;
        cancelRender(entry);
        entry.canvas.width = 0;
        entry.canvas.height = 0;
        entry.textLayerDiv.replaceChildren();
        entry.container.classList.remove('scanned');
        entry.status = 'idle';
      }
      const i = renderQueue.length;
      renderQueue.splice(0, i, ...renderQueue.filter(n => Math.abs(n - currentPage) <= KEEP_WINDOW + 1));
    }

    // Zoom / fit changed: invalidate in-flight renders, drop cached bitmaps, and
    // re-render what is on screen at the new scale.
    function rescaleAll() {
      renderEpoch += 1;
      renderQueue.length = 0;
      for (const entry of pages.values()) {
        cancelRender(entry);
        entry.status = 'idle';
        entry.textLayerDiv.replaceChildren();
        // Resize the box to the new scale up front (for pages we've measured) so
        // the scroll height stays consistent; keep the old bitmap visible (CSS-
        // scaled) until the fresh render swaps in — no black flash.
        if (entry.baseW) {
          const s = currentScale || fitWidthScale({ width: entry.baseW, height: entry.baseH });
          entry.container.style.width = `${Math.floor(entry.baseW * s)}px`;
          entry.container.style.height = `${Math.floor(entry.baseH * s)}px`;
        }
      }
      const visible = [...visibilityRatios].filter(([, ratio]) => ratio > 0).map(([number]) => number);
      for (const number of new Set([currentPage, ...visible, currentPage - 1, currentPage + 1])) requestRender(number);
    }

    /* IntersectionObserver renders pages as they approach the viewport and keeps
       the page indicator + saved reading position in sync with the scroll. */
    const pageObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        requestRender(Number(entry.target.dataset.pageNumber));
      }
    }, { root: null, rootMargin: '300px 0px' });

    const visibilityRatios = new Map();
    const visibilityObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const number = Number(entry.target.dataset.pageNumber);
        visibilityRatios.set(number, entry.isIntersecting ? entry.intersectionRatio : 0);
      }
      updateCurrentPageFromScroll();
    }, { root: null, threshold: [0, 0.25, 0.5, 0.75, 1] });

    function updateCurrentPageFromScroll() {
      let best = currentPage;
      let bestRatio = -1;
      for (const [number, ratio] of visibilityRatios) {
        if (ratio > bestRatio) { bestRatio = ratio; best = number; }
      }
      if (best !== currentPage) {
        currentPage = best;
        if (document.activeElement !== pageInput) pageInput.value = String(currentPage);
        updateNavButtons();
        updateZoomLabel();
        // Prefetch immediate neighbours.
        requestRender(currentPage - 1);
        requestRender(currentPage + 1);
      }
      // Always run — fast scrolling paints pages between currentPage changes,
      // and their off-heap canvas memory must be reclaimed to avoid an OOM crash.
      evictDistantPages();
      schedulePositionSave();
    }

    function schedulePositionSave() {
      if (positionSaveTimer) window.clearTimeout(positionSaveTimer);
      positionSaveTimer = window.setTimeout(() => {
        if (currentFileKey) localStorage.setItem(currentFileKey, String(currentPage));
      }, 400);
    }

    function updateNavButtons() {
      prevPageBtn.disabled = !pdfDoc || currentPage <= 1;
      nextPageBtn.disabled = !pdfDoc || currentPage >= pdfDoc.numPages;
    }
    function updateZoomLabel() { zoomLevel.textContent = effectiveScaleLabel(); }

    function goToPage(number, behavior = 'smooth') {
      const target = clampPage(number);
      const entry = pages.get(target);
      if (!entry) return;
      const scrollBehavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : behavior;
      currentPage = target;
      pageInput.value = String(target);
      requestRender(target);
      requestRender(target + 1);
      entry.container.scrollIntoView({ behavior: scrollBehavior, block: 'start' });
      updateNavButtons();
    }

    function setScale(nextScale) {
      const reference = pages.get(currentPage);
      const base = reference?.shownScale || 1;
      currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, nextScale ?? base));
      rescaleAll();
      updateZoomLabel();
    }

    function handleFiles(files) {
      for (const file of files) {
        if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
          void openPdf(file);
          return;
        }
      }
      setStatus(text().choosePdf);
    }

    /* ---- events ---- */
    pdfInput.addEventListener('change', () => {
      const files = Array.from(pdfInput.files || []);
      pdfInput.value = '';
      window.requestAnimationFrame(() => handleFiles(files));
    });
    emptyOpen?.addEventListener('click', () => pdfInput.click());
    themeToggle?.addEventListener('click', () => saveThemePreference(effectiveTheme() === 'dark' ? 'light' : 'dark'));
    languageToggle?.addEventListener('click', () => saveInterfaceLanguage(nextInterfaceLanguage()));
    settingsTrigger?.addEventListener('click', openSettings);
    prevPageBtn?.addEventListener('click', () => goToPage(currentPage - 1));
    nextPageBtn?.addEventListener('click', () => goToPage(currentPage + 1));
    pageInput?.addEventListener('change', () => goToPage(Number(pageInput.value)));
    pageInput?.addEventListener('keydown', (event) => { if (event.key === 'Enter') goToPage(Number(pageInput.value)); });
    zoomInBtn?.addEventListener('click', () => setScale((pages.get(currentPage)?.shownScale || 1) * 1.2));
    zoomOutBtn?.addEventListener('click', () => setScale((pages.get(currentPage)?.shownScale || 1) / 1.2));
    fitWidthBtn?.addEventListener('click', () => { currentScale = 0; rescaleAll(); updateZoomLabel(); });

    window.addEventListener(settingsChangeEvent, syncFromSettingsEvent);
    window.addEventListener('storage', (event) => {
      if (event.key === settingsKey || event.key === themeKey || event.key === null) { applyTheme(); applyAccent(); }
    });
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (themePreference() === 'auto') { applyTheme(); applyAccent(); }
    });
    brandIcon?.addEventListener('error', () => {
      brandIcon.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(fallbackIconSvg)}`;
    }, { once: true });

    for (const eventName of ['dragenter', 'dragover']) {
      document.addEventListener(eventName, (event) => { event.preventDefault(); app.classList.add('drop-active'); });
    }
    for (const eventName of ['dragleave', 'drop']) {
      document.addEventListener(eventName, (event) => {
        event.preventDefault();
        if (eventName === 'drop') handleFiles(event.dataTransfer?.files || []);
        app.classList.remove('drop-active');
      });
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      if (!pdfDoc || currentScale) return; // only fit-width tracks the viewport
      if (resizeTimer) window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => rescaleAll(), 200);
    });

    window.addEventListener('pagehide', () => {
      if (currentFileKey) localStorage.setItem(currentFileKey, String(currentPage));
    });

    applyTheme();
    applyInterfaceLanguage(effectiveInterfaceLanguage());
    updateNavButtons();
    void ensureYomuRuntime({ silent: true });
  </script>
</body>
</html>
