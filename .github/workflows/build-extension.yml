name: Build Extension Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/newtab/**
      - public/pwa-icon-*.png
      - public/yomu-icon.svg
      - public/extension-icons/**
      - docs/public/screenshots/study-pwa-*.png
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/vite/newtab.config.ts
      - scripts/build-extension.mjs
      - scripts/build-amo-source-package.mjs
      - scripts/lib/ci-utils.mjs
      - scripts/lib/extension-runtime-hardening.mjs
      - .github/workflows/build-extension.yml

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yomu
        uses: actions/checkout@v6
        with:
          path: yomu-reader

      - name: Checkout UserScript Compiler
        uses: actions/checkout@v6
        with:
          repository: HRussellZFAC023/UserScript-Compiler
          ref: 52b7fe463ae503c294421752002da568472dfe4a
          path: UserScript-Compiler

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'yomu-reader/.nvmrc'
          cache: npm
          cache-dependency-path: |
            yomu-reader/package-lock.json
            UserScript-Compiler/package-lock.json

      - name: Pin audited npm
        run: npm install --global npm@11.9.0

      - name: Install compiler dependencies
        working-directory: UserScript-Compiler
        run: npm ci

      - name: Install Yomu dependencies
        working-directory: yomu-reader
        run: npm ci

      - name: Build extension packages
        working-directory: yomu-reader
        env:
          USERSCRIPT_COMPILER_CLI: ../UserScript-Compiler/src/cli.mjs
        run: npm run build:extension

      - name: Package Safari Web Extension
        working-directory: yomu-reader
        run: |
          cd dist/extension/release/safari
          zip -qr yomureader.com-safari-web-extension.zip yomureader.com-safari-web-extension

      - name: Upload extension packages
        uses: actions/upload-artifact@v5
        with:
          name: yomu-extension-packages
          path: yomu-reader/dist/extension
