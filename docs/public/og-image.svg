<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">よむ social preview</title>
  <desc id="desc">よむ app icon with the text Language-learning popup reader.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" x2="1200" y1="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121820" />
      <stop offset="0.58" stop-color="#17251f" />
      <stop offset="1" stop-color="#0f171c" />
