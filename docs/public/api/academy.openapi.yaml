          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AccountPatch"
      "x-yomu-same-origin": true
    "delete":
      "operationId": "deleteAcademyAccount"
      "tags":
        - "Account"
      "summary": "Delete the account"
      "description": "Permanently deletes the signed-in account and returns a deletion receipt."
      "security":
