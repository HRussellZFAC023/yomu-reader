name: Nightly smokes

# Extended regression coverage outside the local gate and release preflight.
# Required layout hosts also stay in PR CI. Built products run on recorded
# pages and labelled mechanism fixtures, nightly and on demand.

on:
  schedule:
    # 03:17 UTC daily — off the hour to avoid the top-of-hour scheduler surge.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      smokes:
        description: 'Optional smoke script names, separated by spaces. Empty runs the complete suite.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  nightly-smokes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      YOMU_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install smoke browsers
        uses: ./.github/actions/playwright-browsers
      - name: Build userscript + sync docs
        run: |
          npm run build
          node scripts/sync-docs-userscript.cjs
      - name: Build docs for the localization smoke
        run: npm run docs:build
      - name: Run nightly smokes
        env:
          NIGHTLY_SMOKE_NAMES: ${{ inputs.smokes || '' }}
        run: |
          mkdir -p artifacts
          ./node_modules/.bin/vitepress preview docs --host 127.0.0.1 --port 4199 >artifacts/nightly-docs-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4199/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4199/ >/dev/null
          read -r -a requested_smokes <<< "$NIGHTLY_SMOKE_NAMES"
          npm run smoke:nightly -- "${requested_smokes[@]}"
      - name: Upload typography failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-typography-diagnostics
          path: qa-artifacts/yomu-reader/annotation-typography/report.json
          if-no-files-found: ignore
          retention-days: 7
