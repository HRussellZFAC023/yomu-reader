name = "yomu-jpdb-public-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-29"
workers_dev = true
preview_urls = true

# Cloudflare's own record of the running version, reported by /healthz so a
# deploy can be identified without an API call.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[routes]]
pattern = "edge.yomureader.com"
custom_domain = true

[vars]
PUBLIC_PROXY_DISABLED = "false"
PUBLIC_PROXY_DAILY_REQUEST_LIMIT = "100000"
PUBLIC_PROXY_ANALYTICS_LOGS = "false"

[observability]
enabled = true
