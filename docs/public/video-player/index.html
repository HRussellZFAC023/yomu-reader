  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --accent-soft: rgba(108,201,142,.2);
      --shadow: rgba(0,0,0,.32);
      --switch-shadow: rgba(0,0,0,.28);
      --brand-icon-bg: #f7fbf8;
      --stage-bg: #050708;
      --stage-empty-text: rgba(245,247,246,.72);
      --stage-empty-shadow: rgba(0,0,0,.72);
      --stage-empty-strong: #f5f7f6;
      --radius: 8px;
    }

    :root.yomu-page-theme-light {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #171a1f;
      --muted: #596272;
      --panel: #f7f8fa;
      --line: rgba(20,30,45,.16);
      --soft-line: rgba(20,30,45,.08);
      --accent: #3f805e;
      --accent-ink: #ffffff;
      --accent-soft: rgba(94,167,128,.16);
      --shadow: rgba(20,30,45,.12);
    }

    :root.yomu-page-theme-dark {
      color-scheme: dark;
      --bg: #101316;
      --ink: #f5f7f6;
      --muted: #9aa3a3;
      --panel: #181d21;
      --line: rgba(255,255,255,.14);
      --soft-line: rgba(255,255,255,.08);
      --accent: #6cc98e;
      --accent-ink: #0b1710;
      --accent-soft: rgba(108,201,142,.2);
      --shadow: rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .file-button,
    .toolbar-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 760;
    }

    button:hover,
    button:focus-visible,
    .file-button:hover,
    .file-button:focus-visible,
    .file-button:has(input[type="file"]:focus-visible) {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .file-button {
      display: inline-grid;
      place-items: center;
      justify-items: center;
      padding: 0 14px;
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-ink);
      text-align: center;
    }

    .file-button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      line-height: 1.1;
    }

    .toolbar-button {
      display: inline-grid;
      place-items: center;
      padding: 0 12px;
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: center;
    }

    a.toolbar-button {
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .overflow-menu {
      position: relative;
    }

    .overflow-menu > summary {
      list-style: none;
    }

    .overflow-menu > summary::-webkit-details-marker {
      display: none;
    }

    .overflow-summary {
      display: grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      height: 38px;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .more-icon {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: currentColor;
    }

    .more-icon::before {
      content: "...";
      padding-bottom: 4px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .overflow-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 40;
      display: grid;
      gap: 2px;
      min-width: 190px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 14px 36px var(--shadow);
    }

    .overflow-menu:not([open]) .overflow-panel {
      display: none;
    }

    .overflow-divider {
      width: 100%;
      margin: 4px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .overflow-panel a,
    .overflow-panel button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.2;
      text-align: left;
      text-decoration: none;
    }

    .overflow-panel a:hover,
    .overflow-panel a:focus-visible,
    .overflow-panel button:hover,
    .overflow-panel button:focus-visible,
    .overflow-summary:hover,
    .overflow-summary:focus-visible {
      background: var(--accent-soft);
      color: var(--ink);
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .VPNavBarAppearance.appearance {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      min-width: 48px;
      height: 38px;
    }

    .language-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 680;
      line-height: 1;
      cursor: pointer;
    }

    .language-button:hover,
    .language-button:focus-visible {
      background: var(--panel);
      border-color: var(--line);
      color: var(--ink);
    }

    .VPSwitch.VPSwitchAppearance {
      position: relative;
      display: block;
      width: 40px;
      min-width: 40px;
      height: 24px;
      min-height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .VPSwitch .check {
      position: absolute;
      top: 1px;
      left: 1px;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--bg);
      box-shadow: 0 1px 3px var(--switch-shadow);
      transition: transform .18s ease, background .18s ease;
    }

    .VPSwitch[aria-checked="true"] .check {
      transform: translateX(18px);
    }

    .VPSwitch .icon {
      position: relative;
      display: block;
      width: 14px;
      height: 14px;
      color: var(--muted);
    }

    .VPSwitch .sun,
    .VPSwitch .moon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      transition: opacity .18s ease;
    }

    /* Invisible enlarged tap area; the switch itself must stay a slim pill on
       every pointer type (a 44px visual blob breaks the shared nav look). */
    .VPSwitch.VPSwitchAppearance::after {
      content: "";
      position: absolute;
      inset: -11px -5px;
    }

    .VPSwitch .sun::before { content: "☀"; }
    .VPSwitch .moon::before { content: "☾"; }
    .VPSwitch[aria-checked="false"] .sun,
    .VPSwitch[aria-checked="true"] .moon { opacity: 0; }
    .VPSwitch[aria-checked="true"] .sun,
    .VPSwitch[aria-checked="false"] .moon { opacity: 1; }

    @media (pointer: coarse) {
      .brand,
      button,
      .file-button,
      .toolbar-button,
      .overflow-summary,
      .overflow-panel a,
      .overflow-panel button,
      .language-button,
      .VPNavBarAppearance.appearance {
        min-height: 44px;
      }

      .overflow-summary,
      .language-button {
        width: 44px;
        min-width: 44px;
        height: 44px;
      }

      /* The generic 44px button floor above must not fatten the theme switch;
         its ::after overlay already provides the 44px touch target. */
      .VPSwitch.VPSwitchAppearance {
        width: 40px;
        min-width: 40px;
        height: 24px;
        min-height: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      align-content: stretch;
      gap: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 48px;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        12px
        max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--soft-line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--brand-icon-bg);
    }

    /* Fills the area below the nav and establishes the sizing context for the
       aspect-locked stage. cqw/cqh below resolve against this box. */
    .stage-area {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      /* Centre horizontally, anchor to the top: the video sits just under the
         nav and the space below/beside it is reserved for the subtitle drawer. */
      place-items: start center;
      overflow: hidden;
      background: var(--bg);
      container-type: size;
    }

    /* The video frame: the largest box of the current video's aspect ratio that
       fits inside .stage-area, centred. --aspect (width / height) is updated from
       the loaded video; it defaults to 16:9 for the empty / loading state. The
       subtitle overlay and drawer-inset both anchor to this box, so keeping it on
       the real video aspect keeps subtitles aligned to the picture. */
    .stage {
      --aspect: 1.7777778;
      position: relative;
      width: min(100cqw, calc(100cqh * var(--aspect)));
      height: min(100cqh, calc(100cqw / var(--aspect)));
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--stage-bg);
      box-shadow: 0 18px 46px var(--shadow);
    }

    video {
      width: 100%;
      max-width: 100%;
      height: 100%;
      display: block;
      background: var(--stage-bg);
      object-fit: contain;
    }

    .stage:not(.has-video) video {
      visibility: hidden;
    }

    .stage-fullscreen {
      position: absolute;
      top: 12px;
      /* Top-right: the subtitle control rail's default (and its collapsed
         grip) lives top-left; at top-left this button stacked above the grip
         and swallowed its taps. */
      right: 12px;
      z-index: 2147483646;
      width: 40px;
      height: 40px;
      display: none;
      place-items: center;
      border: 1px solid color-mix(in srgb, white 22%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, #111820 70%, transparent);
      color: white;
      box-shadow: 0 12px 28px color-mix(in srgb, black 34%, transparent);
      cursor: pointer;
      opacity: .86;
      transition: opacity .16s ease, transform .16s ease, background .16s ease;
    }

    .stage.has-video .stage-fullscreen {
      display: grid;
    }

    .stage-fullscreen:hover,
    .stage-fullscreen:focus-visible {
      opacity: 1;
      transform: translateY(-1px);
      background: color-mix(in srgb, #111820 86%, transparent);
    }

    .stage-fullscreen:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stage-fullscreen svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    .stage[data-fullscreen-active="true"] .stage-fullscreen .enter-icon,
    .stage:not([data-fullscreen-active="true"]) .stage-fullscreen .exit-icon {
      display: none;
    }

    .stage:fullscreen,
    .stage:-webkit-full-screen,
    .stage[data-yomu-inline-fullscreen="true"] {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: #000 !important;
    }

    .stage:fullscreen video,
    .stage:-webkit-full-screen video,
    .stage[data-yomu-inline-fullscreen="true"] video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }

    html.jpdb-subtitle-inline-fullscreen,
    html.jpdb-subtitle-inline-fullscreen body {
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }

    .stage[data-yomu-inline-fullscreen="true"] {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483640 !important;
    }

    /* When the subtitle transcript drawer docks to a side, the Yomu runtime pins
       the frame to its full (un-docked) height and centres the letterboxed video
       inside it — leaving big bars and pushing the subtitle overlay (which is
       anchored to the frame) below the picture. Re-fit the frame to the video
       aspect at the docked width so the picture fills the frame and the overlay
       stays on it. Author !important overrides the runtime's non-important inline
       sizing; the classes are removed when the drawer closes, restoring the base
       layout. The bottom-dock path already aspect-fits, so it is left untouched. */
    :root:is(.jpdb-subtitle-video-inset-left, .jpdb-subtitle-video-inset-right) [data-yomu-video-frame] {
      aspect-ratio: var(--aspect) !important;
      height: auto !important;
      max-height: 100% !important;
      min-height: 0 !important;
    }

    :root:is(.jpdb-subtitle-video-inset-left, .jpdb-subtitle-video-inset-right) [data-yomu-video-frame] video {
      height: 100% !important;
      max-height: 100% !important;
      min-height: 0 !important;
    }

    /* Defensive reset for drawer transitions: if the subtitle drawer closes after
       the runtime has written generic inset widths, the hosted frame must reclaim
       the full stage-area width so the native video timeline reaches the player
       edge again. Root inset classes are present only while a drawer is actively
       reserving space, so this does not fight the side/bottom docked layouts. */
    :root:not(.jpdb-subtitle-video-inset-left):not(.jpdb-subtitle-video-inset-right):not(.jpdb-subtitle-video-inset-bottom) [data-yomu-video-frame] {
      width: min(100cqw, calc(100cqh * var(--aspect))) !important;
      height: min(100cqh, calc(100cqw / var(--aspect))) !important;
      max-width: 100% !important;
      max-height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;

        return value === 'dark' || value === 'light' || value === 'auto' ? value : 'auto';

        const settings = readSettings();
        if (Object.prototype.hasOwnProperty.call(settings, 'theme')) return normalizeTheme(settings.theme);
        return normalizeTheme(localStorage.getItem(themeKey));
      }

      function effectiveTheme(preference = themePreference()) {
        if (preference === 'dark' || preference === 'light') return preference;
        return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }

      function applyTheme(preference = themePreference()) {
        const theme = effectiveTheme(preference);
        document.documentElement.classList.toggle('yomu-page-theme-dark', theme === 'dark');
        document.documentElement.classList.toggle('yomu-page-theme-light', theme === 'light');
        if (themeToggle) {

        const settings = readSettings();
        stampNeutralHostedTarget(settings);
        settings.theme = theme;
        localStorage.setItem(settingsKey, JSON.stringify(settings));
        localStorage.setItem(themeKey, theme);
        window.dispatchEvent(new CustomEvent(settingsChangeEvent, { detail: { settings: { theme } } }));
        applyTheme(theme);
        applyAccent();

        const theme = event?.detail?.settings?.theme;
        return theme === 'dark' || theme === 'light' || theme === 'auto' ? theme : null;

      function syncFromSettingsEvent(event) {
        const theme = themePreferenceFromEvent(event);
        if (theme) {
          if (event?.detail?.preview !== true) {
            if (theme === 'auto') localStorage.removeItem(themeKey);
            else localStorage.setItem(themeKey, theme);
          }
          applyTheme(theme);
        } else {
          applyTheme();
        }
        applyAccent();

      applyTheme();
      applyInterfaceLanguage(effectiveInterfaceLanguage());

      function setStatus(message) {
        status.textContent = message;
      }

      function readSettings() {
        try {
          const settings = JSON.parse(localStorage.getItem(settingsKey) || '{}');
          return settings && typeof settings === 'object' && !Array.isArray(settings) ? settings : {};
        } catch {
          return {};
        }
      }

      function applyAccent() {
        const accent = sanitizeAccent(readSettings().accentColor);
        const accentInk = readableTextOn(accent);
        const accentSoft = hexToRgba(accent, effectiveTheme() === 'dark' ? 0.22 : 0.16);
        document.documentElement.style.setProperty('--accent', accent);
        document.documentElement.style.setProperty('--accent-ink', accentInk);
        document.documentElement.style.setProperty('--accent-soft', accentSoft);
        document.documentElement.style.setProperty('--jpdb-reader-accent', accent);
        document.documentElement.style.setProperty('--jpdb-reader-accent-text', accentInk);
        document.documentElement.style.setProperty('--jpdb-reader-accent-soft', accentSoft);

      function sanitizeAccent(value) {
        if (typeof value !== 'string') return colorTokens.accent;
        const trimmed = value.trim();
        if (/^#[0-9a-f]{6}$/i.test(trimmed)) return trimmed.toLowerCase();
        const shortHex = /^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.exec(trimmed);
        return shortHex ? `#${shortHex[1]}${shortHex[1]}${shortHex[2]}${shortHex[2]}${shortHex[3]}${shortHex[3]}`.toLowerCase() : colorTokens.accent;
      }

      function readableTextOn(background) {
        return contrastRatio(background, colorTokens.readableInk) >= contrastRatio(background, colorTokens.white)
          ? colorTokens.readableInk
          : colorTokens.white;

      function contrastRatio(a, b) {
        const l1 = relativeLuminance(a);
        const l2 = relativeLuminance(b);
        const light = Math.max(l1, l2);
        const dark = Math.min(l1, l2);
        return (light + 0.05) / (dark + 0.05);

      function relativeLuminance(color) {
        return hexToRgb(color).map(value => {

        subtitleOpen?.replaceChildren(text.subtitles);
        subtitleOpen?.setAttribute('aria-label', text.openSubtitles);
        jimakuLink?.replaceChildren(text.findSubtitles);
        jimakuLink?.setAttribute('aria-label', text.openJimaku);
        document.querySelector('.empty strong').textContent = text.emptyTitle;
        document.querySelector('[data-empty-video-chip]')?.replaceChildren(text.emptyVideoChip);
        document.querySelector('[data-empty-subtitle-chip]')?.replaceChildren(text.emptySubtitleChip);
        overflowSummary?.setAttribute('aria-label', text.menu);
        if (settingsTrigger) {
          settingsTrigger.textContent = text.settings;
          settingsTrigger.setAttribute('aria-label', text.openSettings);
        }
        // The stamped site nav carries its own Japanese label per entry, so adding
        // a route to src/reader/app/site-nav.ts needs no edit here.
        for (const item of document.querySelectorAll('[data-site-nav-item]')) {
          const japanese = item.dataset.navJa;
          if (!item.dataset.navEn) item.dataset.navEn = item.textContent.trim();
          item.replaceChildren(language === 'ja' && japanese ? japanese : item.dataset.navEn);
        }
        document.querySelector('[data-menu-github]')?.replaceChildren(text.github);
        document.querySelector('[data-menu-discord]')?.replaceChildren(text.discord);
        if (!currentVideoName) setStatus(text.emptyStatus);
        if (languageToggle) {
          const next = nextInterfaceLanguage();
          const label = next === 'ja' ? text.switchToJapanese : text.switchToEnglish;
          languageToggle.textContent = next === 'ja' ? 'あ' : 'A';
          languageToggle.lang = next === 'ja' ? 'ja' : 'en';
          languageToggle.setAttribute('aria-label', label);
          languageToggle.removeAttribute('title');
        }
        syncFullscreenButtonLabel();
        applyTheme(effectiveTheme());
        applyAccent();
        // Guarded: this hook only exists on hosted-demo builds that define it;
        // a bare call threw a ReferenceError that aborted the rest of page
        // setup (the subtitle player never mounted).
        window.requestHostedDemoLookupScan?.();
      }

      function runtimeAssetCandidates(fileName) {
        const urls = [
          new URL(`../${fileName}`, window.location.href),
          new URL(`./${fileName}`, window.location.href),
          new URL(`/${fileName}`, window.location.origin),
          new URL(`/yomu-reader/${fileName}`, window.location.origin),
        ];
        return [...new Set(urls.map(url => url.href))];
      }

      function hasYomuRuntime() {
        const runtime = window;
        return Boolean(
          runtime.__yomuReaderAppInitialized ||
          document.getElementById(yomuRuntimeMarkerId) ||
          document.querySelector('.jpdb-subtitle-player, .jpdb-reader-settings')
        );
      }

      function hasInstalledYomuRuntime() {
        return Boolean(document.getElementById(installedRuntimeMarkerId));
      }

      function waitForYomuRuntime(timeoutMs = runtimeReadyTimeoutMs) {
        if (hasYomuRuntime()) return Promise.resolve(true);
        return new Promise(resolve => {
          const started = performance.now();
          const check = () => {
            if (hasYomuRuntime()) {
              resolve(true);
              return;
            }
            if (performance.now() - started >= timeoutMs) {
              resolve(false);
              return;
            }
            window.setTimeout(check, 50);
          };
          check();
        });
      }

      function loadYomuCss() {
        if (document.querySelector('link[href$="/yomu.css"], link[href*="/yomu.css?"], link[' + runtimeCssAttribute + ']')) {
          return Promise.resolve(true);
        }
        return loadLinkCandidates(runtimeAssetCandidates('yomu.css'));
      }

      function loadLinkCandidates(candidates, index = 0) {
        if (index >= candidates.length) return Promise.resolve(false);
        return new Promise(resolve => {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = candidates[index];
          link.setAttribute(runtimeCssAttribute, 'true');
          link.addEventListener('load', () => resolve(true), { once: true });
          link.addEventListener('error', () => {
            link.remove();
            void loadLinkCandidates(candidates, index + 1).then(resolve);
          }, { once: true });
          document.head.append(link);
        });
      }

      async function loadYomuScript() {
        if (hasYomuRuntime()) return Promise.resolve(true);
        if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
        const existing = document.getElementById(runtimeScriptId) || document.querySelector('script[' + runtimeScriptAttribute + ']');
        if (existing) return waitForYomuRuntime();
        if (!await loadYomuCompanions()) return false;
        if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
        return loadScriptCandidates(runtimeAssetCandidates('yomu.user.js'));
      }

      async function loadYomuCompanions() {
        for (const fileName of runtimeCompanionScripts) {
          if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
          if (!await loadYomuCompanion(fileName)) return false;
        }
        return true;
      }

      function loadYomuCompanion(fileName) {
        const id = `yomu-hosted-video-${fileName.replace(/[^a-z0-9]+/gi, '-')}`;
        if (document.getElementById(id) || document.querySelector(`script[${runtimeCompanionAttribute}="${fileName}"]`)) return Promise.resolve(true);
        return loadScriptCandidates(runtimeAssetCandidates(fileName), 0, { id, attribute: runtimeCompanionAttribute, value: fileName, waitForRuntime: false });
      }

      function loadScriptCandidates(candidates, index = 0, options = {}) {
        if (index >= candidates.length) return Promise.resolve(false);
        return new Promise(resolve => {
          const script = document.createElement('script');
          script.id = options.id || runtimeScriptId;
          script.async = true;
          script.src = candidates[index];
          script.setAttribute(options.attribute || runtimeScriptAttribute, options.value || 'true');
          script.addEventListener('load', () => {
            if (options.waitForRuntime === false) {
              resolve(true);
              return;
            }
            void waitForYomuRuntime().then(ready => {
              if (ready) {
                resolve(true);
                return;
              }
              script.remove();
              void loadScriptCandidates(candidates, index + 1, options).then(resolve);
            });
          }, { once: true });
          script.addEventListener('error', () => {
            script.remove();
            void loadScriptCandidates(candidates, index + 1, options).then(resolve);
          }, { once: true });
          document.head.append(script);
        });
      }

      async function ensureYomuRuntime(options = {}) {
        if (hasYomuRuntime()) return true;
        if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
        const text = copy[effectiveInterfaceLanguage()];
        if (!options.silent) setStatus(options.message || text.loadingRuntime);
        runtimeLoadPromise ||= (async () => {
          await loadYomuCss();
          if (hasInstalledYomuRuntime()) return waitForYomuRuntime();
          return loadYomuScript();
        })();
        const loaded = await runtimeLoadPromise.catch(() => false);
        const ready = loaded && await waitForYomuRuntime();
        if (!ready) runtimeLoadPromise = null;
        if (!ready && !options.silent) setStatus(text.runtimeMissing);
        return ready;
      }

      function settingsVisible() {
        return Boolean(document.querySelector('.jpdb-reader-settings'));
      }

      function subtitleTracksVisible() {
        return Boolean(document.querySelector('.jpdb-subtitle-list.jpdb-subtitle-tracks-panel:not([hidden])'));
      }

      function dispatchSettingsOpen() {
        if (settingsVisible()) return true;
        window.dispatchEvent(new CustomEvent(openSettingsEvent, { detail: { panel: 'basics' } }));
        return settingsVisible();
      }

      function dispatchSubtitleTracksOpen() {
        if (subtitleTracksVisible()) return true;
        window.dispatchEvent(new CustomEvent(openSubtitleTracksEvent));
        return subtitleTracksVisible();
      }

      function retryYomuAction(dispatch, missingMessage) {
        if (dispatch()) return;
        [120, 360, 900].forEach(delay => window.setTimeout(dispatch, delay));
        window.setTimeout(() => {
          if (!dispatch()) setStatus(missingMessage);
        }, 1350);
      }

      async function openSettings() {
        overflowMenu?.removeAttribute('open');
        if (dispatchSettingsOpen()) return;
        const text = copy[effectiveInterfaceLanguage()];
        await ensureYomuRuntime({ message: text.loadingSettings });
        retryYomuAction(dispatchSettingsOpen, text.runtimeMissing);
      }

      async function openSubtitleTracks() {
        overflowMenu?.removeAttribute('open');
        const text = copy[effectiveInterfaceLanguage()];
        if (!currentVideoName) {
          setStatus(text.chooseVideoBeforeSubtitles);
          return;
        }
        if (dispatchSubtitleTracksOpen()) return;
        await ensureYomuRuntime({ message: text.loadingSubtitles });
        retryYomuAction(dispatchSubtitleTracksOpen, text.runtimeMissing);
      }

      function revokeObjectUrl() {
        if (!objectUrl) return;
        URL.revokeObjectURL(objectUrl);
        objectUrl = '';
      }

      function isVideoFile(file) {
        return Boolean(file && (file.type.startsWith('video/') || /\.(mkv|mp4|m4v|mov|webm|ogv)$/i.test(file.name)));
      }

      function isSubtitleFile(file) {
        return Boolean(file && /\.(srt|vtt|ass|ssa)$/i.test(file.name));
      }

      function loadVideo(file, options = {}) {
        if (!file) return;
        revokeObjectUrl();
        stage.classList.add('has-video');
        currentVideoName = file.name;
        video.dataset.yomuAnimeSearch = file.name;
        const text = copy[effectiveInterfaceLanguage()];
        const subtitleCount = options.subtitleCount || 0;
        setStatus(subtitleCount ? text.openingWithSubtitles(file.name, subtitleCount) : text.opening(file.name));
        objectUrl = URL.createObjectURL(file);
        window.setTimeout(() => {
          video.src = objectUrl;
          video.load();
          if (!subtitleCount) setStatus(file.name);
        }, 0);
      }

      async function loadSubtitleFiles(files) {
        const subtitleFiles = Array.from(files || []).filter(isSubtitleFile);
        if (!subtitleFiles.length) return false;
        const text = copy[effectiveInterfaceLanguage()];
        const ready = await ensureYomuRuntime({ message: text.loadingSubtitles });
        if (!ready) return false;
        window.dispatchEvent(new CustomEvent(loadSubtitleFilesEvent, {
          detail: {
            files: subtitleFiles,
            openPanel: 'auto',
          },
        }));
        setStatus(text.subtitlesQueued(currentVideoName || text.stageLabel, subtitleFiles.length));
        return true;
      }

      function loadSubtitleFilesSoon(files) {
        window.setTimeout(() => { void loadSubtitleFiles(files); }, 90);
      }

      function handleFiles(files) {
        const list = Array.from(files || []);
        const videoFile = list.find(isVideoFile);
        const subtitleFiles = list.filter(isSubtitleFile);
        if (videoFile) {
          loadVideo(videoFile, { subtitleCount: subtitleFiles.length });
          if (subtitleFiles.length) loadSubtitleFilesSoon(subtitleFiles);
          return;
        }
        if (subtitleFiles.length && currentVideoName) {
          void loadSubtitleFiles(subtitleFiles);
          return;
        }
        setStatus(copy[effectiveInterfaceLanguage()].chooseVideo);
      }

      function applyVideoAspect() {
        // Drive the stage box to the real video aspect ratio so the frame fills
        // as much of the page as the picture allows while staying letterbox-free,
        // and so the subtitle overlay (anchored to the frame) lines up with it.
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          stage.style.setProperty('--aspect', String(video.videoWidth / video.videoHeight));
        }
      }

      function activeFullscreenElement() {
        return document.fullscreenElement
          || document.webkitFullscreenElement
          || document.mozFullScreenElement
          || document.msFullscreenElement
          || null;
      }

      function stageIsFullscreen() {
        const active = activeFullscreenElement();
        return active === stage || stage.getAttribute('data-yomu-inline-fullscreen') === 'true';
      }

      function syncFullscreenButtonLabel() {
        if (!fullscreenToggle) return;
        const text = copy[effectiveInterfaceLanguage()];
        const active = stageIsFullscreen();
        const label = active ? text.exitFullscreen : text.enterFullscreen;
        stage.toggleAttribute('data-fullscreen-active', active);
        fullscreenToggle.setAttribute('aria-label', label);
        fullscreenToggle.title = label;
      }

      function requestStageFullscreen() {
        const request = stage.requestFullscreen
          || stage.webkitRequestFullscreen
          || stage.webkitRequestFullScreen
          || stage.mozRequestFullScreen
          || stage.msRequestFullscreen;
        if (typeof request === 'function') return request.call(stage);
        return enterInlineFullscreen();
      }

      function exitStageFullscreen() {
        if (stage.getAttribute('data-yomu-inline-fullscreen') === 'true') return exitInlineFullscreen();
        const exit = document.exitFullscreen
          || document.webkitExitFullscreen
          || document.webkitCancelFullScreen
          || document.mozCancelFullScreen
          || document.msExitFullscreen;
        if (typeof exit === 'function') return exit.call(document);
        return undefined;
      }

      function enterInlineFullscreen() {
        stage.setAttribute('data-yomu-inline-fullscreen', 'true');
        stage.setAttribute('fullscreen', '');
        stage.classList.add('fullscreen', 'ytp-fullscreen');
        document.documentElement.classList.add('jpdb-subtitle-inline-fullscreen');
        dispatchFullscreenStateChange();
        return Promise.resolve();
      }

      function exitInlineFullscreen() {
        stage.removeAttribute('data-yomu-inline-fullscreen');
        stage.removeAttribute('fullscreen');
        stage.classList.remove('fullscreen', 'ytp-fullscreen');
        document.documentElement.classList.remove('jpdb-subtitle-inline-fullscreen');
        dispatchFullscreenStateChange();
        return Promise.resolve();
      }

      function dispatchFullscreenStateChange() {
        for (const name of ['fullscreenchange', 'webkitfullscreenchange']) {
          document.dispatchEvent(new Event(name));
        }
        window.dispatchEvent(new Event('resize'));
        syncFullscreenButtonLabel();
      }

      async function toggleFullscreen() {
        if (!stage.classList.contains('has-video')) {
          videoInput.click();
          return;
        }
        try {
          if (stageIsFullscreen()) await exitStageFullscreen();
          else await Promise.resolve(requestStageFullscreen()).catch(() => enterInlineFullscreen());
        } finally {
          syncFullscreenButtonLabel();
        }
      }

      video.addEventListener('loadedmetadata', applyVideoAspect);
      video.addEventListener('resize', applyVideoAspect);

      videoInput.addEventListener('change', () => {
        const files = Array.from(videoInput.files || []);
        videoInput.value = '';
        window.requestAnimationFrame(() => handleFiles(files));
      });
      emptyOpen?.addEventListener('click', () => videoInput.click());
      themeToggle?.addEventListener('click', () => {
        saveThemePreference(effectiveTheme() === 'dark' ? 'light' : 'dark');
      });
      languageToggle?.addEventListener('click', () => saveInterfaceLanguage(nextInterfaceLanguage()));
      settingsTrigger?.addEventListener('click', openSettings);
      subtitleOpen?.addEventListener('click', openSubtitleTracks);
      fullscreenToggle?.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', syncFullscreenButtonLabel);
      document.addEventListener('webkitfullscreenchange', syncFullscreenButtonLabel);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && stage.getAttribute('data-yomu-inline-fullscreen') === 'true') {
          event.preventDefault();
          void exitInlineFullscreen();
        }
      });
      window.addEventListener(settingsChangeEvent, syncFromSettingsEvent);
      window.addEventListener('storage', event => {
        if (event.key === settingsKey || event.key === themeKey || event.key === null) {
          applyTheme();
          applyAccent();
        }
      });
      matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
        if (themePreference() === 'auto') {
          applyTheme();
          applyAccent();
        }
      });
      brandIcon?.addEventListener('error', () => {
        brandIcon.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(fallbackIconSvg)}`;
      }, { once: true });

      for (const eventName of ['dragenter', 'dragover']) {
        document.addEventListener(eventName, event => {
          event.preventDefault();
          app.classList.add('drop-active');
        });
      }

      for (const eventName of ['dragleave', 'drop']) {
        document.addEventListener(eventName, event => {
          event.preventDefault();
          if (eventName === 'drop') handleFiles(event.dataTransfer?.files || []);
          app.classList.remove('drop-active');
        });
      }

      window.addEventListener('pagehide', revokeObjectUrl);
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('./sw.js').catch(() => undefined);
      }
      void ensureYomuRuntime({ silent: true });
    })();
  </script>
</body>
</html>
