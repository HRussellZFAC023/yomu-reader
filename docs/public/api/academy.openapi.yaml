          "type": "string"
          "format": "uuid"
        "runNonce":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Supervisor-provided 32-byte run nonce."
          "minLength": 43
          "maxLength": 43
      "additionalProperties": false
    "LifecycleProofAuthorizationRequest":
      "type": "object"
      "required":
        - "proofToken"
        - "runNonce"
      "properties":
        "proofToken":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Single-use production proof token."
          "minLength": 43
          "maxLength": 43
        "runNonce":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Run nonce bound to the proof token."
          "minLength": 43
          "maxLength": 43
      "additionalProperties": false
    "LifecycleProofDeletionRequest":
      "type": "object"
      "required":
        - "proofToken"
        - "runNonce"
        - "confirmation"
      "properties":
        "proofToken":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Single-use production proof token."
          "minLength": 43
          "maxLength": 43
        "runNonce":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Run nonce bound to the proof token."
          "minLength": 43
          "maxLength": 43
        "confirmation":
          "type": "string"
          "const": "delete-account"
      "additionalProperties": false
    "LifecycleProofGrant":
      "type": "object"
      "required":
        - "proofToken"
        - "runNonce"
        - "accountId"
        - "environment"
        - "scope"
        - "expiresAt"
      "properties":
        "proofToken":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
          "minLength": 43
          "maxLength": 43
        "runNonce":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]+$"
          "description": "Unpadded base64url."
          "minLength": 43
          "maxLength": 43
        "accountId":
          "type": "string"
          "format": "uuid"
        "environment":
          "type": "string"
          "const": "production"
        "scope":
          "type": "string"
          "const": "account-lifecycle-production-test"
        "expiresAt":
          "type": "integer"
          "format": "int64"
          "description": "Unix time in milliseconds."
      "additionalProperties": false
    "LifecycleProofVerification":
      "type": "object"
      "required":
        - "verified"
        - "accountId"
        - "environment"
        - "scope"
        - "expiresAt"
      "properties":
