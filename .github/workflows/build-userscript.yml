name: Build Userscript

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - dist/yomu.user.js

permissions:
  contents: write

concurrency:
  group: build-userscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit bundled userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/yomu.user.js
          if git diff --cached --quiet; then
            echo "dist/yomu.user.js is already current."
          else
            git commit -m "build userscript [skip ci]"
            git push
          fi
