"components":
  "schemas":
    "Error":
      "type": "object"
      "required":
        - "error"
      "properties":
        "error":
          "type": "string"
      "additionalProperties": false
    "Ok":
      "type": "object"
      "required":
        - "ok"
      "properties":
        "ok":
          "type": "boolean"
          "const": true
      "additionalProperties": false
    "EmptyObject":
      "type": "object"
      "maxProperties": 0
      "additionalProperties": false
    "Health":
      "type": "object"
      "required":
        - "ok"
      "properties":
        "ok":
          "type": "boolean"
          "const": true
      "additionalProperties": false
    "InviteCodeRequest":
      "type": "object"
      "required":
