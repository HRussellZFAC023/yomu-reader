"openapi": "3.1.0"
"info":
  "title": "Yomu Academy API"
  "version": "1.8.88"
  "description": "Accounts, secure browser sessions, Reader device pairing, encrypted SRS sync, class progress, learning feedback, and protected Academy media. Browser mutations marked `x-yomu-same-origin` also require an Origin header matching https://yomureader.com."
  "contact":
    "name": "Yomu"
    "url": "https://yomureader.com/"
  "license":
    "name": "MIT"
    "identifier": "MIT"
"servers":
  -
    "url": "https://yomureader.com"
"tags":
  -
    "name": "System"
    "description": "Health and deploy metadata."
  -
    "name": "Sessions"
    "description": "Invitation-backed browser sessions."
  -
    "name": "Authentication"
    "description": "Google OIDC entry and callback."
  -
    "name": "Account"
    "description": "Account preferences, export, and deletion."
  -
    "name": "Entitlements"
    "description": "Academy access state."
  -
    "name": "Profiles"
    "description": "Client-encrypted profile lifecycle."
  -
    "name": "Pairing"
    "description": "One-use cross-device key transfer."
  -
    "name": "Devices"
    "description": "Durable Reader device credentials."
  -
    "name": "SRS sync"
    "description": "Opaque encrypted event synchronization."
  -
    "name": "Progress"
    "description": "Aggregate learner progress."
  -
    "name": "Learning"
    "description": "Speaking and writing answer checking."
  -
    "name": "Classes"
    "description": "Class boards and rankings."
  -
    "name": "Media"
    "description": "Protected learning media."
  -
    "name": "Administration"
    "description": "Server-managed administrative operations."
"paths":
  "/academy/api/health":
    "get":
      "operationId": "getAcademyHealth"
      "tags":
        - "System"
      "summary": "Check Academy API health"
      "description": "Returns deploy metadata for the production Academy Worker."
      "security": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Health"
  "/academy/api/session":
    "post":
      "operationId": "createAcademySession"
      "tags":
        - "Sessions"
      "summary": "Exchange an invitation code"
      "description": "Creates an eight-hour browser session and a fixed 30-day offline-resume window."
      "security": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "The authenticated caller is not permitted to perform this operation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "The request conflicts with current server state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/InviteCodeRequest"
      "x-yomu-same-origin": true
    "get":
      "operationId": "getAcademySession"
      "tags":
        - "Sessions"
      "summary": "Read the active session"
      "description": "Returns the session bound to the secure host cookie."
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Session"
        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "The authenticated caller is not permitted to perform this operation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "The request conflicts with current server state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/academy/api/session/status":
    "get":
      "operationId": "getAcademySessionStatus"
      "tags":
        - "Sessions"
      "summary": "Check browser session state"
      "description": "Returns a state-only, non-mutating account-shell projection. Missing, malformed, revoked, unknown, and elapsed cookies all return signed-out with status 200."
      "security": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/SessionStatus"
        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "The authenticated caller is not permitted to perform this operation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "The request conflicts with current server state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/academy/api/session/resume":
    "post":
      "operationId": "resumeAcademySession"
      "tags":
        - "Sessions"
      "summary": "Rotate and resume a session"
      "description": "Rotates a resumable browser cookie without consuming another invitation."
