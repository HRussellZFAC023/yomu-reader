name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - dist/kotoba.user.js

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
