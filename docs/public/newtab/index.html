<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yomu New Tab</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #5ea780;
      color: #111;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #5ea780;
    }

    main {
      max-width: 560px;
      display: grid;
      gap: 14px;
      border: 4px solid #fff;
      padding: 28px;
      background: #fff;
      color: #15171c;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 12vw, 86px);
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <h1>Yomu</h1>
    <p>Install the Yomu userscript and enable the new tab page in settings. Yomu will replace this page with your Anki or JPDB words.</p>
  </main>
</body>
</html>
