<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>よむ Reader Test</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.8;
        background: #f5f7fa;
        color: #171a1f;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 18px 120px;
      }
      article {
        background: white;
        border: 1px solid rgba(20, 30, 45, .12);
        border-radius: 8px;
        padding: 22px;
      }
    </style>
    <script>
      const params = new URLSearchParams(location.search);
      const apiKey = params.get('apiKey');
      const audioSourceUrl = params.get('audio');
      if (apiKey) {
        localStorage.setItem('jpdb-popup-reader-settings', JSON.stringify({
          apiKey,
          audioEnabled: true,
          audioSources: audioSourceUrl
            ? [{ type: 'custom-json', url: audioSourceUrl, voice: '', enabled: true }]
            : [
              { type: 'jpod101', url: '', voice: '', enabled: true },
              { type: 'language-pod-101', url: '', voice: '', enabled: true },
              { type: 'jisho', url: '', voice: '', enabled: true }
            ],
          audioEnableDefaultSources: true,
          audioSourceUrl,
          autoPlayAudio: true,
          audioViaBlob: true,
          audioSelectionMode: 'random',
          parseSelection: true,
          popupActivationMode: 'hover',
          scanModifierKey: 'shift',
          autoScanJapanese: true,
          scanVisiblePage: true,
          showFloatingButton: true,
          showFurigana: true,
          showPitchAccent: true,
          hideKnownFurigana: true,
          ocrEnabled: true,
          ocrAutoScanImages: true,
          ocrShowTextOverlay: false,
          ocrProvider: 'auto',
          ocrEndpointUrl: '',
          ocrEngine: 'MangaOCR',
          ocrLanguage: 'ja-JP',
          ocrMaxImagePixels: 1200000,
          ocrMinImageArea: 45000,
          ocrMaxImagesPerPage: 3,
          ocrPrefetchMargin: 700,
          localDictionariesEnabled: true,
          localDictionaryMaxResults: 12,
          localDictionaryShowKanji: true,
          dictionaryPreferences: [],
          subtitlePlayerEnabled: true,
          subtitleAutoDetect: true,
          subtitleOverlayVisible: true,
          subtitleSecondaryVisible: true,
          subtitleFontSize: 28,
          subtitleBottomOffset: 12,
          subtitleMiningPause: true,
          subtitleSeekPadding: 0.08,
          theme: 'auto',
          popupMode: 'auto',
          miningDeck: 'forq',
          neverForgetDeck: 'never-forget',
          blacklistDeck: 'blacklist',
          addToForq: false,
          enableReviews: true,
          twoButtonReviews: false,
          shortcuts: {
            scanPage: 'Alt+J',
            openSettings: 'Alt+Shift+J',
            playAudio: 'A',
            closePopup: 'Escape',
            previousSubtitle: 'Alt+ArrowLeft',
            nextSubtitle: 'Alt+ArrowRight',
            copySubtitle: 'Alt+C',
            toggleOcr: 'Alt+O',
            scanImages: 'Alt+I',
            gradeNothing: '1',
            gradeSomething: '2',
            gradeHard: '3',
            gradeOkay: '4',
            gradeEasy: '5',
            gradeFail: '1',
            gradePass: '2'
          }
        }));
      }
    </script>
  </head>
  <body>
    <main>
      <article>
        <h1>青空の下で日本語を読む</h1>
        <p>今日は静かな喫茶店で新しい本を読みました。難しい単語を見つけたら、すぐに意味を確認できます。</p>
        <p>「本当ですか？」と彼女は笑いました。私は辞書を開いて、発音も確かめました。</p>
        <p>食べる、勉強する、綺麗な景色、そして忘れたくない言葉。</p>
      </article>
    </main>
    <script type="module">
      window.setTimeout(() => void import('/src/reader/main.ts'), 0);
    </script>
  </body>
</html>
