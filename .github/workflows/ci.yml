name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - dist/yomu.user.js

permissions:
  contents: read

env:
  YOMU_CI_TEST_TIMEOUT_MS: 540000

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fallow:dead-code
      - run: npm run fallow:audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs --kind regular --shard=${{ matrix.shard }} --total=8

  test-jpdb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs --kind jpdb --shard=${{ matrix.shard }} --total=8

  gaming-smoke:
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run smoke:gaming
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test, test-jpdb, gaming-smoke]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/sync-docs-userscript.cjs
      - run: npm run docs:build
      - run: npm run verify
      - run: npm run smoke:offline-study
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:p0
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:furigana-local-default
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: npm run smoke:youtube-controls-wake
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
