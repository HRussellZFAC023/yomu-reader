        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "The authenticated caller is not permitted to perform this operation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "The request conflicts with current server state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "x-yomu-same-origin": true
  "/academy/api/logout":
    "post":
      "operationId": "logoutAcademySession"
      "tags":
        - "Sessions"
      "summary": "Log out"
      "description": "Revokes the session family and clears the browser cookie."
      "security":
        -
          "sessionCookie": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Ok"
        "400":
          "description": "The request was malformed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "The authenticated caller is not permitted to perform this operation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "The request conflicts with current server state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "429":
          "description": "The caller exceeded a rate limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "The service could not complete the request."
          "content":
            "application/json":
