<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>Yomu · Google Drive settings sync</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
    }
    .icon { width: 48px; height: 48px; }
    .status { max-width: 30ch; opacity: 0.85; }
    .error { color: #d33; }
    button {
      font: inherit;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
      background: color-mix(in srgb, CanvasText 6%, Canvas);
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img class="icon" src="/yomu-icon.svg" alt="" />
  <h1 style="font-size: 1.1rem; margin: 0;">Google Drive settings sync</h1>
  <p class="status" id="status">Connecting to Google…</p>
  <button id="retry" hidden>Try again</button>
  <script>
    // Static OAuth broker for the Yomu userscript. The userscript runs on
    // third-party origins Google will not authorise, so it navigates the current
    // tab through this authorised yomureader.com origin. This page performs a
    // redirect-based Drive appData authorization and returns to the original page
    // with the short-lived token in window.name, not in the URL.
    (function () {
      'use strict';
      var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
      var GOOGLE_AUTH_URL = 'https://accounts.google.com/o/oauth2/v2/auth';
      var STORAGE_PREFIX = 'yomu-drive-oauth:';
      var RETURN_HASH_KEY = 'yomu-drive-oauth-return';
      var WINDOW_NAME_TYPE = 'yomu-drive-oauth-token';
      var params = new URLSearchParams(location.search);
      var clientId = params.get('client_id') || '';
      var returnUrl = params.get('return_url') || '';
      var state = params.get('state') || '';
      var statusEl = document.getElementById('status');
      var retryEl = document.getElementById('retry');
      var finishedReturn = false;

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = isError ? 'status error' : 'status';
      }

      function fail(reason) {
        setStatus(reason, true);
        retryEl.hidden = false;
      }

      function storageKey(value) {
        return STORAGE_PREFIX + value;
      }

      function saveTransaction(transaction) {
        var raw = JSON.stringify(transaction);
        try { localStorage.setItem(storageKey(transaction.state), raw); } catch (_) { /* ignore */ }
        try { sessionStorage.setItem(storageKey(transaction.state), raw); } catch (_) { /* ignore */ }
      }

      function loadTransactionFrom(store, value) {
        try {
          var raw = store.getItem(storageKey(value));
          return raw ? JSON.parse(raw) : null;
        } catch (_) {
          return null;
        }
      }

      function loadTransaction(value) {
        return loadTransactionFrom(localStorage, value) || loadTransactionFrom(sessionStorage, value);
      }

      function clearTransaction(value) {
        try { localStorage.removeItem(storageKey(value)); } catch (_) { /* ignore */ }
        try { sessionStorage.removeItem(storageKey(value)); } catch (_) { /* ignore */ }
      }

      function cleanBrokerUrl() {
        return location.origin + location.pathname;
      }

      function authRedirectUrl(transaction) {
        var auth = new URL(GOOGLE_AUTH_URL);
        auth.searchParams.set('client_id', transaction.clientId);
        auth.searchParams.set('redirect_uri', cleanBrokerUrl());
        auth.searchParams.set('response_type', 'token');
        auth.searchParams.set('scope', DRIVE_SCOPE);
        auth.searchParams.set('include_granted_scopes', 'true');
        auth.searchParams.set('state', transaction.state);
        return auth.href;
      }

      function returnUrlWithMarker(url, value) {
        var target = new URL(url);
        var marker = RETURN_HASH_KEY + '=' + encodeURIComponent(value);
        var existing = target.hash ? target.hash.slice(1) : '';
        target.hash = existing ? existing + '&' + marker : marker;
        return target.href;
      }

      function returnToYomu(transaction, message) {
        message.type = WINDOW_NAME_TYPE;
        message.state = transaction.state;
        window.name = JSON.stringify(message);
        location.replace(returnUrlWithMarker(transaction.returnUrl, transaction.state));
      }

      function hashParams() {
        return new URLSearchParams(location.hash.replace(/^#/, ''));
      }

      function finishReturnedAuthorization() {
        if (finishedReturn) return true;
        finishedReturn = true;
        var hash = hashParams();
        var returnedState = hash.get('state') || '';
        var transaction = returnedState ? loadTransaction(returnedState) : null;
        if (!transaction || !transaction.returnUrl || !transaction.clientId) {
          fail('Could not find the Yomu authorization request. Please start sync again.');
          return true;
        }
        clearTransaction(returnedState);
        var error = hash.get('error_description') || hash.get('error') || '';
        if (error) {
          returnToYomu(transaction, { error: error });
          return true;
        }
        var token = hash.get('access_token') || '';
        if (!token) {
          returnToYomu(transaction, { error: 'Google did not return an access token.' });
          return true;
        }
        setStatus('Connected. Returning to Yomu…');
        returnToYomu(transaction, {
          accessToken: token,
          expiresIn: Number(hash.get('expires_in')) || 3600,
        });
        return true;
      }

      function maybeFinishReturnedAuthorization() {
        return location.hash ? finishReturnedAuthorization() : false;
      }

      // OAuth returns to the registered URL without the startup query string.
      // Handle the fragment before validating the query parameters used to
      // start a fresh authorization.
      if (maybeFinishReturnedAuthorization()) {
        // Authorization result consumed.
      } else if (!/^[-\w]+\.apps\.googleusercontent\.com$/.test(clientId)) {
        fail('Missing or invalid Google client id.');
      } else if (!/^https?:\/\//.test(returnUrl)) {
        fail('This page must be opened by Yomu.');
      } else if (!/^[a-z0-9]+$/i.test(state)) {
        fail('This page must be opened by Yomu.');
      } else {
        start();
      }

      function start() {
        setStatus('Opening Google authorization…');
        retryEl.hidden = true;
        var transaction = { clientId: clientId, returnUrl: returnUrl, state: state };
        saveTransaction(transaction);
        location.replace(authRedirectUrl(transaction));
      }

      retryEl.addEventListener('click', start);
      window.addEventListener('pageshow', maybeFinishReturnedAuthorization);
      window.addEventListener('hashchange', maybeFinishReturnedAuthorization);
    })();
  </script>
</body>
</html>
