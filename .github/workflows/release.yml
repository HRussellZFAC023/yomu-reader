name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.3.0
        required: true
      publish_browser_stores:
        description: Also submit this release to Chrome Web Store and Firefox Add-ons
        type: boolean
        default: false
      browser_store_target:
        description: Browser store to submit on a manual retry
        type: choice
        options:
          - both
          - chrome
          - firefox
        default: both
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.browser-store-gate.outputs.release_tag }}
      publish_browser_stores: ${{ steps.browser-store-gate.outputs.publish_browser_stores }}
    # Unlike PR CI, this job runs the whole check on one small 4-core runner.
    # The former all-in-one reused-fork path could exhaust that runner before
    # Vitest reported a summary. Use the proven isolated regular/JPDB shards
    # with the 2.3 GB fork cap and only one regular jsdom fork at a time. Pin
    # both the runner request and the shared config's overridable worker default.
    env:
      TZ: UTC
      YOMU_CI_SHARDED: 1
      YOMU_CI_REGULAR_SHARDS: 8
      YOMU_CI_REGULAR_CONCURRENCY: 1
      YOMU_CI_REGULAR_MAX_WORKERS: 1
      YOMU_CI_JPDB_CONCURRENCY: 2
      VITEST_MAX_FORKS: 1
      YOMU_VITEST_FORK_HEAP_MB: 2304
    steps:
      - name: Checkout Yomu
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout UserScript Compiler
        uses: actions/checkout@v6
        with:
          repository: HRussellZFAC023/UserScript-Compiler
          ref: 52b7fe463ae503c294421752002da568472dfe4a
          path: UserScript-Compiler

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            UserScript-Compiler/package-lock.json
      - name: Pin npm for reproducible release builds
        run: npm install --global npm@11.9.0
      - name: Install compiler dependencies
        working-directory: UserScript-Compiler
        run: npm ci
      - name: Install Yomu dependencies
        run: npm ci
      - name: Set the source-date epoch from the release commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Warm vitepress cache
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: vitepress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            vitepress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            vitepress-${{ runner.os }}-
      - name: Ensure Electron runtime
        run: npm run prepare:electron
      # Node 24.16.0 is the audited build/parity runtime below, but Playwright's
      # browser extractor has hung after its 100% Chromium download on that
      # patch release since v1.8.62. CI's layout job proves 24.18.0 can install
      # the same pinned Playwright browsers; use it only for this bootstrap,
      # bound the step, then restore the audited runtime before any gate/build.
      - name: Use stable Node for layout browser installation
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Install layout smoke browsers
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Restore audited release Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Restore pinned npm for release gates
        run: npm install --global npm@11.9.0
      # Releases force byte-level hashing and full academy re-sync (no memo /
      # revision-skip shortcuts) while keeping the parallel stage graph.
      - run: npm run check:release
      - run: npm run smoke:release
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - run: xvfb-run -a npm run smoke:gaming
        env:
          YOMU_PLAYWRIGHT_CHANNEL: chrome
      - name: Build split userscript release artifact
        run: |
          npm run build:userscript
          # Preserve the split userscript: build:extension below empties dist/
          # (vite emptyOutDir), so stash it and restore after the extension build.
          cp dist/yomu.user.js "${RUNNER_TEMP:-/tmp}/yomu.user.js"
      - name: Build extension release packages
        env:
          USERSCRIPT_COMPILER_CLI: UserScript-Compiler/src/cli.mjs
        run: npm run build:extension
      - name: Lint the reviewed Firefox package
        run: |
          lint_dir="$(mktemp -d)"
          unzip -q dist/extension/release/firefox/yomureader.com-firefox.xpi -d "$lint_dir"
          npx --yes web-ext@10.5.0 lint \
            --source-dir="$lint_dir" \
            --warnings-as-errors
      - name: Validate release versions and package Firefox review source
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node scripts/build-amo-source-package.mjs \
            --release-tag "$TAG" \
            --compiler-dir UserScript-Compiler \
            --chrome-package dist/extension/release/chrome/yomureader.com-chrome.zip \
            --firefox-package dist/extension/release/firefox/yomureader.com-firefox.xpi \
            --output dist/extension/source/yomureader.com-firefox-source.zip
      - name: Package Safari Web Extension
        run: |
          cd dist/extension/release/safari
          zip -qr yomureader.com-safari-web-extension.zip yomureader.com-safari-web-extension
      - name: Restore split userscript release artifact
        run: cp "${RUNNER_TEMP:-/tmp}/yomu.user.js" dist/yomu.user.js
      - name: Prepare release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const match = changelog.match(new RegExp(`## \\[${version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\][\\s\\S]*?(?=\\n## \\[|$)`));
          const notes = (match?.[0] ?? `## ${version}\n\nSee CHANGELOG.md for details.`)
            + '\n\nInstall/update userscript: https://raw.githubusercontent.com/HRussellZFAC023/yomu-reader/main/dist/yomu.user.js\n'
            + '\nYomu Gaming desktop apps (Linux x64 AppImage, Windows portable, macOS zips) are attached by the Release Yomu Gaming workflow and may appear shortly after this release is published.\n'
            + '\nRelease assets include the compiled userscript, Chrome extension ZIP, Firefox XPI, its reviewer source bundle, Safari Web Extension ZIP, the full compiler project bundle, a submission guide with review/audit notes, and (from the desktop build workflow) the Yomu Gaming desktop packages plus checksums.\n';
          fs.writeFileSync('release-notes.md', notes);
          NODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          upload_release_assets() {
            local tag="$1"
            shift
            local asset attempt output
            for asset in "$@"; do
              for attempt in 1 2 3 4 5; do
                if output="$(gh release upload "$tag" "$asset" --clobber 2>&1)"; then
                  [ -z "$output" ] || printf '%s\n' "$output"
                  break
                fi
                printf '%s\n' "$output" >&2
                if ! grep -Eiq 'HTTP (408|429|5[0-9][0-9])|timed? out|timeout|connection (reset|refused|closed)|unexpected EOF|TLS handshake|temporar(il)?y unavailable|try again|server is currently unavailable' <<< "$output"; then
                  echo "Non-retryable release upload failure for ${asset}." >&2
                  return 1
                fi
                if [ "$attempt" -eq 5 ]; then
                  echo "Failed to upload ${asset} after ${attempt} attempts." >&2
                  return 1
                fi
                sleep "$((attempt * 15))"
              done
            done
          }
          # The core workflow exclusively owns userscript and extension assets.
          # Release Yomu Gaming exclusively owns every desktop package and its
          # checksum file, avoiding concurrent uploads of the same asset.
          assets=(
            dist/yomu.user.js \
            dist/extension/release/chrome/yomureader.com-chrome.zip \
            dist/extension/release/firefox/yomureader.com-firefox.xpi \
            dist/extension/source/yomureader.com-firefox-source.zip \
            dist/extension/release/safari/yomureader.com-safari-web-extension.zip \
            dist/extension/yomureader.com-extension-project.zip \
            dist/extension/review/submission-guide.md
          )
          # Create the release WITHOUT assets, then upload separately.
          # `gh release create` with asset args first creates a DRAFT, uploads,
          # then publishes — and deletes its draft if any upload fails. The
          # Gaming workflow's `gh release view` sees that draft and uploads the
          # same AppImage filename concurrently, the name collision fails the
          # create, and gh's cleanup nukes the release out from under BOTH
          # workflows (v1.6.25 lost its release object this way). An asset-less
          # create is atomic and published from the start; uploads then use
          # --clobber, which tolerates the same name landing twice.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --latest --verify-tag
          fi
          upload_release_assets "$TAG" "${assets[@]}"

      - name: Decide whether to publish browser stores
        id: browser-store-gate
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          MANUAL_STORE_PUBLISH: ${{ inputs.publish_browser_stores || false }}
        run: |
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.0$ || "$MANUAL_STORE_PUBLISH" == "true" ]]; then
            echo "publish_browser_stores=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_browser_stores=false" >> "$GITHUB_OUTPUT"
          fi

  publish-chrome-web-store:
    name: Submit Chrome Web Store update
    needs: release
    if: needs.release.outputs.publish_browser_stores == 'true' && (github.event_name == 'push' || inputs.browser_store_target != 'firefox')
    runs-on: ubuntu-latest
    concurrency:
      group: chrome-web-store-production
      cancel-in-progress: false
    # Store credentials stay isolated in this environment. Feature-release
    # tags submit automatically; ordinary patch tags never enter this job.
    environment: browser-store-production
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
      CHROME_WEB_STORE_ITEM_ID: ${{ vars.CHROME_WEB_STORE_ITEM_ID }}
      CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
      CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
      CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
      CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Download the reviewed Chrome package
        run: gh release download "$RELEASE_TAG" --pattern yomureader.com-chrome.zip --dir browser-store-artifacts

      - name: Upload and submit the Chrome package
        shell: bash
        run: |
          set -euo pipefail
          : "${CHROME_WEB_STORE_PUBLISHER_ID:?Set the CHROME_WEB_STORE_PUBLISHER_ID repository variable}"
          : "${CHROME_WEB_STORE_ITEM_ID:?Set the CHROME_WEB_STORE_ITEM_ID repository variable}"

          json_field() {
            node -e '
              const fs = require("node:fs");
              const value = process.argv[1].split(".").reduce((current, key) => current?.[key], JSON.parse(fs.readFileSync(0, "utf8")));
              if (value === undefined || value === null || value === "") process.exit(1);
              process.stdout.write(String(value));
            ' "$1"
          }

          if [[ -n "$CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON" ]]; then
            jwt_assertion="$(node <<'NODE'
          const { createSign } = require('node:crypto');
          const credentials = JSON.parse(process.env.CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON);
          if (!credentials.client_email || !credentials.private_key) {
            throw new Error('Chrome Web Store service-account JSON is missing client_email or private_key.');
          }
          const now = Math.floor(Date.now() / 1000);
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const unsigned = `${encode({ alg: 'RS256', typ: 'JWT' })}.${encode({
            iss: credentials.client_email,
            scope: 'https://www.googleapis.com/auth/chromewebstore',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          })}`;
          const signature = createSign('RSA-SHA256').update(unsigned).end().sign(credentials.private_key, 'base64url');
          process.stdout.write(`${unsigned}.${signature}`);
          NODE
            )"
            token_response="$(curl --fail-with-body --silent --show-error \
              https://oauth2.googleapis.com/token \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
              --data-urlencode "assertion=$jwt_assertion")"
            access_token="$(json_field access_token <<< "$token_response")"
          else
            : "${CHROME_WEB_STORE_CLIENT_ID:?Set CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON or the legacy CHROME_WEB_STORE_CLIENT_ID secret}"
            : "${CHROME_WEB_STORE_CLIENT_SECRET:?Set the legacy CHROME_WEB_STORE_CLIENT_SECRET repository secret}"
            : "${CHROME_WEB_STORE_REFRESH_TOKEN:?Set the legacy CHROME_WEB_STORE_REFRESH_TOKEN repository secret}"
            token_response="$(curl --fail-with-body --silent --show-error \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=$CHROME_WEB_STORE_CLIENT_ID" \
              --data-urlencode "client_secret=$CHROME_WEB_STORE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$CHROME_WEB_STORE_REFRESH_TOKEN" \
              --data-urlencode grant_type=refresh_token)"
            access_token="$(json_field access_token <<< "$token_response")"
          fi
          item_name="publishers/$CHROME_WEB_STORE_PUBLISHER_ID/items/$CHROME_WEB_STORE_ITEM_ID"

          upload_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $access_token" \
            --header "Content-Type: application/zip" \
            --upload-file browser-store-artifacts/yomureader.com-chrome.zip \
            "https://chromewebstore.googleapis.com/upload/v2/$item_name:upload")"
          upload_state="$(json_field uploadState <<< "$upload_response")"

          for attempt in {1..30}; do
            if [[ "$upload_state" == "SUCCEEDED" ]]; then
              break
            fi
            if [[ "$upload_state" == "FAILED" ]]; then
              echo "Chrome Web Store rejected the package upload with state: $upload_state" >&2
              exit 1
            fi
            sleep 10
            status_response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $access_token" \
              "https://chromewebstore.googleapis.com/v2/$item_name:fetchStatus")"
            # The status field may be absent or briefly report NOT_FOUND while
            # the asynchronous upload is being registered. Keep polling until
            # Chrome reports a terminal state or the bounded timeout expires.
            upload_state="$(json_field lastAsyncUploadState <<< "$status_response" || echo IN_PROGRESS)"
          done

          if [[ "$upload_state" != "SUCCEEDED" ]]; then
            echo "Chrome Web Store package processing timed out with state: $upload_state" >&2
            exit 1
          fi

          publish_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $access_token" \
            --header "Content-Type: application/json" \
            --data '{"publishType":"DEFAULT_PUBLISH","skipReview":false,"blockOnWarnings":true}' \
            "https://chromewebstore.googleapis.com/v2/$item_name:publish")"
          publish_state="$(json_field state <<< "$publish_response")"
          echo "Chrome Web Store accepted $RELEASE_TAG for review with state $publish_state."

  publish-firefox-add-ons:
    name: Submit Firefox Add-ons update
    needs: release
    if: needs.release.outputs.publish_browser_stores == 'true' && (github.event_name == 'push' || inputs.browser_store_target != 'chrome')
    runs-on: ubuntu-latest
    concurrency:
      group: firefox-add-ons-production
      cancel-in-progress: false
    environment: browser-store-production
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TZ: UTC
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Download the reviewed Firefox package and its source
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern yomureader.com-firefox.xpi \
            --pattern yomureader.com-firefox-source.zip \
            --dir browser-store-artifacts

      - name: Unpack the reviewed Firefox package
        run: unzip -q browser-store-artifacts/yomureader.com-firefox.xpi -d browser-store-artifacts/firefox

      - name: Submit the Firefox package
        shell: bash
        run: |
          set -euo pipefail
          : "${AMO_JWT_ISSUER:?Set the AMO_JWT_ISSUER repository secret}"
          : "${AMO_JWT_SECRET:?Set the AMO_JWT_SECRET repository secret}"
          # GitHub preserves whitespace pasted into environment secrets. AMO
          # credentials never contain surrounding whitespace, while web-ext
          # signs with every byte it receives; normalize only that boundary.
          amo_jwt_issuer="$(node -e 'process.stdout.write(process.env.AMO_JWT_ISSUER.trim())')"
          amo_jwt_secret="$(node -e 'process.stdout.write(process.env.AMO_JWT_SECRET.trim())')"
          : "${amo_jwt_issuer:?AMO_JWT_ISSUER is empty after trimming whitespace}"
          : "${amo_jwt_secret:?AMO_JWT_SECRET is empty after trimming whitespace}"
          if [[ "$amo_jwt_issuer" =~ [[:space:]] || "$amo_jwt_secret" =~ [[:space:]] ]]; then
            echo "AMO credentials contain embedded whitespace." >&2
            exit 1
          fi
          echo "::add-mask::$amo_jwt_issuer"
          echo "::add-mask::$amo_jwt_secret"
          npx --yes web-ext@10.5.0 lint \
            --source-dir=browser-store-artifacts/firefox \
            --warnings-as-errors
          npx --yes web-ext@10.5.0 sign \
            --channel=listed \
            --approval-timeout=0 \
            --source-dir=browser-store-artifacts/firefox \
            --artifacts-dir=browser-store-artifacts/signed \
            --amo-metadata=config/amo-metadata.json \
            --upload-source-code=browser-store-artifacts/yomureader.com-firefox-source.zip \
            --api-key="$amo_jwt_issuer" \
            --api-secret="$amo_jwt_secret"
