<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yomu New Tab</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #5ea780;
      --bg: #181b20;
      --ink: #f2f4f8;
      --muted: #aab2c0;
      --faint: #6f7a89;
      --surface: #20242b;
      --surface-2: #282e37;
      --border: rgba(255,255,255,.12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    :root.jpdb-reader-theme-light {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #171a1f;
      --muted: #596272;
      --faint: #7b8493;
      --surface: #f7f8fa;
      --surface-2: #eef1f4;
      --border: rgba(20,30,45,.16);
    }
    :root.jpdb-reader-theme-dark {
      color-scheme: dark;
      --bg: #181b20;
      --ink: #f2f4f8;
      --muted: #aab2c0;
      --faint: #6f7a89;
      --surface: #20242b;
      --surface-2: #282e37;
      --border: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
    }
    .jpdb-reader-newtab {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
    }
    .jpdb-reader-newtab::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: 2px;
      background: var(--accent);
      opacity: .8;
      pointer-events: none;
    }
    .jpdb-reader-newtab-shell {
      width: min(760px, calc(100vw - 28px));
      min-height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(12px, 2.4vh, 22px);
      padding: max(18px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }
    .jpdb-reader-newtab-topbar {
      min-height: 42px;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 8px;
    }
    .jpdb-reader-newtab-brand,
    .jpdb-reader-newtab-theme,
    .jpdb-reader-newtab-overflow {
      width: 38px;
      height: 38px;
      border: 1px solid transparent;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      text-decoration: none;
    }
    .jpdb-reader-newtab-theme {
      padding: 0;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .jpdb-reader-newtab-overflow {
      padding-bottom: 4px;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }
    .jpdb-reader-newtab-brand img {
      display: block;
      width: 30px;
      height: 30px;
      border-radius: 7px;
    }
    .jpdb-reader-newtab-mode {
      justify-self: center;
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(70px, 1fr));
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
    }
    .jpdb-reader-newtab-mode button,
    .jpdb-reader-newtab-controls button {
      border: 0;
      border-radius: 7px;
      color: inherit;
      font: inherit;
      font-size: 12px;
      font-weight: 820;
    }
    .jpdb-reader-newtab-mode button {
      min-height: 32px;
      padding: 0 12px;
      background: transparent;
      color: var(--muted);
    }
    .jpdb-reader-newtab-mode button[data-active="true"] {
      background: color-mix(in srgb, var(--accent) 18%, var(--surface-2));
      color: var(--ink);
    }
    .jpdb-reader-newtab-study {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, .82fr) auto auto;
      align-items: center;
      justify-items: center;
      gap: clamp(9px, 1.9vh, 17px);
      cursor: pointer;
      user-select: none;
    }
    .jpdb-reader-newtab-count,
    .jpdb-reader-newtab-status {
      color: var(--faint);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 760;
      text-align: center;
    }
    .jpdb-reader-newtab-prompt {
      max-width: min(100%, 720px);
      padding: 0 clamp(8px, 3vw, 22px);
      border: 0;
      border-radius: 0;
      background: transparent;
      font-size: clamp(2.25rem, 7vw, 5.2rem);
      font-weight: 900;
      line-height: 1.06;
      text-align: center;
      overflow-wrap: anywhere;
      text-wrap: balance;
      text-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .jpdb-reader-newtab-kanji-mode .jpdb-reader-newtab-prompt {
      font-family: inherit;
      font-size: clamp(2.6rem, 8vw, 5.8rem);
      font-weight: 900;
      line-height: 1.02;
    }
    .jpdb-reader-newtab-answer {
      min-height: clamp(68px, 11vh, 124px);
      display: grid;
      justify-items: center;
      gap: 8px;
      transition: opacity .16s ease, transform .16s ease, filter .16s ease;
    }
    .jpdb-reader-newtab:not(.jpdb-reader-newtab-revealed) .jpdb-reader-newtab-answer {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(4px);
    }
    .jpdb-reader-newtab-reading {
      font-size: clamp(1.2rem, 3.2vw, 2.05rem);
      font-weight: 780;
      line-height: 1.1;
      text-align: center;
    }
    .jpdb-reader-newtab-meaning {
      max-width: min(520px, 100%);
      color: var(--muted);
      font-size: clamp(14px, 2.1vw, 18px);
      font-weight: 650;
      line-height: 1.42;
      text-align: center;
    }
    .jpdb-reader-newtab-controls {
      justify-self: center;
      display: grid;
      grid-template-columns: repeat(3, minmax(88px, 1fr));
      gap: 9px;
      width: min(100%, 680px);
    }
    .jpdb-reader-newtab-controls button {
      display: grid;
      place-items: center;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      line-height: 1.1;
      text-align: center;
    }
    .jpdb-reader-newtab-controls button[data-newtab-action="reveal"] {
      background: var(--ink);
      border-color: transparent;
      color: var(--bg);
    }
    .jpdb-reader-newtab-setup-mode .jpdb-reader-newtab-controls {
      width: min(240px, 100%);
      grid-template-columns: minmax(0, 1fr);
    }
    .jpdb-reader-newtab-setup-mode .jpdb-reader-newtab-controls button {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }
    .jpdb-reader-newtab-sentence .jpdb-reader-word {
      padding: 0 .08em;
      border-radius: .12em;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .jpdb-reader-newtab-install {
      justify-self: end;
      color: var(--faint);
      font-size: 12px;
      font-weight: 760;
      text-decoration: none;
    }
    @media (max-width: 640px) {
      .jpdb-reader-newtab-shell { width: min(100vw - 18px, 560px); }
      .jpdb-reader-newtab-prompt { padding-inline: 16px; font-size: 2.35rem; }
      .jpdb-reader-newtab-kanji-mode .jpdb-reader-newtab-prompt { font-size: 2.7rem; }
      .jpdb-reader-newtab-controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .jpdb-reader-newtab-controls button { padding: 0 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="jpdb-reader-newtab jpdb-reader-newtab-revealed jpdb-reader-newtab-setup-mode" data-jpdb-reader-root="true" data-standalone-newtab="true">
    <div class="jpdb-reader-newtab-shell">
      <header class="jpdb-reader-newtab-topbar">
        <a class="jpdb-reader-newtab-brand" href="https://hrussellzfac023.github.io/yomu-reader/" aria-label="Open Yomu">
          <img src="../yomu-icon.svg" alt="" width="32" height="32">
        </a>
        <div class="jpdb-reader-newtab-mode" role="group" aria-label="Study mode">
          <button type="button" data-newtab-action="mode" data-mode="word" data-active="true">Word</button>
          <button type="button" data-newtab-action="mode" data-mode="kanji">Kanji</button>
        </div>
        <button class="jpdb-reader-newtab-theme" type="button" data-newtab-action="theme" aria-label="Switch theme" title="Switch theme"><span data-newtab-theme-icon aria-hidden="true">☾</span></button>
        <a class="jpdb-reader-newtab-overflow" href="https://hrussellzfac023.github.io/yomu-reader/" aria-label="Open Yomu">...</a>
      </header>
      <section class="jpdb-reader-newtab-study" data-newtab-study>
        <div class="jpdb-reader-newtab-count" data-newtab-count></div>
        <div class="jpdb-reader-newtab-prompt" data-newtab-prompt lang="en">Start with a dictionary</div>
        <div class="jpdb-reader-newtab-answer" data-newtab-answer>
          <div class="jpdb-reader-newtab-reading" data-newtab-reading>Add a dictionary to turn this page into study cards.</div>
          <div class="jpdb-reader-newtab-meaning" data-newtab-meaning>It stays in this browser and is ready whenever a new tab opens.</div>
        </div>
        <div class="jpdb-reader-newtab-status" data-newtab-status></div>
      </section>
      <nav class="jpdb-reader-newtab-controls" aria-label="Study navigation">
        <button type="button" data-newtab-action="load-dictionary">Add dictionary</button>
      </nav>
      <a class="jpdb-reader-newtab-install" href="https://hrussellzfac023.github.io/yomu-reader/" target="_blank" rel="noopener">Get Yomu</a>
    </div>
  </main>
  <script>
    (() => {
      const root = document.querySelector('[data-jpdb-reader-root]');
      const themeKey = 'yomu-page-theme';
      const effectiveTheme = () => {
        const saved = localStorage.getItem(themeKey);
        if (saved === 'dark' || saved === 'light') return saved;
        return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      };
      const applyTheme = theme => {
        document.documentElement.classList.toggle('jpdb-reader-theme-dark', theme === 'dark');
        document.documentElement.classList.toggle('jpdb-reader-theme-light', theme === 'light');
        const icon = root.querySelector('[data-newtab-theme-icon]');
        const button = root.querySelector('[data-newtab-action="theme"]');
        if (icon) icon.textContent = theme === 'dark' ? '☀' : '☾';
        if (button) {
          const label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
          button.setAttribute('aria-label', label);
          button.title = label;
        }
      };
      applyTheme(effectiveTheme());
      const loadRuntime = () => {
        if (document.querySelector('script[data-yomu-runtime]')) return;
        root.querySelector('[data-newtab-status]').textContent = 'Loading よむ...';
        const script = document.createElement('script');
        script.dataset.yomuRuntime = 'true';
        script.src = '../yomu.user.js';
        document.body.append(script);
      };
      root.addEventListener('click', event => {
        if (event.target.closest('[data-newtab-action="load-dictionary"]')) {
          sessionStorage.setItem('jpdb-reader-newtab-install-dictionary', '1');
          loadRuntime();
          return;
        }
        if (event.target.closest('[data-newtab-action="theme"]')) {
          const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
          localStorage.setItem(themeKey, next);
          applyTheme(next);
          return;
        }
        const modeButton = event.target.closest('[data-mode]');
        if (modeButton) {
          root.querySelectorAll('[data-mode]').forEach(button => button.dataset.active = String(button === modeButton));
        }
      });
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    })();
  </script>
  <script>
    if (!new URLSearchParams(location.search).has('static')) {
      const script = document.createElement('script');
      script.src = '../yomu.user.js';
      document.body.append(script);
    }
  </script>
</body>
</html>
